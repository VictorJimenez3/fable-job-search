<!doctype html>
<meta charset="utf-8">
<title>Greenhouse fixture</title>
<main data-provider="greenhouse" data-job-radar-fixture>
  <h1>Greenhouse Data Engineer</h1>
  <form>
    <label>First name <input name="first_name" required></label>
    <label>Last name <input name="last_name" required></label>
    <label>Current location <input name="location"></label>
    <label>Resume <input name="resume" type="file" accept="application/pdf" required></label>
    <label>AI experience <textarea name="ai_experience" required></textarea></label>
    <button type="submit" data-job-radar-field="submit" data-is-submit="true">Submit</button>
  </form>
</main>
