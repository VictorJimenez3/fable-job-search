<!doctype html>
<meta charset="utf-8">
<title>Lever fixture</title>
<main data-provider="lever" data-job-radar-fixture>
  <h1>Lever Software Engineer</h1>
  <form>
    <label>Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Resume <input name="resume_file" type="file" accept=".pdf" required></label>
    <label>Portfolio <input name="portfolio_link" type="url"></label>
    <label>Additional information <textarea name="additional_information"></textarea></label>
    <button type="submit" data-job-radar-field="submit" data-is-submit="true">Apply</button>
  </form>
</main>
