# Curated seed registry. Tokens are validated by a live probe on first run;
# anything that 404s is marked invalid and never fetched again, so an
# imperfect guess here is harmless. The registry auto-expands at runtime by
# harvesting ATS tokens out of every job URL the aggregators surface — this
# file is just the starting point, not the ceiling.
#
# ats: greenhouse | lever | ashby | smartrecruiters | recruitee | workday
# workday entries need extra: {host: wd5, site: SiteName}

