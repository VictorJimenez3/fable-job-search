# SHPE 2026 National Convention — "STEM for the BOLD"
# Oct 28–31, 2026 · Indiana Convention Center, Indianapolis, IN
# Career fair: 300+ companies. Register early; upload resume to SHPExchange.
#
# status: confirmed = seen on an official 2026 source; historical = consistent
# multi-year exhibitor, near-certain to return. Append freely as the official
# exhibitor list fills in (careercenter.shpe.org/directory).
# Companies on this list get a small ranking boost + `SHPE` context — a posting
# from a SHPE exhibitor is also a warm-intro opportunity at the booth.

