llm:
  # Provider resolution (radar/llm.py): ANTHROPIC_API_KEY -> Claude;
  # else LLM_BASE_URL (OpenAI-compatible: Ollama on your Mac at
  # http://localhost:11434/v1, or a free Gemini key via Google AI Studio's
  # compat endpoint); else heuristics-only. Jobs scoring within `rerank_band`
  # of the alert threshold get semantically re-ranked, and every alerted job
  # gets a one-line "angle" note.
  enabled_if_key_present: true
  model: claude-haiku-4-5        # used when ANTHROPIC_API_KEY is set
  local_model: qwen3:30b         # 19GB MoE: strongest fit for the M1 Max 64GB companion
  rerank_band: 14

workday_queries:             # search terms used against Workday tenants
  - new grad
  - university graduate
  - early career
  - leadership development
  - graduate program
  - rotational program
  - emerging talent

notion:
  # database_id is no longer used for lookup — the Applications database is
  # found automatically by searching for a title containing "application"
  # among whatever's shared with the Job Radar integration (see
  # radar/notion_sync.py:resolve_database). Rename or recreate the tracker
  # freely; nothing here needs to change.
  stage_applied: Applied
  # status a checkbox-tracked (not yet applied) job gets. Must be an existing
  # option of your Stage status column — the Notion API cannot create status
  # options. Verified live 2026-07-11: your to-do group's only option is
  # "Waiting for a referral", so that's the explicit choice (it was already
  # landing there as the database default). If you add a cleaner option in
  # Notion (e.g. "To apply"), change this to match.
  stage_saved: Waiting for a referral
  # Lifecycle stages the email watcher drives automatically when it detects a
  # rejection / interview invite / online-assessment / long silence. Each must
  # be an existing Stage option (verified live against "2026 Applications"
  # 2026-07-12). The watcher only ever advances a stage, never regresses it.
  stage_oa: OA
  stage_interview: Interview
  stage_rejected: Rejected
  stage_closed: CLOSED
  autoclose_days: 45     # applied with no response after this long -> CLOSED
  position_map:              # role bucket -> existing options in your Position multi-select
    ai_ml: AI/ML Software Engineer
    ml_eng: Machine Learning Enginner   # (sic — matches the existing option in your DB)
    data_science: Data Science
    data_eng: Data Engineer
    swe: Software Engineer
