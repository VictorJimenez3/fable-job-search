# Chemical Engineering Internship Radar profile.
# This branch is intentionally generic: fill in the candidate identity and
# Notion option names before connecting personal accounts.

profile_mode: chemical_engineering_internship

candidate:
  name: Chemical Engineering Candidate
  github: ""
  grad_year: null
  level: internship
  discipline: chemical_engineering
  # International-student-safe default. Set false if sponsorship is not needed.
  needs_sponsorship: true
  narrative: >
    Undergraduate chemical engineering student seeking United States internships
    and co-ops in chemical/process engineering, manufacturing and operations,
    bioprocess and pharmaceutical manufacturing, materials and semiconductors,
    environmental engineering, and quality/process safety. Prioritize roles with
    hands-on plant, lab, scale-up, process improvement, or production experience.

culture_criteria: >
  A supportive chemical engineering internship with meaningful technical work,
  strong safety culture, accessible mentorship, and exposure to real processes,
  plants, labs, scale-up, manufacturing, or sustainability. Prefer employers
  that develop interns, respect work-life balance, and clearly explain work
  authorization and relocation expectations.

roles:
  chemical_process: 28
  bioprocess_pharma: 25
  manufacturing_ops: 23
  materials_semiconductor: 21
  environmental_safety: 19
  quality_validation: 17
  general_engineering: 10

sectors:
  chemicals_materials: 16
  pharma_biotech: 15
  energy: 12
  semiconductors: 11
  consumer_manufacturing: 9
  environmental: 8
  engineering_consulting: 6
  other: 0

bonuses:
  explicit_internship_title: 14
  fresh_24h: 12
  fresh_72h: 6
  fresh_7d: 2
  remote: 0                 # most useful Cheme internships are site/lab based
  feedback_company_max: 8
  feedback_tokens_max: 6

locations:
  countries: [US]
  remote_ok: true

thresholds:
  alert: 64
  dashboard: 42
  max_posting_age_days: 21  # internship recruiting often has longer lead times
  pay_bank: 999999          # disabled for internships; kept for schema compatibility

# Generic "Engineering Intern" titles are only alertable in these sectors.
priority_sectors:
  - chemicals_materials
  - pharma_biotech
  - energy
  - semiconductors
  - consumer_manufacturing
  - environmental

# Only these registry sectors are polled on this branch. This prevents the
# inherited tech registry from consuming the direct-ATS budget.
registry_sectors:
  - chemicals_materials
  - pharma_biotech
  - energy
  - semiconductors
  - consumer_manufacturing
  - environmental
  - engineering_consulting

# Simplify's Summer 2026 feed was live-checked on 2026-07-18. The similarly
# named Summer 2027 community feed is intentionally disabled because its rows
# were stale enough to be rejected by the freshness gate.
aggregator_sources: [simplify]

# The inherited SHPE exhibitor list belongs to the original candidate. Turn on
# only if this student is attending and the file has been reviewed for ChemE.
conference_boost_enabled: false

marquee_companies:
  - Dow
  - 3M
  - Chevron
  - Shell
  - Ecolab
  - Albemarle
  - Johnson & Johnson
  - Merck
  - Pfizer
  - Eli Lilly
  - Bristol Myers Squibb
  - Gilead
  - Amgen
  - Regeneron
  - GSK
  - Novartis
  - Moderna
  - Thermo Fisher Scientific
  - Micron
  - Applied Materials
  - GlobalFoundries
  - Medtronic
  - Stryker
  - Tesla

llm:
  enabled_if_key_present: true
  model: claude-haiku-4-5
  local_model: qwen3:30b
  rerank_band: 14

workday_queries:
  - chemical engineering intern
  - process engineering intern
  - manufacturing engineering intern
  - bioprocess intern
  - materials engineering intern
  - environmental engineering intern
  - engineering co-op

notion:
  stage_applied: Applied
  stage_saved: Not started
  stage_oa: OA
  stage_interview: Interview
  stage_rejected: Rejected
  stage_closed: CLOSED
  autoclose_days: 60
  position_map:
    chemical_process: Chemical / Process Engineering
    bioprocess_pharma: Bioprocess / Pharma
    manufacturing_ops: Manufacturing / Operations
    materials_semiconductor: Materials / Semiconductor
    environmental_safety: Environmental / Safety
    quality_validation: Quality / Validation
    general_engineering: Engineering Internship
    default: Engineering Internship
