  # big tech / MANGA
  - Meta
  - Apple
  - Amazon
  - Netflix
  - Google
  - Microsoft
  - NVIDIA
  # massive AI labs
  - Anthropic
  - OpenAI
  - DeepMind
  # cracked pharma / medtech
  - Genentech
  - Moderna
  - Regeneron
  - Vertex Pharmaceuticals
  - Eli Lilly
  - Merck
  - Medtronic
  - Intuitive Surgical
  - Stryker
  # sensors / wearables / med devices — Victor's sweet spot (added 2026-07-16;
  # safe now that marquee no longer bypasses field fit)
  - WHOOP
  - Oura
  - Dexcom
  - Abbott
  # sports / games / education companies Victor explicitly called out
  - Nike
  - ESPN
  - Fanatics
  - PlayStation
  - Sony Interactive Entertainment
  - Nintendo
