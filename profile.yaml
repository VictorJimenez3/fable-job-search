# JobRadar candidate profile — edit freely; the ranker reads this on every run.
# Nothing here is code. Weights are additive points on a 0-100 score.

candidate:
  name: Victor Jimenez
  github: VictorJimenez3
  grad_year: 2026
  level: new_grad          # gates out senior/staff/manager/intern automatically
  degree: bachelors        # requirements above this level are a major mismatch
  # Set true if you need visa sponsorship: postings whose scraped text says
  # "no sponsorship / citizens only" then drop off alerts (dashboard keeps
  # them, with the reason). Either way the flag is shown per job.
  needs_sponsorship: false
  narrative: >
    Graduating senior targeting full-time new-grad roles in AI/ML engineering,
    software engineering, and data science. Strongest interest in healthcare /
    health tech, big tech, sports, videogames, and education; genuinely open to
    AI-native companies, edtech, fintech, and startups. Has interned/applied across big tech and
    financial services (Amazon, NVIDIA, Microsoft, Google, Capital One, BNY,
    Mastercard, Adobe, Pinterest, OpenAI, Commure, IXL). Values working on
    products with real-world impact and modern ML stacks.

# Used by the Culture Compass (radar/culture.py) to judge company fit —
# LLM dossiers are generated against this, and fit feeds ranking (±6 pts).
culture_criteria: >
  A top-tier AI or data science role that balances elite prestige and high
  new-grad pay with a fast, innovative tech culture rather than slow
  bureaucracy. A mission-driven company that actually respects work-life
  balance through sane hours and guaranteed shutdowns, avoiding toxic or
  high-burnout environments. A place that accelerates technical learning and
  career growth without sacrificing personal time.

roles:
  # max one bucket counts (the best match). points: title-keyword buckets
  # New-grad evidence is a gate; these weights order the eligible roles.
  ai_ml: 26
  data_science: 23
  swe: 20
  data_eng: 17
  # titles must match at least one bucket to be considered a tech role at all

sectors:
  healthtech: 16
  sports: 12
  video_games: 12
  ai_lab: 11
  big_tech: 10
  edtech: 8
  fintech: 5
  other: 0

bonuses:
  explicit_new_grad_title: 45  # new-grad evidence is the dominant ranking dimension
  leadership_program: 8         # technical graduate/rotational programs get a secondary lift
  target_program_company: 4    # researched healthcare program employers
  marquee_company: 8            # prestige matters after new-grad + role fit
  fresh_24h: 6
  fresh_72h: 3
  fresh_7d: 1
  remote: 2
  feedback_company_max: 8      # learned from what you actually apply to
  feedback_tokens_max: 6

locations:
  countries: [US]              # non-US-only postings are gated out
  remote_ok: true

thresholds:
  alert: 66        # >= this and new-grad-eligible → GitHub issue alert (checkbox row)
  dashboard: 45    # >= this → appears on the dashboard
  max_posting_age_days: 10   # older than this when first seen → never alerted (stale)
  pay_bank: 150000 # salary at/above this helps eligible roles; never bypasses new-grad fit

# Priority sectors still refine eligible roles, but do not bypass explicit
# new-grad/early-career evidence or the technical-program path.
priority_sectors:
  - healthtech

# Alert policy: generic aggregator/marquee/healthtech roles do not bypass the
# new-grad gate. Programs are matched against the posting title/description;
# only technical or data-oriented programs enter the alert stream.
programs:
  keywords:
    - leadership development
    - leadership program
    - rotational program
    - graduate program
    - graduate programme
    - emerging talent
    - future talent
    - technology accelerator
    - tldp
    - mldp
    - dsldp
    - eldp
  technical_keywords:
    - technology
    - information technology
    - digital
    - data science
    - data engineering
    - data analytics
    - analytics
    - it
    - artificial intelligence
    - machine learning
    - software engineering
    - engineering
    - cloud
    - devops
    - cybersecurity
    - automation
  target_healthcare_companies:
    - Johnson & Johnson
    - Merck
    - Pfizer
    - Bristol Myers Squibb
    - Roche
    - Catalent
    - Alcon

# Marquee companies provide a small competitive-context bonus only after the
# new-grad/early-career gate; they never make an experienced or off-field role
# alertable.
# Keep in sync with S.marquee in webapp/index.html (and its docs/platform copy).
