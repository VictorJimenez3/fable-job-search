<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar Agent</title><style>
body{width:360px;margin:0;padding:14px;background:#101820;color:#eef5f2;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:16px;margin:0 0 4px}h2{font-size:13px;margin:15px 0 6px}.muted{color:#a9bab4}.card{border:1px solid #33453f;border-radius:8px;padding:10px;margin:8px 0;background:#16221f}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button{background:#243a33;color:#eef5f2;border:1px solid #4caf8a;border-radius:5px;padding:6px 8px;cursor:pointer;font-size:12px}button.primary{background:#4caf8a;color:#08110d}input,textarea{width:100%;box-sizing:border-box;background:#0b1116;color:#eef5f2;border:1px solid #33453f;border-radius:5px;padding:7px;margin:4px 0 7px}label{display:block;color:#a9bab4;font-size:11px}ul{padding-left:19px}.danger{color:#ffb4a8}.success{color:#b7f3c8}pre{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:11px}
</style></head><body><h1>Job Radar Application Agent</h1><div id="status" class="muted">Loading…</div><div id="session"></div><h2>Pair this Mac</h2><label>Job Radar URL<input id="cloudUrl" placeholder="https://job-radar-newgrad.vercel.app"></label><label>Mac pairing token<input id="agentToken" type="password" placeholder="paste the one-time token"></label><div class="row"><button id="saveConfig" class="primary">save pairing</button><button id="sync">sync queue</button></div><p class="muted">The token grants this extension access only to your private application-agent Drive files. Revoke it from Job Radar.</p><script src="popup.js"></script></body></html>
