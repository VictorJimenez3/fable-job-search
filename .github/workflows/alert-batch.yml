name: alert email batches

on:
  schedule:
    - cron: "0 */4 * * *"   # six opportunities per day; empty batches send nothing
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-alert-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/newgrad-job-search-system-9gbj9k
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Send alert batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_EMAIL_BATCH_SIZE: "15"
          RADAR_EMAIL_BATCH_MIN: "3"
          RADAR_EMAIL_BATCH_MAX_WAIT_HOURS: "12"
          RADAR_EMAIL_BATCH_URGENT_SCORE: "92"
          RADAR_PROFILE: "new_grad"
        run: python -m radar.main email-batch
      - name: Commit notification state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state/notification_state.json
          if git diff --cached --quiet; then
            echo "no notification state change"; exit 0
          fi
          git commit -m "radar: record alert email batch"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
