name: internship radar

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-internship
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl and publish internship state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RADAR_PROFILE: internship
          RADAR_DOCS_DIR: docs/internships
          RADAR_DEFER_DELIVERY: "1"
          RADAR_MAX_COMPANIES: "250"
          RADAR_WORKERS: "6"
          RADAR_INTERNSHIP_MAX_HARVEST: "100"
          RADAR_INTERNSHIP_PROBE_BUDGET: "20"
          RADAR_INTERNSHIP_MAX_ALERTS: "35"
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          for i in 1 2 3 4; do
            python -m radar.main crawl
            python -m radar.main rescore
            git add state/intern_*.json docs/internships
            if git diff --cached --quiet; then
              echo "internship crawl: no generated-state changes"
              exit 0
            fi
            git commit -m "radar: internship crawl $(date -u +'%Y-%m-%d %H:%M')"
            if git push; then exit 0; fi
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          exit 1
      - name: Verify internship score coverage
        env:
          RADAR_PROFILE: internship
        run: python -m radar.main score-health
      - name: Deliver separate internship tracking surfaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_PROFILE: internship
        run: python -m radar.main deliver-alerts
