name: migrate-checkbox-applied

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Move old checkbox-applied entries back to shortlist, archive their Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m radar.main migrate-checkbox-applied

      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: migrate checkbox-applied entries to shortlist"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
