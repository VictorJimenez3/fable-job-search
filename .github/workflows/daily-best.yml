name: daily-best

on:
  schedule:
    - cron: "0 23 * * *"   # ~7pm ET: the day's top-10 digest issue (GitHub emails it)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/newgrad-job-search-system-9gbj9k
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Post today's best-of issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.main daily-best
