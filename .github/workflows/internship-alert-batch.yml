name: internship alert batches

on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-internship-alert-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Send opt-in internship batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_PROFILE: internship
          RADAR_EMAIL_BATCH_SIZE: "15"
          RADAR_EMAIL_BATCH_MIN: "3"
          RADAR_EMAIL_BATCH_MAX_WAIT_HOURS: "12"
          RADAR_EMAIL_BATCH_URGENT_SCORE: "92"
        run: python -m radar.main email-batch
      - name: Commit internship notification state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add -A state docs/internships
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: record internship alert batch"
          git pull --rebase --autostash || true
          git push
