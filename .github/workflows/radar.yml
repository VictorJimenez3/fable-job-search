name: radar

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may delay/queue these; effective cadence ~30-60 min
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl and safely publish state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_DEFER_DELIVERY: "1"
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          for i in 1 2 3 4; do
            python -m radar.main crawl
            git add state docs
            if git diff --cached --quiet; then
              echo "crawl: no generated-state changes"
              exit 0
            fi
            git commit -m "radar: crawl $(date -u +'%Y-%m-%d %H:%M')"
            if git push; then
              echo "crawl: published on attempt $i"
              exit 0
            fi
            # A crawl rewrites jobs/docs from a point-in-time source snapshot.
            # Never rebase that generated state.  Start over from current
            # production so neither side's discoveries or scores are dropped.
            echo "crawl: upstream moved; rebuilding from fresh production"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep $((i * 2))
          done

          echo "crawl: upstream kept moving; leaving production unchanged" >&2
          exit 1

      - name: Deliver idempotent tracking issues and master board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.main deliver-alerts
