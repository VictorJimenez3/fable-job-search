name: radar

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may delay/queue these; effective cadence ~30-60 min
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl, score, alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar.main crawl

      - name: Commit state + dashboard
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: crawl $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
