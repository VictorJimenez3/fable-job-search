name: reconcile-internship-checkboxes

on:
  schedule:
    - cron: "55 4,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: radar-internship-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Sweep internship alert issues for checked boxes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          RADAR_PROFILE: internship
        run: python -m radar.main reconcile-checkboxes
      - name: Commit internship tracker state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add -A state docs/internships
          if git diff --cached --quiet; then
            echo "no internship changes"; exit 0
          fi
          git commit -m "radar: internship checkbox reconcile $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
