name: workflow-recovery

on:
  workflow_run:
    workflows:
      - radar
      - enrich
      - tracker-sync
      - email-watch
      - applied-sync
      - reconcile-checkboxes
      - alert email batches
      - daily-best
      - score maintenance
      - sponsorship history
      - strategist
      - radar-report-sync
      - deploy platform to Vercel
      - internship radar
      - reconcile-internship-checkboxes
      - internship alert batches
      - cheme-radar
      - cheme-enrich
      - cheme-reconcile-checkboxes
      - cheme-daily-best
      - tests
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  retry-once:
    if: >-
      contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs once
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Automation failure: " + run.name;
            const body = [
              "Automation failed and its failed jobs were not rerun automatically.",
              "",
              "Workflow: " + run.name,
              "Run: " + run.html_url,
              "Branch: " + (run.head_branch || "unknown"),
              "Commit: " + run.head_sha,
              "Attempt: " + run.run_attempt,
              "",
              "Tell Codex: fix workflow run " + run.html_url,
            ].join("\n");
            async function findIssue() {
              const listed = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", per_page: 100,
              });
              return listed.find(issue => issue.title === title);
            }
            async function upsertIssue() {
              const existing = await findIssue();
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({owner, repo, title, body});
              }
            }
            try {
              const endpoint = run.conclusion === "cancelled" || run.conclusion === "timed_out"
                ? "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun"
                : "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs";
              await github.request(endpoint, {owner, repo, run_id: run.id});
              core.notice("Requested one automatic rerun for " + run.html_url);
            } catch (error) {
              await upsertIssue();
              core.setFailed(
                "Could not request the automatic rerun: " + error.message
              );
            }

  escalate-after-retry:
    if: >-
      contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
      - name: Open or update an actionable repair issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Automation failure: " + run.name;
            const body = [
              "The workflow still fails after one automatic rerun.",
              "",
              "Workflow: " + run.name,
              "Run: " + run.html_url,
              "Branch: " + (run.head_branch || "unknown"),
              "Commit: " + run.head_sha,
              "Attempt: " + run.run_attempt,
              "",
              "Tell Codex: fix workflow run " + run.html_url,
            ].join("\n");
            const listed = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = listed.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }

  close-recovered:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
      - name: Close the repair issue after recovery
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Automation failure: " + run.name;
            const listed = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = listed.find(issue => issue.title === title);
            if (!existing) {
              core.notice("Workflow recovered; no open repair issue found.");
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: "Recovered on automatic retry: " + run.html_url,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number,
              state: "closed", state_reason: "completed",
            });
