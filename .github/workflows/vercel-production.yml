name: deploy platform to Vercel

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/claude/newgrad-job-search-system-9gbj9k') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'claude/newgrad-job-search-system-9gbj9k')
    name: build, deploy, and keep the friendly alias current
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ALIAS: ${{ vars.VERCEL_ALIAS }}
      RADAR_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Check deployment settings
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing production secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing production variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing production variable VERCEL_PROJECT_ID"; exit 1; }
          test -n "$VERCEL_ALIAS" || { echo "Missing production variable VERCEL_ALIAS"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.3

      - name: Link the production Vercel project
        run: vercel link --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Build typed platform assets
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Build production output
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Deploy and promote production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" | tail -n 1)"
          test -n "$url" || { echo "Vercel returned no deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment=$url"

      - name: Wait for the deployment to become ready
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --wait --timeout 5m --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Point the friendly URL at this deployment
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$VERCEL_ALIAS" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify the friendly URL serves this build
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://$VERCEL_ALIAS/" | grep -Fq "job-radar-build\" content=\"$RADAR_BUILD_SHA\""; then
              echo "friendly alias is serving the new platform build"
              exit 0
            fi
            sleep 10
          done
          echo "friendly alias did not expose the expected platform marker"
          exit 1
