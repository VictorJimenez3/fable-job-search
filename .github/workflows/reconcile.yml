name: reconcile-checkboxes

on:
  schedule:
    - cron: "45 4,16 * * *"   # twice daily: catch any checkbox tick a webhook missed
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/newgrad-job-search-system-9gbj9k
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sweep all radar issues for checked boxes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
        run: python -m radar.main reconcile-checkboxes
      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: checkbox reconcile $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
