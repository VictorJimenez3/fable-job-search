name: strategist

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  memo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Post weekly strategy memo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python -m radar.main strategist
