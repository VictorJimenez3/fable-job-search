name: enrich

# Cloud twin of the Mac companion's enrichment cycle (culture dossiers,
# re-score, weekly scout, quality pass). No-ops in seconds unless an LLM is
# configured via secrets: ANTHROPIC_API_KEY, or LLM_BASE_URL(+LLM_API_KEY,
# LLM_MODEL) for any OpenAI-compatible endpoint. Forks without a Mac get the
# same intelligence layer this way.

on:
  schedule:
    - cron: "20 7 * * *"   # nightly, offset from the crawl's */30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar          # never overlap a crawl's state commit
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enrich
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m radar.main enrich

      - name: Commit state + docs
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: cloud enrich $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
