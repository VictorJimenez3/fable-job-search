name: enrich

# Cloud twin of the Mac companion's enrichment cycle (culture dossiers,
# re-score, weekly scout, quality pass). No-ops in seconds unless an LLM is
# configured. Named NVIDIA NIM keys are task-routed with hard budgets and
# model fallback; generic OpenAI-compatible and Anthropic settings remain
# backwards compatible.

on:
  schedule:
    - cron: "20 */2 * * *"   # every 2h; bounded calls drain the AI queue while free keys rotate
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar          # never overlap a crawl's state commit
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enrich and safely publish additive AI caches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
          NVIDIA_GLM_52_API_KEY: ${{ secrets.NVIDIA_GLM_52_API_KEY }}
          NVIDIA_GLM_52_MODEL: ${{ vars.NVIDIA_GLM_52_MODEL }}
          NVIDIA_DEEPSEEK_V4_PRO_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_V4_PRO_API_KEY }}
          NVIDIA_DEEPSEEK_V4_PRO_MODEL: ${{ vars.NVIDIA_DEEPSEEK_V4_PRO_MODEL }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY: ${{ secrets.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL: ${{ vars.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL }}
          NVIDIA_KIMI_K2_6_API_KEY: ${{ secrets.NVIDIA_KIMI_K2_6_API_KEY }}
          NVIDIA_KIMI_K2_6_MODEL: ${{ vars.NVIDIA_KIMI_K2_6_MODEL }}
          RADAR_AI_MAX_CALLS: "12"
          RADAR_AI_MAX_REQUESTS: "18"
          RADAR_AI_PROVIDER_ATTEMPTS: "2"
          RADAR_AI_ROTATE_PROVIDERS: "1"
          RADAR_QUALITY_LIMIT: "10"
          RADAR_COMPANY_RESEARCH_LIMIT: "8"
          RADAR_COMPANY_RESEARCH_MAX_TOKENS: "2200"
          RADAR_COMPANY_WEB_RESEARCH_LIMIT: "12"
          RADAR_ENRICH_LIMIT: "0"
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          python -m radar.main enrich

          commit_state() {
            git add state docs
            git diff --cached --quiet && return 1
            git commit -m "radar: cloud enrich $(date -u +'%Y-%m-%d %H:%M')"
          }
          commit_state || { echo "enrich: no generated-state changes"; exit 0; }

          for i in 1 2 3 4; do
            if git push; then
              echo "enrich: published on attempt $i"
              exit 0
            fi
            # AI outputs are caches, not a second authoritative jobs snapshot.
            # Preserve only additive evidence, reset to production, reapply it,
            # and deterministically rebuild scores/docs without another API call.
            echo "enrich: upstream moved; merging additive AI caches"
            checkpoint_dir="$(mktemp -d)"
            cp state/jobs.json "$checkpoint_dir/jobs.json"
            cp state/culture.json "$checkpoint_dir/culture.json"
            cp state/company_research.json "$checkpoint_dir/research.json" 2>/dev/null || printf '{}' > "$checkpoint_dir/research.json"
            cp state/ai_usage.json "$checkpoint_dir/usage.json" 2>/dev/null || printf '{}' > "$checkpoint_dir/usage.json"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            MERGE_JOBS="$checkpoint_dir/jobs.json" \
            MERGE_CULTURE="$checkpoint_dir/culture.json" \
            MERGE_RESEARCH="$checkpoint_dir/research.json" \
            MERGE_AI_USAGE="$checkpoint_dir/usage.json" \
              python scripts/mac-companion/merge_state.py
            rm -rf "$checkpoint_dir"
            python -m radar.main rescore
            commit_state || { echo "enrich: production already contains merged evidence"; exit 0; }
            sleep $((i * 2))
          done
          echo "enrich: upstream kept moving; leaving production unchanged" >&2
          exit 1
