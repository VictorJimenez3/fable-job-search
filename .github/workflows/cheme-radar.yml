name: cheme-radar

# GitHub loads schedules only from the default branch. This workflow runs the
# independent ChemE branch while reusing this repository's optional Notion key.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: cheme-radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cheme-intern-radar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl, score, and update the ChemE board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_ALERT_ASSIGNEE: ak2943
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar.main crawl
      - name: Commit ChemE state and generated docs
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar(cheme): crawl $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
