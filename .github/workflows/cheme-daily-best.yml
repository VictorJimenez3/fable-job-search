name: cheme-daily-best

on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: claude/cheme-intern-radar
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ChemE dependencies
        run: python -m pip install -r requirements.txt
      - name: Post the ChemE daily best-of issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_ALERT_ASSIGNEE: ak2943
        run: python -m radar.main daily-best
