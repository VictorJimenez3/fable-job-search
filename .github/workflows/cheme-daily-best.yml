name: cheme-daily-best

on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: claude/cheme-intern-radar
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ChemE dependencies
        run: python -m pip install -r requirements.txt
      - name: Post the ChemE daily best-of issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_ALERT_ASSIGNEE: ak2943
        run: python -m radar.main daily-best
