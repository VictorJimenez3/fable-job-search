name: cheme-daily-best

on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cheme-intern-radar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post the ChemE daily best-of issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_ALERT_ASSIGNEE: ak2943
        run: python -m radar.main daily-best
