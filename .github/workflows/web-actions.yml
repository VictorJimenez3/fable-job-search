name: web-actions

on:
  repository_dispatch:
    types: [radar-web]

permissions:
  contents: write

concurrency:
  group: applied-sync   # same state files as applied-sync; don't race it
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.client_payload.profile == 'cheme' && 'claude/cheme-intern-radar' || github.event.repository.default_branch }}
      # Web actions can target the independent ChemE branch. Keep this setup
      # compatible with its requirements-based environment during migration.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install checked-out branch dependencies
        run: python -m pip install -r requirements.txt
      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          for i in 1 2 3 4; do
            # Re-run the idempotent action from the newest production state
            # after a push race. Rebase is unsafe for generated JSON and can
            # leave a worker wedged between state writers.
            git fetch origin "$RADAR_BRANCH"
            git reset --hard "origin/$RADAR_BRANCH"
            python -m radar.main web-action
            git add state
            # The ChemE checkout and older new-grad snapshots do not always
            # have both feedback mirrors.  Stage each generated companion only
            # when that branch actually owns it; a missing optional path must
            # not turn a successful web action into an exit-128 failure.
            for feedback_path in docs/FEEDBACK.md docs/internships/FEEDBACK.md; do
              if [[ -e "$feedback_path" ]]; then
                git add "$feedback_path"
              fi
            done
            if git diff --cached --quiet; then
              echo "no changes"; exit 0
            fi
            git commit -m "radar: web-action $(date -u +'%Y-%m-%d %H:%M')"
            git push origin "HEAD:${RADAR_BRANCH}" && exit 0
            git reset --hard "origin/$RADAR_BRANCH"
            sleep $((i * 2))
          done
          echo "web-action: upstream kept moving; leaving production unchanged" >&2
          exit 1
        env:
          RADAR_BRANCH: ${{ github.event.client_payload.profile == 'cheme' && 'claude/cheme-intern-radar' || github.event.repository.default_branch }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          RADAR_PROFILE: ${{ github.event.client_payload.profile == 'internship' && 'internship' || github.event.client_payload.profile == 'cheme' && 'cheme' || 'new_grad' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
          NVIDIA_GLM_52_API_KEY: ${{ secrets.NVIDIA_GLM_52_API_KEY }}
          NVIDIA_GLM_52_MODEL: ${{ vars.NVIDIA_GLM_52_MODEL }}
          NVIDIA_DEEPSEEK_V4_PRO_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_V4_PRO_API_KEY }}
          NVIDIA_DEEPSEEK_V4_PRO_MODEL: ${{ vars.NVIDIA_DEEPSEEK_V4_PRO_MODEL }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY: ${{ secrets.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL: ${{ vars.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL }}
          NVIDIA_KIMI_K2_6_API_KEY: ${{ secrets.NVIDIA_KIMI_K2_6_API_KEY }}
          NVIDIA_KIMI_K2_6_MODEL: ${{ vars.NVIDIA_KIMI_K2_6_MODEL }}
          RADAR_COMPANY_RESEARCH_WORKERS: "5"
          RADAR_AI_MAX_CALLS: "5"
          RADAR_AI_MAX_REQUESTS: "10"
          RADAR_AI_PROVIDER_ATTEMPTS: "2"
