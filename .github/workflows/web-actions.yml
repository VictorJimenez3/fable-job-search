name: web-actions

on:
  repository_dispatch:
    types: [radar-web]

permissions:
  contents: write

concurrency:
  group: applied-sync   # same state files as applied-sync; don't race it
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.client_payload.profile == 'cheme' && 'claude/cheme-intern-radar' || github.event.repository.default_branch }}
      # Web actions can target the independent ChemE branch. Keep this setup
      # compatible with its requirements-based environment during migration.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install checked-out branch dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply platform action (tracking, Notion, or owner-requested company research)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          RADAR_PROFILE: ${{ github.event.client_payload.profile == 'internship' && 'internship' || github.event.client_payload.profile == 'cheme' && 'cheme' || 'new_grad' }}
          # The research action is owner-only at the Vercel boundary; hosted
          # model credentials remain workflow secrets and are never sent to a
          # visitor's browser.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
          NVIDIA_GLM_52_API_KEY: ${{ secrets.NVIDIA_GLM_52_API_KEY }}
          NVIDIA_GLM_52_MODEL: ${{ vars.NVIDIA_GLM_52_MODEL }}
          NVIDIA_DEEPSEEK_V4_PRO_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_V4_PRO_API_KEY }}
          NVIDIA_DEEPSEEK_V4_PRO_MODEL: ${{ vars.NVIDIA_DEEPSEEK_V4_PRO_MODEL }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY: ${{ secrets.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL: ${{ vars.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL }}
          NVIDIA_KIMI_K2_6_API_KEY: ${{ secrets.NVIDIA_KIMI_K2_6_API_KEY }}
          NVIDIA_KIMI_K2_6_MODEL: ${{ vars.NVIDIA_KIMI_K2_6_MODEL }}
          # Research the opened employer first and warm a few likely next
          # clicks concurrently, using the existing bounded provider router.
          RADAR_COMPANY_RESEARCH_WORKERS: "5"
          RADAR_AI_MAX_CALLS: "5"
          RADAR_AI_MAX_REQUESTS: "10"
          RADAR_AI_PROVIDER_ATTEMPTS: "2"
        run: python -m radar.main web-action
      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state docs/FEEDBACK.md docs/internships/FEEDBACK.md
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: web-action $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
