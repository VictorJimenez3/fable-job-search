name: web-actions

on:
  repository_dispatch:
    types: [radar-web]

permissions:
  contents: write

concurrency:
  group: applied-sync   # same state files as applied-sync; don't race it
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/newgrad-job-search-system-9gbj9k
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply platform action (track / applied → Notion)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m radar.main web-action
      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: web-action $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
