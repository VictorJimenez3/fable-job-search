name: notion-verify

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Check NOTION_TOKEN can see the Applications database (read-only, creates nothing)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m radar.main notion-verify
