name: email-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # same cadence as the crawler; best-effort per GitHub's scheduler
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: email-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Detect confirmed applications from email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
        run: python -m radar.main email-watch

      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: email-watch $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
