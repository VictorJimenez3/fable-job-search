name: email-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # same cadence as the crawler; best-effort per GitHub's scheduler
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: applied-sync
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar

      - name: Check email automation configuration
        env:
          EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
        run: |
          if [ "$EMAIL_BACKEND" = "gmail_api" ] && { [ -z "$GMAIL_REFRESH_TOKEN" ] || [ -z "$GOOGLE_AUTH_CLIENT_ID" ] || [ -z "$GOOGLE_AUTH_CLIENT_SECRET" ]; }; then
            echo "::warning::Gmail API lifecycle automation is disabled: add its refresh token and Google OAuth credentials."
          elif [ "$EMAIL_BACKEND" != "gmail_api" ] && { [ -z "$EMAIL_ADDRESS" ] || [ -z "$EMAIL_APP_PASSWORD" ]; }; then
            echo "::warning::Email lifecycle automation is disabled: add EMAIL_ADDRESS and EMAIL_APP_PASSWORD repository secrets."
          fi

      - name: Detect confirmed applications from email
        env:
          EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
          RADAR_EMAIL_LOOKBACK_DAYS: "21"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
        run: python -m radar.main email-watch

      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: email-watch $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
