name: company research backfill

on:
  schedule:
    # A short relay interval keeps the worker effectively continuous when a
    # prior drain exits early or pauses behind provider retry cooldowns. The
    # concurrency group admits only one running job plus the newest pending
    # relay, so this cannot build an unbounded Actions queue.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-company-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Drain company dossier backlog in checkpoints
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
          NVIDIA_GLM_52_API_KEY: ${{ secrets.NVIDIA_GLM_52_API_KEY }}
          NVIDIA_GLM_52_MODEL: ${{ vars.NVIDIA_GLM_52_MODEL }}
          NVIDIA_DEEPSEEK_V4_PRO_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_V4_PRO_API_KEY }}
          NVIDIA_DEEPSEEK_V4_PRO_MODEL: ${{ vars.NVIDIA_DEEPSEEK_V4_PRO_MODEL }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY: ${{ secrets.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL: ${{ vars.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL }}
          NVIDIA_KIMI_K2_6_API_KEY: ${{ secrets.NVIDIA_KIMI_K2_6_API_KEY }}
          NVIDIA_KIMI_K2_6_MODEL: ${{ vars.NVIDIA_KIMI_K2_6_MODEL }}
          RADAR_AI_MAX_CALLS: "10000"
          RADAR_AI_MAX_REQUESTS: "10000"
          # Smooth the shared provider traffic: one actual send every two
          # seconds, including retries, instead of model-race bursts.
          RADAR_AI_REQUESTS_PER_MINUTE: "30"
          RADAR_AI_PROVIDER_ATTEMPTS: "2"
          RADAR_AI_ROTATE_PROVIDERS: "0"
          RADAR_AI_TASK_COMPANY_RESEARCH_LIMIT: "10000"
          RADAR_COMPANY_RESEARCH_WEB_BATCH: "10"
          # Two provider attempts per dossier share the 30-RPM global gate.
          # Twelve concurrent dossiers keep that gate occupied during normal
          # API latency without exceeding the configured allowance.
          RADAR_COMPANY_RESEARCH_SYNTH_BATCH: "12"
          RADAR_COMPANY_RESEARCH_WORKERS: "12"
          RADAR_COMPANY_RESEARCH_MAX_TOKENS: "2200"
          RADAR_COMPANY_RESEARCH_TIMEOUT: "75"
          RADAR_COMPANY_RESEARCH_MAX_AGE_DAYS: "365"
          RADAR_COMPANY_RESEARCH_WEB_RESEARCH_LIMIT: "0"
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          # Keep draining until the queue is empty or GitHub's job limit ends
          # this worker. Every cycle is independently checkpointed, so the
          # next scheduled run resumes safely without a manual dispatch.
          for cycle in $(seq 1 1000); do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            set +e
            RADAR_BACKFILL_CYCLES=1 python -u scripts/backfill_company_research.py
            result=$?
            set -e
            git add state/company_research.json state/ai_usage.json
            if git diff --cached --quiet; then
              echo "backfill: no checkpoint changes"; exit 0
            fi
            git commit -m "radar: checkpoint company research backfill"
            pushed=0
            for attempt in 1 2 3 4; do
              if git push; then pushed=1; break; fi
              # Generated JSON does not rebase safely. Preserve this completed
              # checkpoint, reset to newest production, and merge only the
              # additive research/telemetry caches.
              checkpoint_dir="$(mktemp -d)"
              git show HEAD:state/company_research.json > "$checkpoint_dir/research.json"
              git show HEAD:state/ai_usage.json > "$checkpoint_dir/usage.json"
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              printf '{}' > "$checkpoint_dir/empty.json"
              MERGE_JOBS="$checkpoint_dir/empty.json" \
              MERGE_CULTURE="$checkpoint_dir/empty.json" \
              MERGE_RESEARCH="$checkpoint_dir/research.json" \
              MERGE_AI_USAGE="$checkpoint_dir/usage.json" \
                python scripts/mac-companion/merge_state.py
              git add state/company_research.json state/ai_usage.json
              git commit -m "radar: merge company research checkpoint"
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "backfill: could not push checkpoint" >&2
              exit 1
            fi
            if [ "$result" -eq 2 ]; then
              echo "backfill: queue exhausted"
              exit 0
            fi
          done
          echo "backfill: checkpoint limit reached; scheduled worker will resume"
