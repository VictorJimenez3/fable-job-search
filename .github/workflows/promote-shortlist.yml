name: promote-shortlist-applications

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up frozen Radar environment
        uses: ./.github/actions/setup-radar
      - name: Promote every existing checkbox selection and write it to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRACKER_BACKEND: ${{ vars.TRACKER_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
        run: python -m radar.main promote-shortlist
      - name: Commit state
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar: promote shortlist applications"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
