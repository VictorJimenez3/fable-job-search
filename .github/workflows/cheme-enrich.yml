name: cheme-enrich

# Scheduled workflows only load from the default branch, so this orchestrator
# checks out and enriches the independent ChemE board without duplicating its
# Notion database or exposing AI keys to the 30-minute crawl.
on:
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cheme-radar
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cheme-intern-radar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enrich ChemE roles and company research
        env:
          NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
          NVIDIA_GLM_52_API_KEY: ${{ secrets.NVIDIA_GLM_52_API_KEY }}
          NVIDIA_GLM_52_MODEL: ${{ vars.NVIDIA_GLM_52_MODEL }}
          NVIDIA_DEEPSEEK_V4_PRO_API_KEY: ${{ secrets.NVIDIA_DEEPSEEK_V4_PRO_API_KEY }}
          NVIDIA_DEEPSEEK_V4_PRO_MODEL: ${{ vars.NVIDIA_DEEPSEEK_V4_PRO_MODEL }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY: ${{ secrets.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_API_KEY }}
          NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL: ${{ vars.NVIDIA_NEMOTRON_3_ULTRA_550B_A55B_MODEL }}
          NVIDIA_KIMI_K2_6_API_KEY: ${{ secrets.NVIDIA_KIMI_K2_6_API_KEY }}
          NVIDIA_KIMI_K2_6_MODEL: ${{ vars.NVIDIA_KIMI_K2_6_MODEL }}
          RADAR_AI_MAX_CALLS: "8"
          RADAR_AI_MAX_REQUESTS: "12"
          RADAR_AI_PROVIDER_ATTEMPTS: "2"
          RADAR_QUALITY_LIMIT: "3"
          RADAR_COMPANY_RESEARCH_LIMIT: "3"
          RADAR_ENRICH_LIMIT: "0"
        run: python -m radar.main enrich
      - name: Commit ChemE state and generated docs
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar(cheme): cloud enrich $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          git push
