thresholds:
  alert: 60
  dashboard: 35
  max_posting_age_days: 30
  pay_bank: 150000

locations:
  countries: [US]
  remote_ok: true

# Queries are deliberately bounded and independent from the faster new-grad
# workflow. Full-board ATS adapters still provide direct coverage where a
# tenant exposes internship postings without search metadata.
workday_queries:
  - internship
  - intern
  - co-op
  - undergraduate
  - student
  - summer analyst

aggregator_sources:
  - simplify_internship
  - speedyapply_internship
  - zapply_internship
  - dreamwork_internship
  - applyguy_internship
  - aprameyak_offcycle

notion:
