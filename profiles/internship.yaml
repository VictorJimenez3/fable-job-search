  # Victor asked for healthcare to receive a small lift and fintech/banks a
  # slight drag. Prestige remains the much larger signal in every tier.
  sector_adjustments:
    healthcare: 4
    fintech_and_banks: -4
    healthcare_companies:
      - Johnson & Johnson
      - CVS Health
      - Northwell Health
      - CareFirst BlueCross BlueShield
      - Eli Lilly
      - Pfizer
      - Merck
      - Genentech
      - Regeneron
      - Moderna
