      - Wells Fargo
      - Citigroup
      - Citi
      - Fidelity Investments
      - BNY
  # Keep defense work visible with a reasoned bottom score, including roles at
  # known defense contractors and postings explicitly about military work.
  defense_penalty: 70
  defense_score_cap: 12
  defense_companies:
    - Anduril
    - Lockheed Martin
    - Northrop Grumman
    - General Dynamics
    - RTX
    - Raytheon
