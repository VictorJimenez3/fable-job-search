# Friend-facing technical internship lane. This is intentionally separate
# from Victor's new-grad candidate profile; a viewer's graduation date is a
# private matching preference, not shared crawler state.
lane: internship

candidate:
  level: intern
  degree: bachelors
  needs_sponsorship: false

internship_scoring:
  # This is a friend-facing opportunity rubric, not Victor's candidate
  # profile. Every technical role family starts equally; differences come
  # from public opportunity evidence, not saved/applied preferences.
  # The display is a real 0–100 opportunity scale, not a low additive
  # confidence score. Missing evidence still contributes zero.
  base: 5
  flat_technical_role: 15
  explicit_eligibility: 18
  open_eligibility: 14
  # Cited employer/work research stays separate from broad prestige.
  employer_signal_cap: 8
  work_quality_cap: 20
  compensation_points:
    120000: 25
    100000: 21
    80000: 17
    60000: 12
    40000: 7
    0: 3
  fresh_24h: 3
  fresh_72h: 2
  fresh_7d: 1
  # Keep explicit full-time outliers discoverable, but below the normal board
  # threshold and out of alerts unless positive internship evidence appears.
  full_time_review_cap: 34
  prestige_points:
    1: 32
    2: 21
    3: 10
  # Broad recognition tiers are intentionally separate from the owner's
  # marquee list. Unknown employers receive no penalty; cited research can
  # add a small, auditable employer/work signal when available.
  prestige_tiers:
    1:
