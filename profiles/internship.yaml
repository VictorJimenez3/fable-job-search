# Technical internship lane with Victor's requested prestige-led ranking.
# It remains separate from new-grad state; graduation dates are private
# matching preferences, not shared crawler state.
lane: internship

candidate:
  level: intern
  degree: bachelors
  needs_sponsorship: false

internship_scoring:
  # Prestige is the leading ranking signal. Smaller public-evidence signals
  # still help distinguish roles at employers with similar reputations.
  base: 3
  flat_technical_role: 3
  explicit_eligibility: 4
  open_eligibility: 2
  employer_signal_cap: 2
  work_quality_cap: 6
  compensation_points:
    120000: 8
    100000: 7
    80000: 6
    60000: 4
    40000: 2
    0: 1
  fresh_24h: 1
  fresh_72h: 1
  fresh_7d: 0
  # Keep explicit full-time outliers discoverable, but below the normal board
  # threshold and out of alerts unless positive internship evidence appears.
  full_time_review_cap: 34
  prestige_points:
    1: 65
    2: 46
    3: 38
  prestige_tiers:
    1:
      - Google
      - Alphabet
      - Meta
      - Microsoft
      - Amazon
      - Apple
      - NVIDIA
      - OpenAI
      - Anthropic
      - DeepMind
      - xAI
      - Scale AI
