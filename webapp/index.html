<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar — Platform</title>
<style>
  :root {
    --paper:#FAFBF9; --ink:#1C2430; --muted:#5A6B7A; --accent:#2E7D5B;
    --accent-ink:#24634A; --amber:#9A6A1F; --line:#DDE4E0; --card:#F1F5F2;
    --code:#E9EFEA; --danger:#A33A2E;
  }
  :root[data-theme="dark"] {
    --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
    --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
    --code:#1F2A33; --danger:#E07862;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
      --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
      --code:#1F2A33; --danger:#E07862;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;
         font-size:16px; line-height:1.5; }
  .mono, button, input, select, textarea, .chip, th, .tag {
    font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:0.9rem; padding:0.7rem 1rem;
           border-bottom:2px solid var(--ink); flex-wrap:wrap; position:sticky; top:0;
           background:var(--paper); z-index:30; }
  header h1 { font-size:1.05rem; margin:0; white-space:nowrap; }
  nav { display:flex; gap:0.25rem; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--muted);
               padding:0.3rem 0.65rem; border-radius:5px; cursor:pointer; font-size:0.8rem; }
  nav button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  nav button:hover { color:var(--ink); }
  #stats { margin-left:auto; font-size:0.72rem; color:var(--muted); display:flex; gap:0.9rem; }
  #stats b { color:var(--ink); font-size:0.95rem; display:block; text-align:right; }
  main { max-width:72rem; margin:0 auto; padding:1rem; }
  .bar { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.9rem; align-items:center; }
  input, select, textarea { background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:5px; padding:0.4rem 0.55rem; font-size:0.8rem; }
  input[type=search] { flex:1; min-width:12rem; }
  button.act { background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:5px; padding:0.3rem 0.6rem; cursor:pointer; font-size:0.75rem; }
  button.act:hover { border-color:var(--accent); color:var(--accent-ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; opacity:0.9; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .job { display:flex; gap:0.7rem; padding:0.55rem 0.4rem; border-bottom:1px solid var(--line);
         align-items:baseline; flex-wrap:wrap; }
  .job:hover { background:var(--card); }
  .score { min-width:2.2rem; text-align:center; font-weight:700; font-size:0.85rem;
           border-radius:5px; padding:0.1rem 0.2rem; background:var(--code); }
  .score.hot { color:var(--accent-ink); border:1px solid var(--accent-ink); background:none; }
  .job .body { flex:1; min-width:14rem; }
  .job .co { font-weight:700; }
  .job a { color:var(--accent-ink); text-decoration-thickness:1px; }
  .jobtitle { border:0; background:none; color:var(--accent-ink); padding:0; cursor:pointer;
              font:inherit; text-decoration:underline; text-decoration-thickness:1px;
              text-underline-offset:2px; text-align:left; }
  .jobtitle:hover { color:var(--ink); }
  .facts { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.25rem; }
  .sub { font-size:0.78rem; color:var(--muted); }
  .chip { font-size:0.65rem; border:1px solid var(--line); color:var(--muted);
          border-radius:999px; padding:0.05rem 0.45rem; white-space:nowrap; }
  .chip.marquee { color:var(--amber); border-color:var(--amber); }
  .chip.saved { color:var(--amber); border-color:var(--amber); }
  .chip.applied { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.maybe { color:var(--muted); }
  .chip.good { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.bad { color:var(--danger); border-color:var(--danger); }
  .chip.unknown { color:var(--muted); border-style:dashed; }
  .acts { display:flex; gap:0.3rem; }
  .filters { padding:0.65rem; margin-bottom:0.75rem; background:var(--card);
             border:1px solid var(--line); border-radius:8px; }
  .filters .bar { margin-bottom:0.45rem; }
  .filters .bar:last-child { margin-bottom:0; }
  .lanes { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.9rem; }
  .lane { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem; }
  .lane h3 { margin:0 0 0.6rem; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
             font-family:ui-monospace,Menlo,monospace; color:var(--muted); }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:6px;
          padding:0.5rem 0.6rem; margin-bottom:0.5rem; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card .co { font-weight:700; font-size:0.9rem; }
  .card .t { font-size:0.8rem; }
  /* workspace drawer */
  #ws { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:50; display:none; }
  #ws.open { display:block; }
  #wsp { position:absolute; right:0; top:0; bottom:0; width:min(560px,100%);
         background:var(--paper); border-left:2px solid var(--ink); overflow-y:auto; padding:1.1rem; }
  #wsp h2 { margin:0 0 0.2rem; font-size:1.15rem; }
  .sect { margin-top:1.1rem; }
  .wstabs { display:flex; gap:0.25rem; margin-top:0.9rem; border-bottom:1px solid var(--line);
            padding-bottom:0.45rem; }
  .wstabs button { background:none; border:1px solid transparent; color:var(--muted);
                   padding:0.25rem 0.6rem; border-radius:5px; cursor:pointer; font-size:0.75rem; }
  .wstabs button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  .wstabs button:hover { color:var(--ink); }
  .sect h4 { margin:0 0 0.4rem; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
             color:var(--accent-ink); font-family:ui-monospace,Menlo,monospace; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:0.15rem 0.8rem; font-size:0.82rem; }
  .kv .k { color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:0.7rem; }
  .decision { background:var(--card); border:1px solid var(--line); border-radius:8px;
              padding:0.75rem; margin-top:0.9rem; }
  .decision .facts { display:flex; gap:0.35rem; flex-wrap:wrap; margin-top:0.45rem; }
  .drawer-actions { position:sticky; bottom:-1.1rem; background:var(--paper);
                    border-top:1px solid var(--line); padding:0.75rem 0 1.1rem; z-index:2; }
  textarea { width:100%; min-height:5.5rem; font-size:0.82rem; }
  .tpl { background:var(--code); border-radius:6px; padding:0.6rem; font-size:0.78rem;
         white-space:pre-wrap; margin-bottom:0.4rem; }
  ul.plain { list-style:none; padding:0; margin:0.3rem 0; }
  ul.plain li { display:flex; gap:0.4rem; align-items:center; padding:0.15rem 0; font-size:0.82rem; }
  table { border-collapse:collapse; width:100%; font-size:0.82rem; }
  th { text-align:left; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase;
       color:var(--muted); border-bottom:1.5px solid var(--ink); padding:0.3rem 0.6rem 0.3rem 0; }
  td { border-bottom:1px solid var(--line); padding:0.4rem 0.6rem 0.4rem 0; }
  .wrap { overflow-x:auto; }
  .note { background:var(--card); border-left:3px solid var(--amber); padding:0.6rem 0.8rem;
          border-radius:0 5px 5px 0; font-size:0.85rem; margin-bottom:0.9rem; }
  .toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--paper); padding:0.5rem 1rem; border-radius:6px;
           font-size:0.8rem; z-index:99; }
  a { color:var(--accent-ink); }
  .rlinks a { display:inline-block; margin:0 0.6rem 0.3rem 0; font-size:0.8rem; }
  @media (prefers-reduced-motion: no-preference) { .card, button.act { transition: border-color .12s; } }
  @media (max-width:700px) {
    header { position:static; }
    #stats { width:100%; margin-left:0; justify-content:space-between; }
    #stats b { text-align:left; }
    .job { align-items:flex-start; padding:0.75rem 0.25rem; }
    .job .acts { width:100%; padding-left:2.9rem; }
    .job .acts button { flex:1; }
    .filters select { flex:1; min-width:9rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🎯 Job Radar</h1>
  <nav id="nav"></nav>
  <div id="stats"></div>
  <button class="act" id="themeBtn" title="theme">◐</button>
</header>
<main id="main">Loading the radar state…</main>
<div id="ws"><div id="wsp"></div></div>

<script>
"use strict";
// ---- fork-portable config ------------------------------------------------
// Forks: the app self-configures. On <you>.github.io/<repo>/ the repo is
// derived from the URL; a Vercel backend supplies /api/config. Only edit ME
// (used to fill outreach templates) and, if self-hosting on Vercel, the env
// vars documented in docs/FORKING.md.
const ME = { name: "Victor", school: "NJIT", grad: "CS '26" };
const PROFILE = "default";
let REPO = "VictorJimenez3/fable-job-search";
let BRANCH = "claude/newgrad-job-search-system-9gbj9k";
let RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const API = "https://api.github.com";

const DEFAULT_FILTER = {q:"", min:66, sector:"", role:"", sponsorship:"",
  experience:"", alert:false, lane:"", sort:"best"};
function storedFilter() {
  try {
    const f = JSON.parse(localStorage.getItem("jr_filters") || "{}");
    if (f._alertFilterVersion !== 2) {
      f.alert = false;
      f._alertFilterVersion = 2;
      localStorage.setItem("jr_filters", JSON.stringify(f));
    }
    return f;
  }
  catch { return {}; }
}
const S = {           // app state
  jobs:{}, applied:[], culture:{}, research:{}, aiUsage:{}, companies:{},
  registryByCompany:{}, runs:[], scout:{}, web:null,
  auth:null, backend:false,
  tab:"jobs", filter:{...DEFAULT_FILTER, ...storedFilter()}, shown:250,
  wsTab:"fit",
  marquee:new Set(["meta","apple","amazon","netflix","google","microsoft","nvidia",
    "anthropic","openai","deepmind","genentech","moderna","regeneron",
    "vertex pharmaceuticals","eli lilly","merck","medtronic","intuitive surgical","stryker",
    "whoop","oura","dexcom","abbott"]),  // mirror of profile.yaml marquee_companies
};
const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const token = () => localStorage.getItem("jr_pat") || "";
const $ = sel => document.querySelector(sel);
const esc = s => (s??"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); };

/* ---------- theme ---------- */
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};

/* ---------- data ---------- */
async function fetchJSON(path, fallback) {
  try { const r = await fetch(RAW + path, {cache:"no-cache"});
        if (!r.ok) return fallback; return await r.json(); }
  catch { return fallback; }
}
async function boot() {
  // Backend detection: on Vercel /api/me exists (401 = present, not signed
  // in). On GitHub Pages it 404s and the app falls back to tokenless mode.
  try {
    const r = await fetch("/api/me");
    S.backend = r.status !== 404;
    if (r.ok) S.auth = await r.json();
  } catch { S.backend = false; }
  // fork-portable repo resolution (see docs/FORKING.md)
  try {
    const ghHost = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (ghHost && seg) REPO = `${ghHost[1]}/${seg}`;
    if (S.backend) {
      const c = await (await fetch("/api/config")).json();
      if (c.repo) REPO = c.repo;
      if (c.branch) BRANCH = c.branch;
    } else if (ghHost && seg) {
      const d = await (await fetch(`${API}/repos/${REPO}`)).json();
      if (d.default_branch) BRANCH = d.default_branch;
    }
  } catch {}
  RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
  const [jobs, applied, culture, research, aiUsage, companies, runs, scout, web] = await Promise.all([
    fetchJSON("state/jobs.json", {}), fetchJSON("state/applied.json", []),
    fetchJSON("state/culture.json", {}), fetchJSON("state/company_research.json", {}),
    fetchJSON("state/ai_usage.json", {}), fetchJSON("state/companies.json", {}),
    fetchJSON("state/runs.json", []), fetchJSON("state/scout.json", {}),
    fetchJSON("state/web_state.json", null),
  ]);
  Object.assign(S, {jobs, applied, culture, research, aiUsage, companies, runs, scout});
  for (const entry of Object.values(companies)) {
    const key = norm(entry.name);
    if (!S.registryByCompany[key] || entry.status === "active") S.registryByCompany[key] = entry;
  }
  S.web = web || JSON.parse(localStorage.getItem("jr_web") || '{"maybe":[],"jobs":{}}');
  S.web.maybe = S.web.maybe || []; S.web.jobs = S.web.jobs || {};
  render();
}

/* ---------- write paths ---------- */
async function gh(path, opts={}) {
  const r = await fetch(API + path, {...opts, headers: {
    "Authorization": `Bearer ${token()}`, "Accept": "application/vnd.github+json",
    ...(opts.headers||{}) }});
  if (!r.ok && r.status !== 409) throw new Error(`${r.status} ${await r.text()}`);
  return r;
}
async function dispatch(action, job) {
  await gh(`/repos/${REPO}/dispatches`, {method:"POST",
    body: JSON.stringify({event_type:"radar-web",
      client_payload:{action, id: job.id, url: job.url, company: job.company,
        profile:PROFILE}})});
  return true;
}
// Tokenless write path: open a prefilled GitHub issue — your GitHub login is
// the auth. The radar only obeys the repo owner and auto-closes the issue.
function issueCmd(cmd, job) {
  const ref = cmd === "applied" ? (job.url || job.id) : job.id;
  const u = `https://github.com/${REPO}/issues/new?title=${
    encodeURIComponent(`radar: ${cmd} ${job.company}`)}&body=${
    encodeURIComponent(`radar-profile: ${PROFILE}\n${cmd} ${ref}`)}`;
  window.open(u, "_blank");
  toast("Hit 'Create' on GitHub — it processes & auto-closes in ~1 min");
  return false;
}
let saveTimer=null;
function saveWeb() {                       // debounce web_state commits
  localStorage.setItem("jr_web", JSON.stringify(S.web));   // instant local mirror
  if (S.auth && S.auth.owner) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { const r = await fetch("/api/webstate", {method:"PUT",
              headers:{"Content-Type":"application/json"}, body: JSON.stringify(S.web)});
            if (!r.ok) throw new Error(r.status); }
      catch(e) { toast("Cloud save failed (kept locally): " + e.message); }
    }, 1500);
    return;
  }
  if (!token()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      let sha;
      const cur = await fetch(`${API}/repos/${REPO}/contents/state/web_state.json?ref=${BRANCH}`,
        {headers:{Authorization:`Bearer ${token()}`}});
      if (cur.ok) sha = (await cur.json()).sha;
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(S.web, null, 1))));
      await gh(`/repos/${REPO}/contents/state/web_state.json`, {method:"PUT",
        body: JSON.stringify({message:"platform: workspace update", content, sha, branch:BRANCH})});
    } catch(e) { toast("Cloud save failed (kept locally): " + e.message.slice(0,80)); }
  }, 1500);
}

/* ---------- derived ---------- */
const appliedById = () => Object.fromEntries(S.applied.map(a=>[a.id,a]));
function laneOf(id, byId) {
  const a = byId[id];
  if (a) return a.stage || "applied";
  return S.web.maybe.includes(id) ? "maybe" : "";
}
const ROLE_LABELS = {
  ai_ml:"AI / machine learning", swe:"Software engineering",
  data_science:"Data science", data_eng:"Data engineering",
  analytics:"Analytics / BI", other:"Other technical",
};
function roleFamily(j) {
  const t = norm(j.title);
  if (/\b(machine learning|ml engineer|ml|artificial intelligence|ai engineer|ai|applied scientist|research engineer|research scientist|deep learning|llm|gen ai|generative ai|nlp|computer vision|perception)\b/.test(t)) return "ai_ml";
  if (/\b(data engineer|data platform|data infrastructure|etl|analytics engineer)\b/.test(t)) return "data_eng";
  if (/\b(data scientist|decision scientist|statistic|quantitative)\b/.test(t)) return "data_science";
  if (/\b(data analyst|product analyst|research analyst|business intelligence|bi analyst|analytics analyst)\b/.test(t)) return "analytics";
  if (/\b(software|swe|developer|backend|back end|frontend|front end|full stack|platform engineer|infrastructure|site reliability|devops|mobile|ios|android|systems engineer|security engineer|cloud engineer|embedded|compiler)\b/.test(t)) return "swe";
  return "other";
}
function sponsorStatus(j) {
  return j.posting ? (j.posting.sponsorship || "unknown") : "unread";
}
function experienceStatus(j) {
  if (!j.posting) return "unread";
  if (j.posting.years_min == null) return "unknown";
  return j.posting.years_min <= 2 ? "entry" : "experienced";
}
function eligibilityBadges(j) {
  const p = j.posting;
  const sponsor = sponsorStatus(j);
  const visa = sponsor === "yes" ? ["good","🛂 sponsorship stated"]
    : sponsor === "no" ? ["bad","🛂 no sponsorship"]
    : sponsor === "unknown" ? ["unknown","🛂 visa not stated"]
    : ["unknown","🛂 visa not analyzed"];
  let exp;
  if (!p) exp = ["unknown","⏳ experience not analyzed"];
  else if (p.years_min != null) exp = [p.years_min <= 2 ? "good" : "bad",
    `⏳ ${p.years_min}+ yrs${p.intern_counts ? " · internships count" : ""}`];
  else if (p.intern_counts) exp = ["good","⏳ internships count"];
  else exp = ["unknown","⏳ experience not stated"];
  return `<span class="chip">${esc(ROLE_LABELS[roleFamily(j)])}</span>
    <span class="chip ${visa[0]}">${visa[1]}</span>
    <span class="chip ${exp[0]}">${exp[1]}</span>`;
}
function setFilter(key, value, fullRender=true) {
  S.filter[key] = value; S.shown = 250;
  localStorage.setItem("jr_filters", JSON.stringify(S.filter));
  if (fullRender) render(); else renderJobsList();
}
function clearFilters() {
  S.filter = {...DEFAULT_FILTER}; S.shown = 250;
  localStorage.removeItem("jr_filters"); render();
}
function jobList() {
  const byId = appliedById(); const f = S.filter; const q = norm(f.q);
  let rows = Object.values(S.jobs);
  if (f.alert) rows = rows.filter(j=>j.alert_ok);
  rows = rows.filter(j=>(j.score||0) >= f.min);
  if (f.sector) rows = rows.filter(j=>j.sector===f.sector);
  if (f.role) rows = rows.filter(j=>roleFamily(j)===f.role);
  if (f.sponsorship) rows = rows.filter(j=>sponsorStatus(j)===f.sponsorship);
  if (f.experience === "entryfit") rows = rows.filter(j=>experienceStatus(j)!=="experienced");
  else if (f.experience) rows = rows.filter(j=>experienceStatus(j)===f.experience);
  if (q) rows = rows.filter(j=>norm(j.company+" "+j.title).includes(q));
  if (f.lane) rows = rows.filter(j=>laneOf(j.id,byId)===f.lane);
  if (f.sort === "new")
    rows.sort((a,b)=>postedTs(b)-postedTs(a) || (b.score||0)-(a.score||0));
  else
    rows.sort((a,b)=>(b.score||0)-(a.score||0) || postedTs(b)-postedTs(a));
  return rows;
}
function postedTs(j){ return j.posted_at || j.first_seen || 0; }
function ago(ts){
  if (!ts) return "";
  const d = (Date.now()/1000 - ts) / 86400;
  if (d < 1)  return Math.max(1, Math.round(d*24)) + "h";
  if (d < 60) return Math.round(d) + "d";
  return Math.round(d/30) + "mo";
}

/* ---------- actions ---------- */
async function actMaybe(j) {
  const i = S.web.maybe.indexOf(j.id);
  if (i>=0) S.web.maybe.splice(i,1); else S.web.maybe.push(j.id);
  saveWeb(); render();
}
async function apiAction(action, job) {
  const r = await fetch("/api/action", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({action, id:job.id, url:job.url, company:job.company})});
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return true;
}
function canWrite() { return (S.auth && S.auth.owner) || token(); }
async function doWrite(action, job) {   // best available write path
  if (S.auth && S.auth.owner) return apiAction(action, job);
  if (token()) return dispatch(action, job);
  if (S.backend) { toast("Sign in with GitHub (top right) for one-click writes");
                   return false; }
  return issueCmd(action === "track" ? "save" : "applied", job);
}
async function actTrack(j, quiet=false) {
  if (!j) return false;
  const existing = appliedById()[j.id];
  if (existing) {
    if (!quiet) toast(existing.stage === "applied" ? "Already marked applied" : "Already in To apply");
    return true;
  }
  try { if (await doWrite("track", j)) {
    S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"saved", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    if (!quiet) toast("Saved to To apply → Notion syncs in ~1 min"); render(); return true; } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
  return false;
}
async function actApplied(j) {
  if (!j) return false;
  const existing = appliedById()[j.id];
  if (existing && (existing.stage||"applied") === "applied") {
    toast("Already marked applied"); return true;
  }
  try { if (await doWrite("applied", j)) {
    const a = appliedById()[j.id];
    if (a) a.stage = "applied";
    else S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"applied", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    toast("Marked applied → Notion status updates in ~1 min"); render(); return true; } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
  return false;
}
function startApply(j) {
  if (!j || !j.url) return;
  window.open(j.url, "_blank", "noopener");
  const lane = laneOf(j.id, appliedById());
  if (!lane && canWrite()) {
    actTrack(j, true).then(ok=>toast(ok
      ? "Application opened · saved to To apply"
      : "Application opened · saving failed, so use Save when you return"));
  } else {
    toast(lane === "applied" ? "Application opened · already marked applied"
      : lane === "saved" ? "Application opened · already in To apply"
      : "Application opened · save it when you want it in your pipeline");
  }
}

function claimHTML(d, field, label) {
  const claim = d?.[field];
  if (!claim || !claim.value || claim.value === "Not confirmed")
    return `<span class="k">${esc(label)}</span><span class="sub">Not confirmed</span>`;
  const indexes = Object.fromEntries((d.sources||[]).map((s,i)=>[s.id,i+1]));
  const cites = (claim.source_ids||[]).map(id=>indexes[id])
    .filter(Boolean).map(n=>`<a href="#src-${n}" class="chip">${n}</a>`).join(" ");
  return `<span class="k">${esc(label)}</span><span>${esc(claim.value)} ${cites}
    <span class="chip unknown">${esc(claim.confidence||"low")} confidence</span></span>`;
}
function researchFreshness(d) {
  if (!d?.generated_at) return "official evidence captured · synthesis queued";
  const days = Math.max(0,Math.floor((Date.now()/1000-d.generated_at)/86400));
  return `${days===0?"researched today":days+"d since research"} · ${d.status||"evidence limited"}`;
}
function sourceList(d) {
  if (!d?.sources?.length) return `<p class="sub">No official source excerpt captured yet.</p>`;
  return `<ol class="sub">${d.sources.map((s,i)=>`<li id="src-${i+1}">
    <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
    · retrieved ${new Date((s.retrieved_at||0)*1000).toLocaleDateString()}
    <br>${esc(s.excerpt)}</li>`).join("")}</ol>`;
}

function qualityCard(j) {

function rCos() {
  // toolbar renders once; typing re-renders only #cosList so the input keeps focus
  $("#main").innerHTML = `
    <div class="bar"><input type="search" placeholder="search companies…"
      value="${esc(S.filter.q)}" oninput="S.filter.q=this.value;renderCosList()">
      <span class="sub" id="cosCount"></span></div>
    <div id="cosList"></div>`;
  renderCosList();
}
function renderCosList() {
  const el = $("#cosList"); if (!el) return;
  const counts = {};
  for (const j of Object.values(S.jobs)) {
    if (j.closed_at) continue;
    const k = norm(j.company);
    counts[k] = counts[k]||{name:j.company, open:0, best:0, bestId:j.id};
    counts[k].open++;
    if ((j.score||0) >= counts[k].best) { counts[k].best=j.score||0; counts[k].bestId=j.id; }
  }
  const q = norm(S.filter.q);
  let rows = Object.entries(counts).map(([k,v])=>({k, ...v, c:S.culture[k], d:S.research[k]}));
  if (q) rows = rows.filter(r=>r.k.includes(q));
  rows.sort((a,b)=>(b.d?.status==="ready")-(a.d?.status==="ready") || b.best-a.best);
  const n = $("#cosCount"); if (n) n.textContent = `${rows.length} companies`;
  el.innerHTML = `
    <div class="wrap"><table><tr><th>company</th><th>what they do</th><th>research</th>
      <th>culture</th><th>open roles</th></tr>
    ${rows.slice(0,200).map(r=>`<tr>
      <td><button class="jobtitle" onclick='openWS("${r.bestId}")'><b>${esc(r.name)}</b></button>
        ${S.marquee.has(r.k)?' <span class="chip marquee">marquee</span>':""}</td>
      <td>${esc(r.d?.summary?.value||"Official evidence not captured yet")}</td>
      <td><span class="chip ${r.d?.status==="ready"?"good":"unknown"}">${esc(r.d?researchFreshness(r.d):"queued")}</span></td>
      <td>${r.c?`${r.c.fit}/100 · WLB ${r.c.wlb}/5${r.c.source==="est."?" <span class='sub'>legacy estimate</span>":""}`:"–"}</td>
      <td>${r.open} · top ${r.best}</td></tr>`).join("")}
    </table></div>`;
}

    <div class="note">Core scoring stays deterministic. AI is a bounded enrichment layer:
      local Ollama handles bulk work when the Mac is awake; free NVIDIA endpoints handle a small

      <div class="lane"><h3>Model health · latest run</h3>
        <div class="kv">${models.length?models.map(([name,m])=>
          `<span class="k">${esc(name)}</span><span>${m.ok||0}/${m.requests||0} OK · ${m.errors||0} errors · ${m.tokens||0} reported tokens</span>`).join(""):

      <div class="lane"><h3>Enrichment coverage</h3>
        <div class="kv">
          <span class="k">jobs with AI angle</span><span>${withNote} / ${jobs.length}</span>
          <span class="k">culture dossiers</span><span>${doss.length}
            (${doss.filter(d=>d.source==="seed").length} curated,
             ${doss.filter(d=>d.source==="est.").length} legacy estimates)</span>
          <span class="k">grounded company briefs</span><span>${Object.values(S.research).filter(d=>d.status==="ready").length} ready · ${Object.keys(S.research).length} with evidence</span>
          <span class="k">last crawl</span><span>${lastRun?new Date(lastRun.ts*1000).toLocaleString():"–"}
            · ${lastRun?lastRun.new_jobs:0} new · ${lastRun?lastRun.alerts:0} alerts</span>

          <span class="chip">${esc(c.status)}</span></li>`).join("")}</ul></div>
      <div class="lane"><h3>Registry</h3>
        <div class="kv">
          <span class="k">companies polled</span><span>${Object.values(S.companies).filter(c=>c.status==="active").length}</span>

}

function rSet() {
  $("#main").innerHTML = `
    ${S.backend?`<div class="sect"><h4>Signed-in mode (recommended)</h4>
      <p class="sub" style="max-width:44rem">${S.auth
        ? `Signed in as <b>@${esc(S.auth.login)}</b>${S.auth.owner
            ? " — full write access. Every track/applied click fires instantly, and notes sync across devices."
            : " — read-only (this radar belongs to the repo owner)."}
           <a href="/api/logout">Sign out</a>.`
        : `<a href="/api/login"><b>Sign in with GitHub</b></a> once per browser. GitHub's OAuth
           hands the backend your identity; your credential is sealed in an httpOnly cookie
           this page's JavaScript cannot read, and the app secrets live only in Vercel's
           encrypted env store — never in the repo, never in the frontend.`}</p></div>`:""}
    <div class="sect"><h4>How auth works (no secrets on this site)</h4>
      <p class="sub" style="max-width:44rem">This is a static page on a <b>public</b> repo, so it
      holds no secrets — anything embedded here would belong to the whole internet. Instead,
      <b>track / applied</b> open a prefilled GitHub issue that you submit while logged into
      GitHub; the radar's backend <b>only obeys the repo owner</b> and ignores everyone else, then
      auto-closes the issue. Share this URL freely — a friend gets a read-only view and their
      clicks are ignored by design. Without a token, notes &amp; links live only in this browser
      (private, but not synced between devices).</p></div>
    <div class="sect"><h4>Optional: a token for instant writes + cross-device notes</h4>
      <p class="sub" style="max-width:44rem">Only if you want one-click writes without the GitHub
      hop: a <b>fine-grained</b> token scoped to <span class="mono">${REPO}</span> only, with
      <b>Contents: read/write</b> only (<a target="_blank" rel="noopener"
      href="https://github.com/settings/personal-access-tokens/new">create here</a>). It is stored
      in this browser's localStorage — never in the repo or the page — so don't do this on a
      shared computer, and revoke it anytime at github.com/settings/tokens. Worst case if this
      browser is compromised: this one repo, nothing else on your account. Note: with a token,
      notes sync via <span class="mono">state/web_state.json</span>, which is public — keep
      anything sensitive out or skip the token.</p>
      <div class="bar"><input id="pat" type="password" placeholder="github_pat_… (optional)" style="min-width:20rem"
        value="${esc(token())}">
        <button class="act primary" onclick='localStorage.setItem("jr_pat",$("#pat").value.trim());testPAT()'>save & test</button>
        <button class="act" onclick='localStorage.removeItem("jr_pat");toast("Token removed");render()'>remove</button></div>
      <p id="patRes" class="sub"></p></div>`;
}
async function testPAT() {
  try { const r = await gh(`/repos/${REPO}`); const d = await r.json();
    $("#patRes").textContent = `✓ token works (repo: ${d.full_name}, push: ${d.permissions?.push})`;
    toast("Token saved"); }
  catch(e){ $("#patRes").textContent = "✗ " + e.message.slice(0,120); }
}
