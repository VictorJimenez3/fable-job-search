<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar — Platform</title>
<style>
  :root {
    color-scheme: light;
    --paper:#F5F6F5; --surface:#FFFFFF; --ink:#1A2129; --muted:#68737E;
    --accent:#1E7A54; --accent-ink:#166446; --amber:#946417; --line:#E3E7E4;
    --code:#EDF0ED; --danger:#B0392C; --scrim:rgba(21,28,36,0.42);
    --shadow-sm:0 1px 2px rgba(21,28,36,0.05);
    --shadow-md:0 4px 16px rgba(21,28,36,0.08), 0 1px 3px rgba(21,28,36,0.05);
    --shadow-lg:-24px 0 60px rgba(21,28,36,0.22);
    --header-bg:rgba(245,246,245,0.8);
    --ease-out:cubic-bezier(0.23,1,0.32,1);       /* strong ease-out for UI */
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);    /* iOS sheet curve */
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#11161C; --surface:#191F27; --ink:#DEE5EB; --muted:#8E9DAA;
    --accent:#3EB287; --accent-ink:#5AC69B; --amber:#D5A651; --line:#272F38;
    --code:#202832; --danger:#E07862; --scrim:rgba(0,0,0,0.55);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
    --shadow-md:0 4px 16px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg:-24px 0 60px rgba(0,0,0,0.5);
    --header-bg:rgba(17,22,28,0.75);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:#11161C; --surface:#191F27; --ink:#DEE5EB; --muted:#8E9DAA;
      --accent:#3EB287; --accent-ink:#5AC69B; --amber:#D5A651; --line:#272F38;
      --code:#202832; --danger:#E07862; --scrim:rgba(0,0,0,0.55);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
      --shadow-md:0 4px 16px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg:-24px 0 60px rgba(0,0,0,0.5);
      --header-bg:rgba(17,22,28,0.75);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
         font-size:16px; line-height:1.55;
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .mono, .chip, th, .tag { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  button, input, select, textarea { font-family:inherit; }

  /* smooth the dark↔light jump: toggled briefly from JS on theme change */
  .theme-fade, .theme-fade * {
    transition: background-color .3s ease, color .3s ease, border-color .3s ease !important; }

  header { display:flex; align-items:center; gap:0.9rem; padding:0.65rem 1.1rem;
           flex-wrap:wrap; position:sticky; top:0; z-index:30;
           background:var(--header-bg);
           -webkit-backdrop-filter:blur(16px) saturate(1.8);
           backdrop-filter:blur(16px) saturate(1.8);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:1rem; font-weight:650; letter-spacing:-0.01em; margin:0; white-space:nowrap; }
  nav { display:flex; gap:0.2rem; flex-wrap:wrap; }
  nav button { background:none; border:none; color:var(--muted); font-size:0.8rem;
               font-weight:500; padding:0.35rem 0.7rem; border-radius:7px; cursor:pointer;
               transition: color .15s ease, background-color .15s ease, transform .16s var(--ease-out); }
  nav button.on { color:var(--accent-ink);
                  background:color-mix(in srgb, var(--accent) 12%, transparent); }
  nav button:active { transform:scale(0.96); }
  #stats { margin-left:auto; font-size:0.7rem; color:var(--muted); display:flex; gap:1rem; }
  #stats b { color:var(--ink); font-size:0.95rem; font-weight:650; display:block;
             text-align:right; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  main { max-width:72rem; margin:0 auto; padding:1.1rem 1rem 3rem; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } }
  main.boot { animation: rise .35s var(--ease-out); }

  .bar { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.9rem; align-items:center; }
  input, select, textarea { background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:7px; padding:0.45rem 0.6rem; font-size:0.8rem;
    transition: border-color .15s ease, box-shadow .15s ease; }
  input[type=search] { flex:1; min-width:12rem; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  button.act { background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:7px; padding:0.32rem 0.65rem; cursor:pointer; font-size:0.75rem;
    font-weight:500; box-shadow:var(--shadow-sm);
    transition: transform .16s var(--ease-out), border-color .15s ease,
                color .15s ease, background-color .15s ease, filter .15s ease; }
  button.act:active { transform:scale(0.97); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

  .job { display:flex; gap:0.7rem; padding:0.6rem 0.5rem; border-bottom:1px solid var(--line);
         align-items:baseline; flex-wrap:wrap; border-radius:8px;
         transition: background-color .12s ease; }
  .score { min-width:2.3rem; text-align:center; font-weight:650; font-size:0.8rem;
           border-radius:6px; padding:0.14rem 0.25rem; background:var(--code);
           color:var(--muted); font-variant-numeric:tabular-nums;
           font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .score.hot { color:var(--accent-ink);
               background:color-mix(in srgb, var(--accent) 14%, transparent); }
  .job .body { flex:1; min-width:14rem; }
  .job .co { font-weight:650; }
  a { color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px;
      text-decoration-color:color-mix(in srgb, var(--accent-ink) 40%, transparent);
      transition: text-decoration-color .15s ease; }
  .sub { font-size:0.78rem; color:var(--muted); }
  .chip { font-size:0.65rem; border:1px solid var(--line); color:var(--muted);
          background:var(--surface); border-radius:999px; padding:0.1rem 0.5rem;
          white-space:nowrap; }
  .chip.marquee, .chip.saved { color:var(--amber);
    border-color:color-mix(in srgb, var(--amber) 40%, var(--line));
    background:color-mix(in srgb, var(--amber) 8%, transparent); }
  .chip.applied { color:var(--accent-ink);
    border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .chip.maybe { color:var(--muted); }
  .acts { display:flex; gap:0.3rem; }

  .lanes { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.9rem; }
  .lane { background:var(--surface); border:1px solid var(--line); border-radius:12px;
          padding:0.8rem; box-shadow:var(--shadow-sm); }
  .lane h3 { margin:0 0 0.6rem; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
             font-family:ui-monospace,"SF Mono",Menlo,monospace; color:var(--muted); font-weight:600; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:8px;
          padding:0.5rem 0.6rem; margin-bottom:0.5rem; cursor:pointer;
          transition: transform .16s var(--ease-out), border-color .15s ease, box-shadow .15s ease; }
  .card:active { transform:scale(0.98); }
  .card .co { font-weight:650; font-size:0.9rem; }
  .card .t { font-size:0.8rem; color:var(--muted); }

  /* workspace drawer — always mounted; slides on the iOS sheet curve, dismisses
     along the same edge it entered from, and stays interruptible (transitions,
     not keyframes, so reopening mid-close retargets smoothly) */
  #ws { position:fixed; inset:0; z-index:50; background:transparent; visibility:hidden;
        transition: background-color .4s var(--ease-drawer), visibility 0s .4s; }
  #ws.open { visibility:visible; background:var(--scrim);
             transition: background-color .4s var(--ease-drawer); }
  #wsp { position:absolute; right:0; top:0; bottom:0; width:min(560px,100%);
         background:var(--paper); border-left:1px solid var(--line);
         box-shadow:var(--shadow-lg); overflow-y:auto; padding:1.25rem;
         transform:translateX(100%); transition: transform .45s var(--ease-drawer); }
  #ws.open #wsp { transform:none; }
  #wsp h2 { margin:0 0 0.2rem; font-size:1.3rem; font-weight:650; letter-spacing:-0.015em; }
  .sect { margin-top:1.2rem; }
  .sect h4 { margin:0 0 0.4rem; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase;
             color:var(--accent-ink); font-family:ui-monospace,"SF Mono",Menlo,monospace;
             font-weight:600; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:0.15rem 0.8rem; font-size:0.82rem; }
  .kv .k { color:var(--muted); font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.7rem; }
  textarea { width:100%; min-height:5.5rem; font-size:0.82rem; line-height:1.5; }
  .tpl { background:var(--code); border-radius:8px; padding:0.65rem 0.75rem; font-size:0.78rem;
         white-space:pre-wrap; margin-bottom:0.4rem; }
  ul.plain { list-style:none; padding:0; margin:0.3rem 0; }
  ul.plain li { display:flex; gap:0.4rem; align-items:center; padding:0.15rem 0; font-size:0.82rem; }
  table { border-collapse:collapse; width:100%; font-size:0.82rem; }
  th { text-align:left; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase;
       color:var(--muted); font-weight:600; border-bottom:1px solid var(--line);
       padding:0.3rem 0.6rem 0.3rem 0; }
  td { border-bottom:1px solid var(--line); padding:0.45rem 0.6rem 0.45rem 0; }
  .wrap { overflow-x:auto; }
  .note { background:color-mix(in srgb, var(--amber) 7%, var(--surface));
          border:1px solid color-mix(in srgb, var(--amber) 25%, var(--line));
          border-radius:10px; padding:0.65rem 0.85rem; font-size:0.85rem; margin-bottom:0.9rem; }
  .toast { position:fixed; bottom:1rem; left:50%; transform:translate(-50%,0);
           background:var(--ink); color:var(--paper); padding:0.5rem 1rem; border-radius:10px;
           font-size:0.8rem; z-index:99; box-shadow:var(--shadow-md);
           transition: transform .35s var(--ease-out), opacity .35s var(--ease-out); }
  @starting-style { .toast { transform:translate(-50%,12px); opacity:0; } }
  .toast.out { transform:translate(-50%,12px); opacity:0; transition-duration:.25s; }
  .rlinks a { display:inline-block; margin:0 0.6rem 0.3rem 0; font-size:0.8rem; }

  /* hover feedback only where a real pointer exists — taps shouldn't stick */
  @media (hover: hover) and (pointer: fine) {
    nav button:hover { color:var(--ink); background:color-mix(in srgb, var(--ink) 6%, transparent); }
    nav button.on:hover { color:var(--accent-ink);
      background:color-mix(in srgb, var(--accent) 16%, transparent); }
    button.act:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line));
      color:var(--accent-ink); }
    button.primary:hover { color:#fff; filter:brightness(1.06); }
    .job:hover { background:var(--surface); }
    .card:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line));
      box-shadow:var(--shadow-md); transform:translateY(-1px); }
    a:hover { text-decoration-color:currentColor; }
  }

  @media (prefers-reduced-motion: reduce) {
    main.boot { animation:none; }
    nav button:active, button.act:active, .card:active { transform:none; }
    .card, .card:hover { transform:none; }
    #wsp { transform:none; opacity:0; transition:opacity .2s ease; }
    #ws.open #wsp { opacity:1; }
    .toast { transform:translate(-50%,0) !important; transition:opacity .2s ease; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background:var(--paper); backdrop-filter:none; -webkit-backdrop-filter:none; }
  }
</style>
</head>
<body>
<header>
  <h1>🎯 Job Radar</h1>
  <nav id="nav"></nav>
  <div id="stats"></div>
  <button class="act" id="themeBtn" title="theme">◐</button>
</header>
<main id="main">Loading the radar state…</main>
<div id="ws"><div id="wsp"></div></div>

<script>
"use strict";
// ---- fork-portable config ------------------------------------------------
// Forks: the app self-configures. On <you>.github.io/<repo>/ the repo is
// derived from the URL; a Vercel backend supplies /api/config. Only edit ME
// (used to fill outreach templates) and, if self-hosting on Vercel, the env
// vars documented in docs/FORKING.md.
const ME = { name: "Victor", school: "NJIT", grad: "CS '26" };
let REPO = "VictorJimenez3/fable-job-search";
let BRANCH = "claude/newgrad-job-search-system-9gbj9k";
let RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const API = "https://api.github.com";

const S = {           // app state
  jobs:{}, applied:[], culture:{}, companies:{}, runs:[], scout:{}, web:null,
  auth:null, backend:false,
  tab:"jobs", filter:{q:"", min:66, sector:"", alert:true, lane:""}, shown:250,
  marquee:new Set(["meta","apple","amazon","netflix","google","microsoft","nvidia",
    "anthropic","openai","deepmind","genentech","moderna","regeneron",
    "vertex pharmaceuticals","eli lilly","medtronic","intuitive surgical","stryker"]),
};
const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const token = () => localStorage.getItem("jr_pat") || "";
const $ = sel => document.querySelector(sel);
const esc = s => (s??"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add("out"), 2900);   // exits the way it entered
  setTimeout(()=>t.remove(), 3250); };

/* ---------- theme ---------- */
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  root.classList.add("theme-fade");               // ease the brightness jump
  const cur = root.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  setTimeout(()=>root.classList.remove("theme-fade"), 350);
};

/* ---------- data ---------- */
async function fetchJSON(path, fallback) {
  try { const r = await fetch(RAW + path, {cache:"no-cache"});
        if (!r.ok) return fallback; return await r.json(); }
  catch { return fallback; }
}
async function boot() {
  // Backend detection: on Vercel /api/me exists (401 = present, not signed
  // in). On GitHub Pages it 404s and the app falls back to tokenless mode.
  try {
    const r = await fetch("/api/me");
    S.backend = r.status !== 404;
    if (r.ok) S.auth = await r.json();
  } catch { S.backend = false; }
  // fork-portable repo resolution (see docs/FORKING.md)
  try {
    const ghHost = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (ghHost && seg) REPO = `${ghHost[1]}/${seg}`;
    if (S.backend) {
      const c = await (await fetch("/api/config")).json();
      if (c.repo) REPO = c.repo;
      if (c.branch) BRANCH = c.branch;
    } else if (ghHost && seg) {
      const d = await (await fetch(`${API}/repos/${REPO}`)).json();
      if (d.default_branch) BRANCH = d.default_branch;
    }
  } catch {}
  RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
  const [jobs, applied, culture, companies, runs, scout, web] = await Promise.all([
    fetchJSON("state/jobs.json", {}), fetchJSON("state/applied.json", []),
    fetchJSON("state/culture.json", {}), fetchJSON("state/companies.json", {}),
    fetchJSON("state/runs.json", []), fetchJSON("state/scout.json", {}),
    fetchJSON("state/web_state.json", null),
  ]);
  Object.assign(S, {jobs, applied, culture, companies, runs, scout});
  S.web = web || JSON.parse(localStorage.getItem("jr_web") || '{"maybe":[],"jobs":{}}');
  S.web.maybe = S.web.maybe || []; S.web.jobs = S.web.jobs || {};
  render();
}

/* ---------- write paths ---------- */
async function gh(path, opts={}) {
  const r = await fetch(API + path, {...opts, headers: {
    "Authorization": `Bearer ${token()}`, "Accept": "application/vnd.github+json",
    ...(opts.headers||{}) }});
  if (!r.ok && r.status !== 409) throw new Error(`${r.status} ${await r.text()}`);
  return r;
}
async function dispatch(action, job) {
  await gh(`/repos/${REPO}/dispatches`, {method:"POST",
    body: JSON.stringify({event_type:"radar-web",
      client_payload:{action, id: job.id, url: job.url, company: job.company}})});
  return true;
}
// Tokenless write path: open a prefilled GitHub issue — your GitHub login is
// the auth. The radar only obeys the repo owner and auto-closes the issue.
function issueCmd(cmd, job) {
  const ref = cmd === "applied" ? (job.url || job.id) : job.id;
  const u = `https://github.com/${REPO}/issues/new?title=${
    encodeURIComponent(`radar: ${cmd} ${job.company}`)}&body=${
    encodeURIComponent(`${cmd} ${ref}`)}`;
  window.open(u, "_blank");
  toast("Hit 'Create' on GitHub — it processes & auto-closes in ~1 min");
  return false;
}
let saveTimer=null;
function saveWeb() {                       // debounce web_state commits
  localStorage.setItem("jr_web", JSON.stringify(S.web));   // instant local mirror
  if (S.auth && S.auth.owner) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { const r = await fetch("/api/webstate", {method:"PUT",
              headers:{"Content-Type":"application/json"}, body: JSON.stringify(S.web)});
            if (!r.ok) throw new Error(r.status); }
      catch(e) { toast("Cloud save failed (kept locally): " + e.message); }
    }, 1500);
    return;
  }
  if (!token()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      let sha;
      const cur = await fetch(`${API}/repos/${REPO}/contents/state/web_state.json?ref=${BRANCH}`,
        {headers:{Authorization:`Bearer ${token()}`}});
      if (cur.ok) sha = (await cur.json()).sha;
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(S.web, null, 1))));
      await gh(`/repos/${REPO}/contents/state/web_state.json`, {method:"PUT",
        body: JSON.stringify({message:"platform: workspace update", content, sha, branch:BRANCH})});
    } catch(e) { toast("Cloud save failed (kept locally): " + e.message.slice(0,80)); }
  }, 1500);
}

/* ---------- derived ---------- */
const appliedById = () => Object.fromEntries(S.applied.map(a=>[a.id,a]));
function laneOf(id, byId) {
  const a = byId[id];
  if (a) return (a.stage||"applied")==="applied" ? "applied" : "saved";
  return S.web.maybe.includes(id) ? "maybe" : "";
}
function jobList() {
  const byId = appliedById(); const f = S.filter; const q = norm(f.q);
  let rows = Object.values(S.jobs);
  if (f.alert) rows = rows.filter(j=>j.alert_ok);
  rows = rows.filter(j=>(j.score||0) >= f.min);
  if (f.sector) rows = rows.filter(j=>j.sector===f.sector);
  if (q) rows = rows.filter(j=>norm(j.company+" "+j.title).includes(q));
  if (f.lane) rows = rows.filter(j=>laneOf(j.id,byId)===f.lane);
  rows.sort((a,b)=>(b.score||0)-(a.score||0) || (b.first_seen||0)-(a.first_seen||0));
  return rows;
}

/* ---------- actions ---------- */
async function actMaybe(j) {
  const i = S.web.maybe.indexOf(j.id);
  if (i>=0) S.web.maybe.splice(i,1); else S.web.maybe.push(j.id);
  saveWeb(); render();
}
async function apiAction(action, job) {
  const r = await fetch("/api/action", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({action, id:job.id, url:job.url, company:job.company})});
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return true;
}
function canWrite() { return (S.auth && S.auth.owner) || token(); }
async function doWrite(action, job) {   // best available write path
  if (S.auth && S.auth.owner) return apiAction(action, job);
  if (token()) return dispatch(action, job);
  if (S.backend) { toast("Sign in with GitHub (top right) for one-click writes");
                   return false; }
  return issueCmd(action === "track" ? "save" : "applied", job);
}
async function actTrack(j) {
  try { if (await doWrite("track", j)) {
    S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"saved", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    toast("Tracking → lands in Notion in ~1 min"); render(); } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
}
async function actApplied(j) {
  try { if (await doWrite("applied", j)) {
    const a = appliedById()[j.id];
    if (a) a.stage = "applied";
    else S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"applied", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    toast("Marked applied → Notion status updates in ~1 min"); render(); } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
}

/* ---------- render ---------- */
const TABS = [["jobs","Jobs"],["pipeline","Pipeline"],["companies","Companies"],
              ["ai","AI"],["settings","Settings"]];
function render() {
  if (!render.did) { render.did = 1; $("#main").classList.add("boot"); } // one-time entrance only
  $("#nav").innerHTML = TABS.map(([k,l]) =>
    `<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join("") +
    `<button onclick="window.open('https://github.com/${REPO}/issues','_blank')">Issues ↗</button>` +
    (S.backend ? (S.auth
      ? `<button onclick="location.href='/api/logout'" title="sign out">@${esc(S.auth.login)}${S.auth.owner?"":" · read-only"} ✕</button>`
      : `<button class="on" onclick="location.href='/api/login'">Sign in with GitHub</button>`) : "");
  const byId = appliedById();
  const saved = S.applied.filter(a=>(a.stage||"applied")==="saved");
  const done  = S.applied.filter(a=>(a.stage||"applied")==="applied");
  $("#stats").innerHTML =
    `<span><b>${Object.keys(S.jobs).length}</b>jobs seen</span>` +
    `<span><b>${S.web.maybe.length}</b>maybe</span>` +
    `<span><b>${saved.length}</b>to apply</span>` +
    `<span><b>${done.length}</b>applied</span>`;
  ({jobs:rJobs, pipeline:rPipe, companies:rCos, ai:rAI, settings:rSet})[S.tab]();
}

function rowHTML(j, byId) {
  const lane = laneOf(j.id, byId);
  const mq = S.marquee.has(norm(j.company));
  const c = S.culture[norm(j.company)];
  return `<div class="job">
    <span class="score ${j.score>=85?'hot':''}">${j.score??"–"}</span>
    <div class="body">
      <span class="co">${esc(j.company)}</span> —
      <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="sub">${esc((j.locations||[])[0]||"?")}${j.salary?" · "+esc(j.salary):""}
        · ${esc(j.sector||"tech")}${c?` · ${esc(c.industry)} (${esc(c.prestige)})`:""}
        ${j.llm_note?` · <i>${esc(j.llm_note)}</i>`:""}</div>
    </div>
    ${mq?'<span class="chip marquee">marquee</span>':""}
    ${lane?`<span class="chip ${lane}">${lane==="saved"?"to apply":lane}</span>`:""}
    <div class="acts">
      <button class="act" onclick='actMaybe(S.jobs["${j.id}"])'>${lane==="maybe"?"un-maybe":"maybe"}</button>
      <button class="act" onclick='actTrack(S.jobs["${j.id}"])'>track</button>
      <button class="act" onclick='actApplied(S.jobs["${j.id}"])'>applied</button>
      <button class="act" onclick='openWS("${j.id}")'>open ▸</button>
    </div></div>`;
}

function rJobs() {
  const byId = appliedById();
  const rows = jobList();
  const sectors = [...new Set(Object.values(S.jobs).map(j=>j.sector).filter(Boolean))].sort();
  $("#main").innerHTML = `
    <div class="bar">
      <input type="search" placeholder="search ${rows.length} roles…" value="${esc(S.filter.q)}"
        oninput="S.filter.q=this.value;S.shown=250;render()">
      <label class="sub">min <input type="number" style="width:4.2rem" value="${S.filter.min}"
        onchange="S.filter.min=+this.value;render()"></label>
      <select onchange="S.filter.sector=this.value;render()">
        <option value="">all sectors</option>
        ${sectors.map(s=>`<option ${s===S.filter.sector?"selected":""}>${s}</option>`).join("")}</select>
      <label class="sub"><input type="checkbox" ${S.filter.alert?"checked":""}
        onchange="S.filter.alert=this.checked;render()"> alert-worthy only</label>
      <select onchange="S.filter.lane=this.value;render()">
        <option value="">any status</option><option value="maybe">maybe</option>
        <option value="saved">to apply</option><option value="applied">applied</option></select>
    </div>
    ${canWrite()?"":(S.backend
      ?`<div class="note"><b>Sign in with GitHub</b> (top right) once — every click is automatic
        after that. No tokens: secrets stay server-side, and only the repo owner can write.</div>`
      :`<div class="note">No token needed: <b>track / applied</b> open a one-click
      prefilled GitHub issue (your GitHub login is the auth — only the repo owner is obeyed).
      Notes &amp; links stay private in this browser.</div>`)}
    <div>${rows.slice(0,S.shown).map(j=>rowHTML(j,byId)).join("")}</div>
    ${rows.length>S.shown?`<p><button class="act" onclick="S.shown+=250;render()">
      show more (${rows.length-S.shown} left)</button></p>`:""}`;
}

function cardHTML(x) {
  return `<div class="card" onclick='openWS("${x.id}")'>
    <div class="co">${esc(x.company)}</div><div class="t">${esc(x.title)}</div></div>`;
}
function rPipe() {
  const byId = appliedById();
  const maybe = S.web.maybe.map(id=>S.jobs[id]).filter(Boolean);
  const saved = S.applied.filter(a=>(a.stage||"applied")==="saved");
  const done  = S.applied.filter(a=>(a.stage||"applied")==="applied");
  $("#main").innerHTML = `<div class="lanes">
    <div class="lane"><h3>🤔 Maybe (${maybe.length})</h3>${maybe.map(cardHTML).join("")||'<span class="sub">Park jobs here from the Jobs tab.</span>'}</div>
    <div class="lane"><h3>📝 To apply (${saved.length})</h3>${saved.map(cardHTML).join("")}</div>
    <div class="lane"><h3>✅ Applied (${done.length})</h3>${done.map(cardHTML).join("")}</div>
  </div>
  <p class="sub">"To apply" and "Applied" mirror Notion (checkbox or platform buttons).
  Flip statuses in Notion anytime — the radar treats you as the source of truth.</p>`;
}

function researchLinks(co) {
  const q = encodeURIComponent(co);
  return `<div class="rlinks">
    <a target="_blank" rel="noopener" href="https://www.linkedin.com/search/results/people/?keywords=${q}%20recruiter%20university">🔎 recruiters</a>
    <a target="_blank" rel="noopener" href="https://www.linkedin.com/search/results/people/?keywords=${q}%20software%20engineer%20${ME.school}">🎓 ${ME.school} alumni there</a>
    <a target="_blank" rel="noopener" href="https://www.levels.fyi/companies/${q.toLowerCase().replace(/%20/g,"-")}">💰 levels.fyi</a>
    <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+engineering+blog">📝 eng blog</a>
    <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+new+grad+interview+process">🧭 interview intel</a>
  </div>`;
}
function templates(j) {
  const first = t => t.split(",")[0];
  return [
["Recruiter DM", `Hi {name} — I'm ${ME.name}, a CS senior at ${ME.school} graduating this spring. I just saw the ${j.title} opening at ${j.company} and applied — it's squarely what I've been building toward (${j.sector==="healthtech"?"my clinical-data pipeline project maps right onto it":"my ML/data projects map right onto it"}). Would you be open to a quick chat, or could you point me to the right recruiter for university hiring? Thank you!`],
["Referral ask (alum)", `Hey {name} — fellow NJIT ${""}Highlander here (CS '26). I'm applying to the ${j.title} role at ${j.company} and it genuinely fits what I've been working on. If you feel comfortable, would you be open to referring me or sharing a bit about the team? Happy to send my resume + a short blurb to make it zero-effort. Either way, congrats on ${first(j.company)} — the work looks awesome.`],
["Follow-up (1 week)", `Hi {name} — following up on the ${j.title} role at ${j.company} I applied to on {date}. Still very interested; since applying I ${"{recent win, e.g. shipped X}"}. If there's anything else useful I can send over, happy to. Thanks for your time!`]];
}
function openWS(id) {
  const j = S.jobs[id] || S.applied.find(a=>a.id===id);
  if (!j) return;
  const w = S.web.jobs[id] = S.web.jobs[id] || {notes:"", links:[], contacts:[]};
  const c = S.culture[norm(j.company)];
  const a = appliedById()[id];
  $("#ws").classList.add("open");
  $("#wsp").innerHTML = `
    <button class="act" style="float:right" onclick="closeWS()">✕ close</button>
    <h2>${esc(j.company)}</h2>
    <div class="sub">${esc(j.title)} · <a href="${esc(j.url)}" target="_blank" rel="noopener">posting ↗</a>
      ${a?`· <span class="chip ${a.stage==="applied"?"applied":"saved"}">${a.stage==="applied"?"applied":"to apply"}</span>`:""}
      ${a&&a.notion_page?`· <a href="${esc(a.notion_page)}" target="_blank" rel="noopener">Notion ↗</a>`:""}</div>
    <div class="sect"><h4>Why it scored ${j.score??"?"}</h4>
      <div class="sub">${(j.score_reasons||[]).map(esc).join(" · ")||"–"}</div>
      ${j.llm_note?`<p class="sub">🤖 angle: <i>${esc(j.llm_note)}</i></p>`:""}</div>
    ${c?`<div class="sect"><h4>Culture — ${esc(c.industry)} ${c.source==="est."?"(AI-estimated)":"(curated)"}</h4>
      <div class="kv">
        <span class="k">prestige</span><span>${esc(c.prestige)} · fit ${c.fit}/100</span>
        <span class="k">wlb</span><span>${c.wlb}/5 · pace ${esc(c.pace)}</span>
        <span class="k">new-grad TC</span><span>${esc(c.new_grad_tc)}</span>
        <span class="k">vibe</span><span>${esc(c.vibe)} — ${esc(c.fit_notes)}</span>
      </div></div>`:""}
    <div class="sect"><h4>Company research</h4>${researchLinks(j.company)}</div>
    <div class="sect"><h4>Outreach — conversations & contacts</h4>
      <ul class="plain" id="wsLinks">${w.links.map((l,i)=>
        `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>
         <button class="act" onclick="rmLink('${id}',${i})">✕</button></li>`).join("")}</ul>
      <div class="bar"><input id="lkLabel" placeholder="label (e.g. Sarah DM)" style="width:10rem">
        <input id="lkUrl" placeholder="https:// convo / profile / thread">
        <button class="act" onclick="addLink('${id}')">add</button></div></div>
    <div class="sect"><h4>Outreach templates (copy, fill {name})</h4>
      ${templates(j).map(([t,body])=>`<div class="tpl"><b>${t}</b>
        <button class="act" style="float:right" onclick='navigator.clipboard.writeText(${JSON.stringify(body)});toast("Copied")'>copy</button>
        <br>${esc(body)}</div>`).join("")}</div>
    <div class="sect"><h4>Notes (resume tailoring, referrals, interview intel)</h4>
      <textarea onchange='S.web.jobs["${id}"].notes=this.value;saveWeb();toast("Saved")'>${esc(w.notes)}</textarea></div>
    <div class="sect acts">
      <button class="act" onclick='actMaybe(S.jobs["${id}"]||{id:"${id}"})'>maybe</button>
      <button class="act primary" onclick='actTrack(S.jobs["${id}"])'>track → Notion</button>
      <button class="act" onclick='actApplied(S.jobs["${id}"])'>mark applied</button>
    </div>`;
}
function closeWS(){ $("#ws").classList.remove("open"); render(); }
$("#ws").addEventListener("click", e=>{ if(e.target.id==="ws") closeWS(); });
function addLink(id){ const w=S.web.jobs[id];
  const url=$("#lkUrl").value.trim(); if(!url) return;
  w.links.push({label:$("#lkLabel").value.trim(), url}); saveWeb(); openWS(id); }
function rmLink(id,i){ S.web.jobs[id].links.splice(i,1); saveWeb(); openWS(id); }

function rCos() {
  const counts = {};
  for (const j of Object.values(S.jobs)) {
    const k = norm(j.company);
    counts[k] = counts[k]||{name:j.company, open:0, best:0};
    counts[k].open++; counts[k].best = Math.max(counts[k].best, j.score||0);
  }
  const q = norm(S.filter.q);
  let rows = Object.entries(counts).map(([k,v])=>({k, ...v, c:S.culture[k]}));
  if (q) rows = rows.filter(r=>r.k.includes(q));
  rows.sort((a,b)=>(b.c?.fit||0)-(a.c?.fit||0) || b.best-a.best);
  $("#main").innerHTML = `
    <div class="bar"><input type="search" placeholder="search ${rows.length} companies…"
      value="${esc(S.filter.q)}" oninput="S.filter.q=this.value;render()"></div>
    <div class="wrap"><table><tr><th>company</th><th>industry</th><th>prestige</th>
      <th>fit</th><th>wlb</th><th>new-grad tc</th><th>roles</th><th>research</th></tr>
    ${rows.slice(0,200).map(r=>`<tr>
      <td><b>${esc(r.name)}</b>${S.marquee.has(r.k)?' <span class="chip marquee">marquee</span>':""}</td>
      <td>${esc(r.c?.industry||"–")}</td><td>${esc(r.c?.prestige||"–")}</td>
      <td>${r.c?`${r.c.fit}/100${r.c.source==="est."?" <span class='sub'>est.</span>":""}`:"–"}</td>
      <td>${r.c?r.c.wlb+"/5":"–"}</td><td>${esc(r.c?.new_grad_tc||"–")}</td>
      <td>${r.open} (top ${r.best})</td><td>${researchLinks(r.name)}</td></tr>`).join("")}
    </table></div>`;
}

function rAI() {
  const jobs = Object.values(S.jobs);
  const withNote = jobs.filter(j=>j.llm_note).length;
  const doss = Object.values(S.culture);
  const lastRun = S.runs[S.runs.length-1];
  const scoutAgo = S.scout.last_run ? Math.round((Date.now()/1000-S.scout.last_run)/86400) : null;
  const scouts = Object.values(S.companies).filter(c=>c.origin==="scout");
  $("#main").innerHTML = `
    <div class="note">The cloud scores deterministically (auditable rubric, no AI needed).
      Your M1 Max runs <b>qwen3:30b</b> locally every 2h while awake — private, free — to add
      angles, culture dossiers, and re-ranks. Nothing here costs anything.</div>
    <div class="lanes">
      <div class="lane"><h3>Enrichment</h3>
        <div class="kv">
          <span class="k">jobs with AI angle</span><span>${withNote} / ${jobs.length}</span>
          <span class="k">culture dossiers</span><span>${doss.length}
            (${doss.filter(d=>d.source==="seed").length} curated,
             ${doss.filter(d=>d.source==="est.").length} AI-estimated)</span>
          <span class="k">last crawl</span><span>${lastRun?new Date(lastRun.ts*1000).toLocaleString():"–"}
            · ${lastRun?lastRun.new_jobs:0} new · ${lastRun?lastRun.alerts:0} alerts</span>
        </div></div>
      <div class="lane"><h3>Company scout (weekly)</h3>
        <div class="kv"><span class="k">last research pass</span>
          <span>${scoutAgo===null?"not yet run":scoutAgo+"d ago"}</span>
          <span class="k">scouted candidates</span><span>${scouts.length}</span></div>
        <ul class="plain">${scouts.slice(0,12).map(c=>`<li>${esc(c.name)}
          <span class="chip">${esc(c.status)}</span></li>`).join("")}</ul></div>
      <div class="lane"><h3>Registry</h3>
        <div class="kv">
          <span class="k">companies polled</span><span>${Object.values(S.companies).filter(c=>c.status==="active").length}</span>
          <span class="k">total registry</span><span>${Object.keys(S.companies).length}</span>
        </div></div>
    </div>`;
}

function rSet() {
  $("#main").innerHTML = `
    ${S.backend?`<div class="sect"><h4>Signed-in mode (recommended)</h4>
      <p class="sub" style="max-width:44rem">${S.auth
        ? `Signed in as <b>@${esc(S.auth.login)}</b>${S.auth.owner
            ? " — full write access. Every track/applied click fires instantly, and notes sync across devices."
            : " — read-only (this radar belongs to the repo owner)."}
           <a href="/api/logout">Sign out</a>.`
        : `<a href="/api/login"><b>Sign in with GitHub</b></a> once per browser. GitHub's OAuth
           hands the backend your identity; your credential is sealed in an httpOnly cookie
           this page's JavaScript cannot read, and the app secrets live only in Vercel's
           encrypted env store — never in the repo, never in the frontend.`}</p></div>`:""}
    <div class="sect"><h4>How auth works (no secrets on this site)</h4>
      <p class="sub" style="max-width:44rem">This is a static page on a <b>public</b> repo, so it
      holds no secrets — anything embedded here would belong to the whole internet. Instead,
      <b>track / applied</b> open a prefilled GitHub issue that you submit while logged into
      GitHub; the radar's backend <b>only obeys the repo owner</b> and ignores everyone else, then
      auto-closes the issue. Share this URL freely — a friend gets a read-only view and their
      clicks are ignored by design. Without a token, notes &amp; links live only in this browser
      (private, but not synced between devices).</p></div>
    <div class="sect"><h4>Optional: a token for instant writes + cross-device notes</h4>
      <p class="sub" style="max-width:44rem">Only if you want one-click writes without the GitHub
      hop: a <b>fine-grained</b> token scoped to <span class="mono">${REPO}</span> only, with
      <b>Contents: read/write</b> only (<a target="_blank" rel="noopener"
      href="https://github.com/settings/personal-access-tokens/new">create here</a>). It is stored
      in this browser's localStorage — never in the repo or the page — so don't do this on a
      shared computer, and revoke it anytime at github.com/settings/tokens. Worst case if this
      browser is compromised: this one repo, nothing else on your account. Note: with a token,
      notes sync via <span class="mono">state/web_state.json</span>, which is public — keep
      anything sensitive out or skip the token.</p>
      <div class="bar"><input id="pat" type="password" placeholder="github_pat_… (optional)" style="min-width:20rem"
        value="${esc(token())}">
        <button class="act primary" onclick='localStorage.setItem("jr_pat",$("#pat").value.trim());testPAT()'>save & test</button>
        <button class="act" onclick='localStorage.removeItem("jr_pat");toast("Token removed");render()'>remove</button></div>
      <p id="patRes" class="sub"></p></div>`;
}
async function testPAT() {
  try { const r = await gh(`/repos/${REPO}`); const d = await r.json();
    $("#patRes").textContent = `✓ token works (repo: ${d.full_name}, push: ${d.permissions?.push})`;
    toast("Token saved"); }
  catch(e){ $("#patRes").textContent = "✗ " + e.message.slice(0,120); }
}

window.S = S; window.render = render; window.openWS = openWS; window.closeWS = closeWS;
window.actMaybe = actMaybe; window.actTrack = actTrack; window.actApplied = actApplied;
window.addLink = addLink; window.rmLink = rmLink; window.testPAT = testPAT; window.$ = $;
boot();
</script>
</body>
</html>
