<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🎯%3C/text%3E%3C/svg%3E">
<title>Job Radar — Platform</title>
<style>
  :root {
    --paper:#FAFBF9; --ink:#1C2430; --muted:#5A6B7A; --accent:#2E7D5B;
    --accent-ink:#24634A; --amber:#9A6A1F; --line:#DDE4E0; --card:#F1F5F2;
    --code:#E9EFEA; --danger:#A33A2E;
  }
  :root[data-theme="dark"] {
    --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
    --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
    --code:#1F2A33; --danger:#E07862;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
      --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
      --code:#1F2A33; --danger:#E07862;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;
         font-size:16px; line-height:1.5; }
  .mono, button, input, select, textarea, .chip, th, .tag {
    font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:0.9rem; padding:0.7rem 1rem;
           border-bottom:2px solid var(--ink); flex-wrap:wrap; position:sticky; top:0;
           background:var(--paper); z-index:30; }
  header h1 { font-size:1.05rem; margin:0; white-space:nowrap; }
  #laneSwitch { display:flex; gap:0.2rem; padding:0.16rem; border:1px solid var(--line); border-radius:7px; background:var(--card); }
  #laneSwitch button { border:0; background:transparent; color:var(--muted); border-radius:5px; padding:0.25rem 0.55rem; cursor:pointer; font-size:0.72rem; }
  #laneSwitch button.on { background:var(--accent); color:#fff; }
  nav { display:flex; gap:0.25rem; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--muted);
               padding:0.3rem 0.65rem; border-radius:5px; cursor:pointer; font-size:0.8rem; }
  nav button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  nav button:hover { color:var(--ink); }
  #stats { margin-left:auto; font-size:0.72rem; color:var(--muted); display:flex; gap:0.9rem; }
  #stats b { color:var(--ink); font-size:0.95rem; display:block; text-align:right; }
  main { max-width:72rem; margin:0 auto; padding:1rem; }
  .bar { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.9rem; align-items:center; }
  input, select, textarea { background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:5px; padding:0.4rem 0.55rem; font-size:0.8rem; }
  input[type=search] { flex:1; min-width:12rem; }
  button.act { background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:5px; padding:0.3rem 0.6rem; cursor:pointer; font-size:0.75rem; }
  button.act:hover { border-color:var(--accent); color:var(--accent-ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; opacity:0.9; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .job { display:flex; gap:0.7rem; padding:0.55rem 0.4rem; border-bottom:1px solid var(--line);
         align-items:baseline; flex-wrap:wrap; }
  .job:hover { background:var(--card); }
  .job.selected { background:rgba(46,125,91,.08); border-left:3px solid var(--accent); padding-left:.25rem; }
  .job.excluded { background:rgba(163,58,46,.08); border-left:3px solid var(--danger); padding-left:.25rem; }
  .job.excluded .score { color:var(--danger); border-color:var(--danger); background:none; }
  .job.excluded .co, .job.excluded .jobtitle { color:var(--danger); }
  .job[tabindex] { cursor:pointer; }
  .score { min-width:2.2rem; text-align:center; font-weight:700; font-size:0.85rem;
           border-radius:5px; padding:0.1rem 0.2rem; background:var(--code); }
  .score.hot { color:var(--accent-ink); border:1px solid var(--accent-ink); background:none; }
  .job .body { flex:1; min-width:14rem; }
  .job .co { font-weight:700; }
  .job a { color:var(--accent-ink); text-decoration-thickness:1px; }
  .jobtitle { border:0; background:none; color:var(--accent-ink); padding:0; cursor:pointer;
              font:inherit; text-decoration:underline; text-decoration-thickness:1px;
              text-underline-offset:2px; text-align:left; }
  .jobtitle:hover { color:var(--ink); }
  .facts { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.25rem; }
  .sub { font-size:0.78rem; color:var(--muted); }
  .chip { font-size:0.65rem; border:1px solid var(--line); color:var(--muted);
          border-radius:999px; padding:0.05rem 0.45rem; white-space:nowrap; }
  .chip.marquee { color:var(--amber); border-color:var(--amber); }
  .chip.saved { color:var(--amber); border-color:var(--amber); }
  .chip.to_tailor { color:#7b61c9; border-color:#7b61c9; }
  .chip.applied { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.excluded { color:var(--danger); border-color:var(--danger); }
  .chip.maybe { color:var(--muted); }
  .chip.good { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.bad { color:var(--danger); border-color:var(--danger); }
  .chip.unknown { color:var(--muted); border-style:dashed; }
  .togglebar { display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center; }
  .togglebar .label { font-size:0.7rem; color:var(--muted); margin-right:0.2rem; }
  button.toggle { background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:0.15rem 0.5rem; cursor:pointer; font-size:0.68rem; }
  button.toggle.on { color:var(--accent-ink); border-color:var(--accent-ink); background:var(--paper); }
  button.toggle.excluded { color:var(--danger); border-color:var(--danger); background:rgba(163,58,46,.08); }
  .acts { display:flex; gap:0.3rem; }
  .filters { padding:0.65rem; margin-bottom:0.75rem; background:var(--card);
             border:1px solid var(--line); border-radius:8px; }
  .filters .bar { margin-bottom:0.45rem; }
  .filters .bar:last-child { margin-bottom:0; }
  .lanes { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.9rem; }
  .manual-add { background:var(--card); border:1px solid var(--line); border-radius:8px;
                padding:0.8rem; margin-bottom:0.9rem; }
  .manual-add h2 { margin:0; font-size:0.95rem; }
  .manual-add .bar { margin:0.55rem 0 0; }
  .manual-add input { flex:1 1 12rem; min-width:0; }
  .lane { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem; }
  .lane h3 { margin:0 0 0.6rem; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
             font-family:ui-monospace,Menlo,monospace; color:var(--muted); }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:6px;
          padding:0.5rem 0.6rem; margin-bottom:0.5rem; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card .co { font-weight:700; font-size:0.9rem; }
  .card .t { font-size:0.8rem; }
  /* workspace drawer */
  #ws { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:50; display:none; }
  #ws.open { display:block; }
  #wsp { position:absolute; right:0; top:0; bottom:0; width:min(560px,100%);
         background:var(--paper); border-left:2px solid var(--ink); overflow-y:auto; padding:1.1rem; }
  /* tutorial/account workspace */
  #tutorial { position:fixed; inset:0; background:rgba(0,0,0,.52); z-index:70;
              display:none; padding:clamp(.7rem,4vw,2.5rem); place-items:center; }
  #tutorial.open { display:grid; }
  #tutorialp { width:min(920px,100%); max-height:min(760px,100%); overflow:hidden;
               display:grid; grid-template-columns:180px minmax(0,1fr); background:var(--paper);
               border:1px solid var(--ink); border-radius:12px; box-shadow:0 20px 70px rgba(0,0,0,.35); }
  .tut-nav { background:var(--card); border-right:1px solid var(--line); padding:.8rem; overflow-y:auto; }
  .tut-nav h3 { margin:.2rem .4rem .7rem; font-size:.72rem; letter-spacing:.11em;
                text-transform:uppercase; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }
  .tut-nav button { width:100%; text-align:left; background:none; border:1px solid transparent;
                    border-radius:7px; color:var(--muted); padding:.55rem .6rem; cursor:pointer;
                    font-size:.76rem; margin-bottom:.18rem; }
  .tut-nav button.on { color:var(--accent-ink); border-color:var(--accent-ink); background:var(--paper); }
  .tut-main { min-width:0; overflow-y:auto; padding:1.2rem 1.35rem 1.5rem; }
  .tut-head { display:flex; justify-content:space-between; gap:1rem; align-items:start; }
  .tut-head h2 { margin:0; font-size:1.25rem; }
  .tut-close { border:0; background:none; color:var(--muted); cursor:pointer; font-size:1.2rem; }
  .tut-kicker { color:var(--accent-ink); font:600 .68rem ui-monospace,Menlo,monospace;
                letter-spacing:.1em; text-transform:uppercase; margin:.25rem 0 .35rem; }
  .tut-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.65rem; margin-top:.85rem; }
  .tut-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.75rem; }
  .tut-card h4 { margin:0 0 .25rem; font-size:.85rem; }
  .tut-card p { margin:.25rem 0; font-size:.78rem; color:var(--muted); }
  .tut-steps { counter-reset:step; display:grid; gap:.55rem; margin:.75rem 0; }
  .tut-step { display:grid; grid-template-columns:1.6rem 1fr; gap:.55rem; align-items:start; font-size:.82rem; }
  .tut-step::before { counter-increment:step; content:counter(step); display:grid; place-items:center;
                      width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent); color:#fff;
                      font:700 .68rem ui-monospace,Menlo,monospace; }
  .provider-row { display:flex; flex-wrap:wrap; gap:.45rem; margin:.7rem 0; }
  .provider { display:inline-flex; align-items:center; gap:.35rem; text-decoration:none; }
  .provider .mark { width:1.35rem; height:1.35rem; display:grid; place-items:center; border-radius:50%;
                    background:var(--ink); color:var(--paper); font:700 .7rem ui-monospace,Menlo,monospace; }
  .provider.google .mark { background:#4285f4; }
  .identity-list { display:grid; gap:.35rem; margin:.7rem 0; }
  .identity-row { display:flex; justify-content:space-between; gap:.7rem; align-items:center;
                 border-bottom:1px solid var(--line); padding:.45rem 0; font-size:.8rem; }
  .identity-row .state { color:var(--accent-ink); font:600 .68rem ui-monospace,Menlo,monospace; }
  .tut-note { background:var(--code); border-left:3px solid var(--accent); padding:.6rem .75rem;
              border-radius:0 6px 6px 0; color:var(--muted); font-size:.78rem; margin:.7rem 0; }
  .tracker-banner { display:flex; justify-content:space-between; align-items:center; gap:.8rem;
                    flex-wrap:wrap; background:var(--code); border:1px solid var(--line);
                    border-left:3px solid var(--amber); border-radius:0 8px 8px 0;
                    padding:.65rem .8rem; margin-bottom:.9rem; }
  .tracker-banner.connected { border-left-color:var(--accent); }
  .tracker-copy { display:grid; gap:.08rem; min-width:0; }
  .tracker-copy b { font-size:.82rem; }
  .tracker-copy .sub { font-size:.74rem; }
  .tracker-quick { display:inline-flex; align-items:center; gap:.28rem; white-space:nowrap; }
  .tracker-banner .acts { flex-wrap:wrap; }
  .tracker-options { width:100%; border-top:1px solid var(--line); margin-top:.35rem; padding-top:.45rem; }
  .tracker-options summary { cursor:pointer; color:var(--accent-ink); font:600 .7rem ui-monospace,Menlo,monospace;
                             letter-spacing:.03em; }
  .tracker-choice { display:flex; flex-wrap:wrap; gap:.55rem; margin:.45rem 0; }
  .tracker-choice label { display:inline-flex; align-items:center; gap:.3rem; font-size:.76rem; cursor:pointer; }
  .tracker-choice input { accent-color:var(--accent); }
  .tracker-choice small { color:var(--muted); font-size:.68rem; }
  .stage-control { display:inline-flex; align-items:center; gap:.3rem; color:var(--muted);
                   font:600 .64rem ui-monospace,Menlo,monospace; text-transform:uppercase; }
  .stage-control select { min-width:7.2rem; padding:.2rem .35rem; font-size:.68rem; text-transform:none; }
  @media (max-width:640px) {
    #tutorialp { grid-template-columns:1fr; max-height:100%; }
    .tut-nav { border-right:0; border-bottom:1px solid var(--line); display:flex; gap:.25rem;
               overflow-x:auto; padding:.5rem; }
    .tut-nav h3 { display:none; }
    .tut-nav button { width:auto; white-space:nowrap; margin:0; }
    .tut-main { padding:1rem; }
  }
  #wsp h2 { margin:0 0 0.2rem; font-size:1.15rem; }
  .sect { margin-top:1.1rem; }
  .wstabs { display:flex; gap:0.25rem; margin-top:0.9rem; border-bottom:1px solid var(--line);
            padding-bottom:0.45rem; }
  .wstabs button { background:none; border:1px solid transparent; color:var(--muted);
                   padding:0.25rem 0.6rem; border-radius:5px; cursor:pointer; font-size:0.75rem; }
  .wstabs button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  .wstabs button:hover { color:var(--ink); }
  .sect h4 { margin:0 0 0.4rem; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
             color:var(--accent-ink); font-family:ui-monospace,Menlo,monospace; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:0.15rem 0.8rem; font-size:0.82rem; }
  .kv .k { color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:0.7rem; }
  .score-explanation { margin-top:0.65rem; border-top:1px solid var(--line); padding-top:0.55rem; }
  .score-explanation summary { cursor:pointer; color:var(--accent); font-weight:600; }
  .score-summary { margin:0.5rem 0 0; color:var(--ink); font-size:.82rem; line-height:1.4; }
  .score-dimensions { display:grid; gap:.42rem; margin-top:.55rem; }
  .score-dimension { padding:.42rem .5rem; border-left:2px solid var(--line); background:rgba(255,255,255,.02); }
  .score-dimension-head { display:flex; align-items:baseline; justify-content:space-between; gap:.7rem; font-weight:600; }
  .score-dimension-points { color:var(--accent-ink); font:600 .72rem ui-monospace,Menlo,monospace; white-space:nowrap; }
  .score-dimension-what, .score-dimension-why { display:block; font-size:.74rem; line-height:1.35; }
  .score-dimension-what { color:var(--muted); margin-top:.1rem; }
  .score-dimension-why { margin-top:.12rem; }
  .score-dimension.disabled { opacity:.58; border-left-style:dashed; }
  .score-dimension-why b, .score-final-note b { color:var(--accent-ink); }
  .score-controls { border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; }
  .score-controls summary { cursor:pointer; color:var(--accent-ink); font-weight:600; }
  .score-control-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:.35rem .8rem; margin:.55rem 0; }
  .score-control-row { display:flex; gap:.45rem; align-items:flex-start; padding:.35rem; border:1px solid var(--line); border-radius:6px; }
  .score-control-row input { margin-top:.12rem; accent-color:var(--accent-ink); }
  .score-control-row span { display:grid; gap:.12rem; font-size:.78rem; }
  .score-control-row small { color:var(--muted); line-height:1.3; }
  .score-final-note { margin:.5rem 0 0; font-size:.76rem; line-height:1.35; }
  .rating-reasons { display:grid; gap:0.35rem; margin-top:0.55rem; }
  .rating-reason { display:grid; grid-template-columns:8rem 1fr; gap:0.55rem; padding:0.35rem 0.45rem; border-left:2px solid var(--line); background:rgba(255,255,255,.02); }
  .rating-reason .k { color:var(--muted); font-size:.72rem; text-transform:capitalize; }
  .decision { background:var(--card); border:1px solid var(--line); border-radius:8px;
              padding:0.75rem; margin-top:0.9rem; }
  .decision .facts { display:flex; gap:0.35rem; flex-wrap:wrap; margin-top:0.45rem; }
  .drawer-actions { position:sticky; bottom:-1.1rem; background:var(--paper);
                    border-top:1px solid var(--line); padding:0.75rem 0 1.1rem; z-index:2; }
  textarea { width:100%; min-height:5.5rem; font-size:0.82rem; }
  .tpl { background:var(--code); border-radius:6px; padding:0.6rem; font-size:0.78rem;
         white-space:pre-wrap; margin-bottom:0.4rem; }
  ul.plain { list-style:none; padding:0; margin:0.3rem 0; }
  ul.plain li { display:flex; gap:0.4rem; align-items:center; padding:0.15rem 0; font-size:0.82rem; }
  table { border-collapse:collapse; width:100%; font-size:0.82rem; }
  th { text-align:left; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase;
       color:var(--muted); border-bottom:1.5px solid var(--ink); padding:0.3rem 0.6rem 0.3rem 0; }
  td { border-bottom:1px solid var(--line); padding:0.4rem 0.6rem 0.4rem 0; }
  .wrap { overflow-x:auto; }
  .table-scroll { overflow-x:auto; margin-top:0.6rem; }
  .note { background:var(--card); border-left:3px solid var(--amber); padding:0.6rem 0.8rem;
          border-radius:0 5px 5px 0; font-size:0.85rem; margin-bottom:0.9rem; }
  #bootNotice { max-width:72rem; margin:0 auto; padding:0 1rem; }
  .boot-notice { background:rgba(163,58,46,.08); border:1px solid var(--danger);
                 border-left:4px solid var(--danger); border-radius:0 6px 6px 0;
                 padding:.65rem .8rem; margin:1rem 0 0; font-size:.82rem; }
  .boot-notice strong { color:var(--danger); }
  .boot-notice details { margin-top:.35rem; }
  .boot-notice summary { cursor:pointer; color:var(--danger); font-family:ui-monospace,"SF Mono",Menlo,monospace;
                          font-size:.72rem; }
  .boot-notice ul { margin:.35rem 0 0 1.1rem; padding:0; }
  .testing-hero { border:1px solid var(--accent-ink); border-radius:10px; padding:0.9rem;
                  margin-bottom:0.9rem; background:var(--card); }
  .testing-hero h2 { margin:0 0 0.25rem; font-size:1.1rem; }
  .testing-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,0.8fr);
                  gap:0.9rem; align-items:start; }
  .testing-stack { display:grid; gap:0.7rem; }
  .testing-role { display:grid; grid-template-columns:3rem minmax(0,1fr); gap:0.65rem;
                  border-bottom:1px solid var(--line); padding:0.65rem 0.15rem; }
  .testing-role:last-child { border-bottom:0; }
  .testing-role .match-score { width:3rem; height:3rem; border:1px solid var(--accent-ink);
                  color:var(--accent-ink); border-radius:50%; display:grid; place-items:center;
                  font:700 0.86rem ui-monospace,"SF Mono",Menlo,monospace; }
  .testing-role h3 { margin:0; font-size:0.9rem; }
  .testing-role details { margin-top:0.35rem; }
  .testing-role summary { cursor:pointer; color:var(--accent-ink); font-size:0.75rem;
                          font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .testing-role .kv { margin-top:0.35rem; }
  .studio-shell { display:grid; grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr); gap:1rem; }
  .studio-panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.85rem; }
  .studio-panel h3 { margin:0 0 .45rem; font-size:.82rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .studio-jobs { max-height:calc(100vh - 260px); overflow:auto; }
  .studio-job { display:grid; grid-template-columns:2.2rem minmax(0,1fr); gap:.55rem; width:100%; text-align:left; background:transparent; color:var(--ink); border:1px solid transparent; border-radius:7px; padding:.55rem; cursor:pointer; }
  .studio-job:hover, .studio-job.selected { background:var(--paper); border-color:var(--accent); }
  .studio-job .match-score { grid-row:span 2; width:2.15rem; height:2.15rem; display:grid; place-items:center; border:1px solid var(--accent-ink); border-radius:6px; color:var(--accent-ink); font:700 .78rem ui-monospace,Menlo,monospace; }
  .studio-job strong { display:block; font-size:.82rem; }
  .studio-job small { display:block; color:var(--muted); font-size:.7rem; margin-top:.12rem; }
  .studio-toolbar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.45rem; margin-bottom:.55rem; }
  .studio-toolbar input { min-width:0; width:100%; }
  .studio-selected { border:1px solid var(--accent-ink); border-radius:8px; padding:.75rem; background:var(--paper); }
  .studio-selected h2 { margin:0; font-size:1.1rem; }
  .studio-selected .studio-meta { margin-top:.18rem; }
  .studio-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; margin:.7rem 0; }
  .studio-action { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:.65rem; }

function isOpenRelevant(j) {

  if (S.lane === "internship") return true;
  const hardReject = /^(intern\/co-op\/contract|senior\+ title|PhD-targeted title|requires clearance|non-US location|requires [1-9]\+ years(?: \(not new-grad\))?|not an AI\/SWE\/DS role)$/i;
  return !(j.score_reasons||[]).some(reason =>
    hardReject.test(String(reason).replace(/^re-gate v\d+:\s*/i,"")));
}
function jobList() {
  const byId = appliedById(); const f = S.filter; const q = norm(f.q);
  let rows = Object.values(S.jobs).filter(isOpenRelevant);
  const inactiveIds = new Set(S.applied.filter(applicationInactive).map(a=>a.id));
  rows = rows.filter(j=>!inactiveIds.has(j.id));
  if (f.sort === "best" && f.bestWindow && f.bestWindow !== "all") {
    const cutoff = Date.now() / 1000 - Number(f.bestWindow);
    // A role already in the owner's pipeline remains actionable even when
    // its original posting date is older than the discovery window.
    rows = rows.filter(j => byId[j.id] || S.web.maybe.includes(j.id) || S.web.jobs[j.id]
      || postedTs(j) > cutoff);
  }
  if (!f.showExcluded) rows = rows.filter(j=>!isExcluded(j.id));
  if (S.lane === "internship" && !f.review) rows = rows.filter(j=>["title","body"].includes((j.internship_eligibility||{}).internship_signal));
  rows = rows.filter(j=>byId[j.id] || S.web.maybe.includes(j.id) || S.web.jobs[j.id]
    || !postedTs(j) || Date.now()/1000-postedTs(j) <= 365*86400);
  if (f.alert) rows = rows.filter(j=>j.alert_ok);
  rows = rows.filter(j=>(j.score||0) >= f.min);
  if (f.sectors?.length) rows = rows.filter(j=>f.sectors.includes(j.sector));
  if (f.roles?.length) rows = rows.filter(j=>f.roles.includes(roleFamily(j)));
  else rows = rows.filter(j=>roleFamily(j)!=="other");
  if (f.excludedRoles?.length) rows = rows.filter(j=>!f.excludedRoles.includes(roleFamily(j)));
  if (f.sponsorship) rows = rows.filter(j=>sponsorStatus(j)===f.sponsorship);
  if (f.sponsorHistory) rows = rows.filter(j=>sponsorHistoryStatus(j)===f.sponsorHistory);
  if (f.experience === "entryfit") rows = rows.filter(j=>experienceStatus(j)!=="experienced");
  else if (f.experience) rows = rows.filter(j=>experienceStatus(j)===f.experience);
  if (f.career === "newgrad") rows = rows.filter(j=>j.explicit_new_grad);
  else if (f.career === "possible") rows = rows.filter(j=>j.early_career_possible);
  if (S.lane === "internship" && f.cohort) rows = rows.filter(j=>internshipCohortMatch(j)===f.cohort);
  if (q) rows = rows.filter(j=>norm(j.company+" "+j.title).includes(q));
  if (f.lane) rows = rows.filter(j=>laneOf(j.id,byId)===f.lane);
  if (f.sort === "new")
    rows.sort((a,b)=>(isExcluded(a.id)?1:0)-(isExcluded(b.id)?1:0) || postedTs(b)-postedTs(a) || (b.score||0)-(a.score||0));
  else
    rows.sort((a,b)=>(isExcluded(a.id)?1:0)-(isExcluded(b.id)?1:0) || (b.score||0)-(a.score||0) || postedTs(b)-postedTs(a));

}
function postedTs(j){ return j.posted_at || j.first_seen || 0; }
function ago(ts){
  if (!ts) return "";
  const d = (Date.now()/1000 - ts) / 86400;
  if (d < 1)  return Math.max(1, Math.round(d*24)) + "h";
  if (d < 60) return Math.round(d) + "d";
  return Math.round(d/30) + "mo";
}

/* ---------- learned ranking signals ----------------------------------- */
// Saved and applied roles are the positive sample for the deterministic Radar
// score. This page explains the same bounded signals; it is not the scorer.
const TASTE_STOPWORDS = new Set([
  "engineer","engineering","software","the","and","of","for","a","an",
  "new","grad","early","career","level","full","time","remote","onsite",
  "hybrid","associate","analyst","manager","product","project","owner",
  "business","solutions","architect","architecture","researcher","research",
]);
function tasteTokens(title) {
  return new Set(norm(title).split(" ").filter(t => t.length > 2 && !TASTE_STOPWORDS.has(t)));
}
function tasteSample() {
  const sample = [], seen = new Set();
  for (const entry of S.applied) {
    if (applicationInactive(entry)) continue;
    const j = S.jobs[entry.id] || entry;
    if (!j || seen.has(j.id)) continue;
    seen.add(j.id);
    sample.push({job:j, weight:(entry.stage||"saved")==="saved"?2:3,
      stage:entry.stage||"saved", company:norm(j.company), role:roleFamily(j),
      sector:norm(j.sector), titleTokens:tasteTokens(j.title)});
  }
  return sample;
}
function tasteCounts(sample) {
  const companies = {}, roles = {}, tokens = {};
  for (const {job,weight,company,role,titleTokens} of sample) {
    if (company) companies[company] = (companies[company]||0) + weight;
    roles[role] = (roles[role]||0) + weight;
    for (const t of titleTokens) tokens[t] = (tokens[t]||0) + weight;
  }
  const rank = obj => Object.entries(obj).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
  return {companies:rank(companies), roles:rank(roles), tokens:rank(tokens)};
}
function similarityFor(job, sample) {
  const jt = tasteTokens(job.title), jr = roleFamily(job), js = norm(job.sector), jc = norm(job.company);
  let best = {score:0, why:""};
  for (const source of sample) {
    const overlap = [...jt].filter(t=>source.titleTokens.has(t));
    let score = Math.min(8, overlap.length * 2);
    const why = [];
    if (jc && jc === source.company) { score += 7; why.push("same company"); }
    if (jr === source.role) { score += 3; why.push(ROLE_LABELS[jr] || "same field"); }
    if (js && js === source.sector) { score += 1; why.push("same sector"); }
    if (overlap.length) why.push("shared " + overlap.slice(0,3).join(", "));
    if (score > best.score) best = {score, why:why.join(" · ")};
  }
  return best;
}
function tasteSimilarityCandidates(sample, savedIds) {
  const companies = new Set(sample.map(source=>source.company).filter(Boolean));
  const roles = new Set(sample.map(source=>source.role));
  const sectors = new Set(sample.map(source=>source.sector).filter(Boolean));
  const titleTokens = new Set(sample.flatMap(source=>[...source.titleTokens]));
  return Object.values(S.jobs)
    .filter(job => isOpenRelevant(job) && roleFamily(job)!=="other" && !savedIds.has(job.id))
    .map(job => {
      const company = norm(job.company), role = roleFamily(job), sector = norm(job.sector);
      const tokens = tasteTokens(job.title);
      const overlap = [...tokens].filter(token=>titleTokens.has(token)).length;
      const hint = (companies.has(company)?7:0) + (roles.has(role)?3:0) +
        (sectors.has(sector)?1:0) + Math.min(8, overlap * 2);
      return {job, hint};
    })
    .filter(row=>row.hint>0)
    .sort((a,b)=>b.hint-a.hint || (b.job.score||0)-(a.job.score||0) || postedTs(b.job)-postedTs(a.job))
    .slice(0, 1500)
    .map(row=>row.job);
}
function tasteContribution(job) {
  const reasons = (job.score_reasons||[]).filter(reason =>
    /you've engaged with|title matches your history|learned (from|role preference|sector preference|company preference|title signals)|explicit (company|title) feedback|previously skipped/.test(String(reason)));
  const points = reasons.reduce((sum, reason) => {
    const m = String(reason).match(/([+-]\d+)(?:$|\s|\))/);
    return sum + (m ? Number(m[1]) : 0);
  }, 0);
  return {points, reasons};
}

async function sendTasteFeedback(job, vote, selectorId) {

  const allowed = vote === "up" ? new Set(["company","role","both"])
    : new Set(["company","role","eligibility","location","other"]);
  const reason = allowed.has(selected) ? selected : (vote === "up" ? "both" : "other");
  try {
    if (S.auth?.owner) await apiAction("feedback", job, {vote, reason});
    else if (!S.backend) { issueFeedback(job, vote, reason); return; }
    else { toast("Sign in as the repository owner to send ranking feedback"); return; }
    S.feedback = S.feedback || {};
    S.feedback.taste_events = S.feedback.taste_events || [];
    S.feedback.taste_events.push({job_id:job.id, company:job.company, title:job.title, vote, reason});
    toast("Feedback queued · rankings update on the next rescore");
    openWS(job.id);
  } catch (error) { toast("Feedback failed: " + error.message.slice(0,90)); }
}

const rowActions = new Set();
function cycleJobSelectionKey(event, job) {
  if (event.key !== "Enter" && event.key !== " ") return;
  event.preventDefault(); cycleJobSelection(event, job);
}
async function cycleJobSelection(event, job) {
  if (event?.target?.closest?.("button,a,input,select,textarea,label")) return;
  if (!job || rowActions.has(job.id)) return;
  rowActions.add(job.id);
  try {
    if (isExcluded(job.id)) {
      S.web.excluded = S.web.excluded.filter(id => id !== job.id);
      saveWeb(); render(); toast("Restored to active Jobs"); return;
    }
    if (appliedById()[job.id]) {
      S.web.excluded = [...new Set([...S.web.excluded, job.id])];
      saveWeb(); render(); toast("Excluded from active Jobs · show excluded to undo"); return;
    }
    await actTrack(job);
  } finally { rowActions.delete(job.id); }
}
async function actMaybe(j) {
  const i = S.web.maybe.indexOf(j.id);
  if (S.auth && S.userTracker && trackerBackend() === "google") {
    try { if (!await doWrite(i>=0 ? "untrack" : "maybe", j)) return; }
    catch(e) { toast("Tracker update failed: "+e.message.slice(0,90)); return; }
  }
  if (i>=0) S.web.maybe.splice(i,1); else S.web.maybe.push(j.id);

    const url=new URL(value), host=url.hostname.toLowerCase();
    if(!["http:","https:"].includes(url.protocol)||url.username||url.password)return null;
    const aggregator=/\b(jobright\.ai|simplify\.jobs|linkedin\.com|indeed\.com)\b/.test(host);
    const direct=/\b(ashbyhq\.com|greenhouse\.(?:io|com)|lever\.co|smartrecruiters\.com|myworkdayjobs\.com|myworkdaysite\.com|jobs\.apple\.com|amazon\.jobs)\b/.test(host)||/\b(careers?|jobs?)\b/.test(host);

let applicationAgentExtensionSequence=0;
let applicationAgentReloadReconnectStarted=false;
let applicationAgentStatusProbePromise=null;
function applicationAgentExtensionCommand(command,payload={}) {
  return new Promise((resolve,reject)=>{
    const requestId=`agent-extension-${Date.now()}-${++applicationAgentExtensionSequence}`;
    const timeout=command==="sync_queue"?30000:command==="set_pairing"?10000:5000;
    const timer=setTimeout(()=>{window.removeEventListener("message",receive);reject(new Error("The paired extension did not answer. Open the Job Radar extension once, then retry."));},timeout);
    function receive(event) {
      if (event.source!==window||event.origin!==location.origin||event.data?.type!=="job-radar:extension-command-result"||event.data.requestId!==requestId) return;
      clearTimeout(timer); window.removeEventListener("message",receive); resolve(event.data.result||{});
    }
    window.addEventListener("message",receive);
    window.postMessage({type:"job-radar:extension-command",command,requestId,...payload},location.origin);
  });
}
async function probeApplicationAgentExtension(renderNow=true) {
  if (applicationAgentStatusProbePromise) return applicationAgentStatusProbePromise;
  S.applicationAgent.extensionProbeStarted=true;
  applicationAgentStatusProbePromise=(async()=>{
    try {
      const result=await applicationAgentExtensionCommand("status");
      if(result?.error)throw new Error(result.error);
      Object.assign(S.applicationAgent,{
        extensionConnected:true,
        extensionVersion:result.extensionVersion||S.applicationAgent.extensionVersion,
        extensionConfigured:Boolean(result.configured),
        automationEnabled:Boolean(result.automationEnabled),
        localReady:Boolean(result.localReady),
        localAnswerCount:Number(result.localAnswerCount)||0,
        extensionStatusError:result.localError||"",
        pairingNeedsRepair:!result.configured,
      });
      return result;
    } catch(error) {
      Object.assign(S.applicationAgent,{extensionConnected:false,extensionStatusError:String(error.message||error).slice(0,180)});
      return null;
    } finally {
      applicationAgentStatusProbePromise=null;
      if(renderNow&&S.tab==="agent")rApplicationAgent();
    }
  })();
  return applicationAgentStatusProbePromise;
}
async function controlApplicationAgentExtension(command) {
  if (S.applicationAgent.extensionAction) return;
  S.applicationAgent.extensionAction=command; rApplicationAgent();
  try {
    if(command==="sync_queue")await retireTerminalApplicationQueueItems();
    const result=await applicationAgentExtensionCommand(command);
    S.applicationAgent.extensionVersion=result?.extensionVersion||S.applicationAgent.extensionVersion;
    S.applicationAgent.extensionConnected=true;
    if (result?.error) throw new Error(result.error);
    if (command==="sync_queue") { S.applicationAgent.pairingNeedsRepair=false; S.applicationAgent.extensionConfigured=true; S.applicationAgent.automationEnabled=true; await probeApplicationAgentExtension(false); await loadApplicationAgent(false); rApplicationAgent(); toast(`Mac queue sync finished · ${result.recovered||0} recovered`); }
    else {
      sessionStorage.setItem("jr_extension_reload_pending","1");
      history.replaceState(null,"",`${location.pathname}${location.search}#agent`);
      toast("Extension reload requested · reconnecting safely");
      setTimeout(()=>location.reload(),650);
    }
  } catch(error) {
    if (/invalid|revoked|pair this mac/i.test(error.message)) S.applicationAgent.pairingNeedsRepair=true;
    toast(error.message.slice(0,180));
  } finally { S.applicationAgent.extensionAction=""; if(S.tab==="agent")rApplicationAgent(); }
}
function reconnectApplicationAgentAfterReload() {
  if (applicationAgentReloadReconnectStarted || !S.auth?.owner || sessionStorage.getItem("jr_extension_reload_pending")!=="1") return;
  applicationAgentReloadReconnectStarted=true;
  void (async()=>{
    let lastError=null;
    for(let attempt=0;attempt<3;attempt+=1){
      if(attempt)await new Promise(resolve=>setTimeout(resolve,1200*(attempt+1)));
      try{
        const status=await applicationAgentExtensionCommand("status");
        if(status?.error)throw new Error(status.error);
        Object.assign(S.applicationAgent,{
          extensionConnected:true,
          extensionVersion:status.extensionVersion||S.applicationAgent.extensionVersion,
          extensionConfigured:Boolean(status.configured),
          automationEnabled:Boolean(status.automationEnabled),
          localReady:Boolean(status.localReady),
          localAnswerCount:Number(status.localAnswerCount)||0,
          extensionStatusError:status.localError||"",
          pairingNeedsRepair:!status.configured,
        });
        sessionStorage.removeItem("jr_extension_reload_pending");
        await loadApplicationAgent(false);
        if(S.tab==="agent")rApplicationAgent();
        toast(`Extension v${S.applicationAgent.extensionVersion||"current"} reconnected · ${S.applicationAgent.automationEnabled?"automation running":"ready to sync"}`);
        return;
      }catch(error){lastError=error;}
    }
    applicationAgentReloadReconnectStarted=false;
    toast(`Extension restarted, but queue reconnect needs a retry · ${String(lastError?.message||lastError||"").slice(0,120)}`);
  })();
}

async function retireTerminalApplicationQueueItems() {

async function addManualJob() {
  const company = $("#manualCompany")?.value.trim();
  const title = $("#manualTitle")?.value.trim();
  const url = $("#manualUrl")?.value.trim();
  const location = $("#manualLocation")?.value.trim();
  if (!company || !title || !url) {
    toast("Company, title, and live posting link are required"); return;
  }
  try { new URL(url); } catch (_) { toast("Use a full https:// posting link"); return; }
  if (!canWrite()) {
    toast("Sign in with GitHub (top right) to add a role and sync it to Notion"); return;
  }
  const job = {id:"", company, title, url, locations:location?[location]:[]};
  try {
    if (await doWrite("manual-add", job)) {
      ["#manualCompany", "#manualTitle", "#manualUrl", "#manualLocation"].forEach(sel=>$(sel).value="");
      toast("Added to To apply → Notion syncs in ~1 min; refresh Pipeline to see it");
    }
  } catch(e) { toast("Add failed: "+e.message.slice(0,90)); }
}

function stageControl(id, current) {

  return `<label class="stage-control" onclick="event.stopPropagation()"><span>stage</span><select aria-label="Change application stage" onchange="setPipelineStage(${safeId},this.value)">

async function setPipelineStage(id, stage) {
  const job = jobById(id);
  if (!job || !PIPELINE_STAGES.some(([value]) => value === stage)) return;
  try {
    const payload = {stage};
    if (stage === "to_tailor") payload.tailored_at = Math.floor(Date.now() / 1000);
    if (S.auth && S.userTracker) await trackerAction("stage", job, payload);
    else if (S.auth?.owner) await apiAction("stage", job, payload);
    else { toast("Connect Google before changing application stages"); return; }
    if (stage === "maybe") {
      S.applied = S.applied.filter(entry => entry.id !== id);
      if (!S.web.maybe.includes(id)) S.web.maybe.push(id);
    } else {
      S.web.maybe = S.web.maybe.filter(value => value !== id);
      const entry = S.applied.find(value => value.id === id);
      if (entry) { entry.stage = stage; if(payload.tailored_at)entry.tailored_at=payload.tailored_at; }
      else S.applied.push({id, company:job.company, title:job.title, url:job.url, stage, tailored_at:payload.tailored_at, via:"platform"});
    }
    saveWeb();
    if (stage==="to_tailor") {
      try { const queued=await queueAutopilotJobs([job]); toast(queued.duplicates?"Already active in Autopilot":"Added to Autopilot · resume preparation starts automatically"); }
      catch(error) { toast(`Choice saved; the paired Mac will pick it up automatically. ${error.message.slice(0,70)}`); }
    } else toast(`Stage changed to ${stage === "oa" ? "online assessment" : stage}`);
    render();
  } catch (error) { toast("Stage update failed: " + error.message.slice(0, 90)); }
}

    return `<div class="score-dimension${enabled?'':' disabled'}"><div class="score-dimension-head"><span>${esc(meta.label)}${enabled?'':' · excluded'}</span><span class="score-dimension-points">${esc(scorePoints(value))}</span></div>

  const reasons = (j.score_reasons||[]).map(reason => `<div class="rating-reason"><span class="k">${esc(scoreReasonLabel(reason))}</span><span>${esc(reason)}</span></div>`).join("");

      <p class="sub">Positive helps; zero means no signal; negative lowers. Uncapped utility ${esc(j.score_raw??'?')} → calibrated ${esc(j.score_calibrated??j.score??'?')} → final ${j.score??'?'} / 100. Resume Match is separate and uses your CV evidence graph.</p>${finalWhy?`<p class="score-final-note"><b>Final adjustment:</b> ${esc(finalWhy)}</p>`:""}`:""}
      <details class="score-explanation" open><summary>Exact reason ledger</summary><div class="rating-reasons">${reasons||"<p class='sub'>No auditable reasons recorded.</p>"}</div></details>
      ${j.llm_note?`<p class="sub">🤖 angle: <i>${esc(j.llm_note)}</i></p>`:""}</div>

function postingCard(j) {
  const p = j.posting;
  if (!p) return `<p class="sub">Not yet scraped — the crawl reads posting text every ~30 min
    (budgeted), newest and highest-scored first. Paste the JD below to analyze it immediately
    on the next cycle.</p>`;
  const spon = p.sponsorship==="no" ? `🛂 <b>no sponsorship</b>${p.sponsorship_note?` — “${esc(p.sponsorship_note)}”`:""}`
             : p.sponsorship==="yes" ? `🛂 sponsors visas${p.sponsorship_note?` — “${esc(p.sponsorship_note)}”`:""}`
             : "🛂 sponsorship not mentioned";
  const yrs = p.years_min!=null ? `⏳ wants <b>${p.years_min}+ yrs</b>${p.intern_counts?" (internships count)":""}${p.years_note?` — “${esc(p.years_note)}”`:""}`
            : p.intern_counts ? "⏳ internships count as experience" : "⏳ no experience requirement stated";
  const edu = p.education_mismatch
    ? `🎓 <b>major mismatch</b>: requires ${esc(p.education_required||"advanced degree")}; profile is bachelor's${p.education_note?` — “${esc(p.education_note)}”`:""}`
    : p.education_required ? `🎓 requires ${esc(p.education_required)}` : "🎓 degree requirement not stated";
  const read = p.fetch_status==="unavailable" || p.fetch_status==="unreadable"
    ? `⚠️ <b>requirements unverified</b> — ${esc(p.fetch_note||"the full posting could not be read")}`
    : `${new Date((p.analyzed_at||0)*1000).toLocaleDateString()} · ${p.fetched?"scraped from the posting":"from ATS/pasted text"}`;
  return `<div class="kv">
    <span class="k">visa</span><span>${spon}</span>
    <span class="k">experience</span><span>${yrs}</span>
    <span class="k">education</span><span>${edu}</span>
    <span class="k">read</span><span>${read}</span>
  </div>`;
}
function qualityCard(j) {
  const q = j.quality;
  if (!q || !q.checked_at) return `<p class="sub">Not yet LLM-verified — the enrich cycle checks
    alert-worthy postings automatically, or paste the description below for a verdict.</p>`;
  const when = new Date(q.checked_at*1000).toLocaleDateString();
  if (q.live === false) return `<p class="sub">⚠️ posting appears closed (link checked ${when})</p>`;
  return `<div class="kv">
    <span class="k">new grad</span><span>${esc(q.new_grad||"unclear")}${q.years_required?` · wants ${q.years_required}+ yrs`:""}</span>
    <span class="k">degree</span><span>${esc(q.degree_required||"unclear")}${q.degree_required&&q.degree_required!=="bachelors"?" · major mismatch":""}</span>
    <span class="k">role family</span><span>${esc(q.role_family||"–")}</span>
    ${q.reason?`<span class="k">reason</span><span>${esc(q.reason)}</span>`:""}
    <span class="k">checked</span><span>${when} · ${q.source==="pasted"?"from your pasted JD":"from the posting page"} (LLM-verified)</span>
  </div>`;
}

function renderCosList() {
  const el = $("#cosList"); if (!el) return;
  const counts = {};
  const byId = appliedById();
  for (const j of Object.values(S.jobs)) {
    const tracked = byId[j.id] || S.web.maybe.includes(j.id) || S.web.jobs[j.id];
    if (!isOpenRelevant(j) || roleFamily(j)==="other"
        || (!tracked && postedTs(j) && Date.now()/1000-postedTs(j) > ACTIVE_QUEUE_WINDOW)
        || (!tracked && (j.score||0) < DEFAULT_FILTER.min)) continue;
    const k = norm(j.company);
    counts[k] = counts[k]||{name:j.company, open:0, best:0, bestId:j.id};
    counts[k].open++;
    if ((j.score||0) >= counts[k].best) { counts[k].best=j.score||0; counts[k].bestId=j.id; }
  }
  const q = norm(S.filter.q);
  let rows = Object.entries(counts).map(([k,v])=>({k, ...v, c:S.culture[k], d:S.research[k]}));
  if (q) rows = rows.filter(r=>r.k.includes(q));
  rows.sort((a,b)=>(b.d?.status==="ready")-(a.d?.status==="ready") || b.best-a.best);
  const n = $("#cosCount"); if (n) n.textContent = `${rows.length} companies`;
  el.innerHTML = `
    <div class="wrap"><table><tr><th>company</th><th>what they do</th><th>research</th>
      <th>culture</th><th>open roles</th></tr>
    ${rows.slice(0,200).map(r=>`<tr>

// ---------- owner Resume Studio ------------------------------------------
// The cloud page is the single control plane. The private Mac engine remains
// the first fail-safe because the CV corpus, provider auth, LaTeX toolchain,
// and generated PDFs must not enter this public repository or a public API.
// When the engine is awake, this page calls its localhost API with a narrow
// CORS allowlist; when it is asleep, the Radar still provides a useful
// title-level preview and the posting/apply links remain usable.
const TEST_MATCH_VERSION = "title-preview-v2 · cloud control plane";
const TEST_CAPABILITIES = {
  ai_ml:{strength:.95, terms:["ai","ml","machine learning","deep learning","model","inference","pytorch"]},
  llm_rag:{strength:.92, terms:["llm","rag","generative ai","agentic","retrieval","embedding"]},
  data_science:{strength:.95, terms:["data scientist","data science","analytics","statistic","quantitative"]},
  software:{strength:.90, terms:["software","developer","engineering","backend","frontend","full stack","api"]},
  backend_cloud:{strength:.85, terms:["cloud","backend","kubernetes","docker","platform"]},
  systems:{strength:.72, terms:["systems","infrastructure","distributed","performance","compiler","hpc"]},
  databases:{strength:.85, terms:["database","sql","data engineer","data platform"]},
  research:{strength:.90, terms:["research","scientist","experimental"]},
  computer_vision:{strength:.82, terms:["computer vision","vision","image","video","perception"]},
  hardware:{strength:.65, terms:["hardware","embedded","firmware","gpu","chip","silicon"]},
  security:{strength:.75, terms:["security","privacy","cyber"]},
  health:{strength:.90, terms:["health","clinical","medical","biomedical","patient","drug"]},
  quantum:{strength:.76, terms:["quantum","qubit"]},
  leadership:{strength:.90, terms:["leadership","rotational","program"]},
};
const TEST_DOMAIN_CLUSTER = {healthtech:"health", ai_lab:"ai_ml", big_tech:"systems",
  sports:"data_science", video_games:"software", edtech:"llm_rag", fintech:"data_science"};
function testClusters(j) {
  const text = norm(`${j.title||""} ${j.sector||""}`);
  const hits = Object.entries(TEST_CAPABILITIES)
    .filter(([,cap])=>cap.terms.some(term=>text.includes(norm(term))))
    .map(([name])=>name);
  return hits.length ? hits : ["software"];
}
function testingMatch(j) {
  const clusters = testClusters(j);
  const strengths = clusters.map(name=>TEST_CAPABILITIES[name]?.strength||.5);
  const evidence = strengths.reduce((a,b)=>a+b,0) / strengths.length;
  const title = norm(j.title||"");
  const specific = Object.entries(TEST_CAPABILITIES).flatMap(([name,cap])=>
    cap.terms.filter(term=>title.includes(norm(term))).map(()=>cap.strength));
  const direct = specific.length ? specific.reduce((a,b)=>a+b,0)/specific.length : 0;
  const domain = TEST_DOMAIN_CLUSTER[j.sector];
  const dimensions = {
    required_coverage:Math.round(25 + 10*direct),
    preferred_coverage:10,
    evidence_strength:Math.round(20*evidence),
    domain_relevance:domain && clusters.includes(domain) ? 10 : 6,
    eligibility:j.alert_ok ? 10 : j.early_career_possible ? 6 : 3,
    distinctiveness:clusters.some(c=>["research","health","quantum","security","computer_vision"].includes(c)) ? 5 : 3,
  };
  const score = Math.min(100,Object.values(dimensions).reduce((a,b)=>a+b,0));
  return {version:TEST_MATCH_VERSION, score, confidence:"low", dimensions, clusters,
    reasons:[`title capabilities: ${clusters.join(", ")}`,
      j.alert_ok?"verified alert-eligible role":j.early_career_possible?"early-career possible; eligibility unverified":"eligibility not established",
      "full posting and private source-level evidence are evaluated on the Mac"]};
}
function testingRows() {
  const q = norm(S.testing.q);
  let rows = Object.values(S.jobs).filter(isOpenRelevant)
    .filter(j=>S.lane === "internship" || experienceStatus(j) !== "experienced")
    .filter(j=>!postedTs(j) || Date.now()/1000-postedTs(j)<=ACTIVE_QUEUE_WINDOW)
    .filter(j=>roleFamily(j)!=="other")
    .filter(j=>!q || norm(`${j.company} ${j.title}`).includes(q))
    .map(j=>({job:j, match:testingMatch(j)}));
  if (S.testing.sort === "new") rows.sort((a,b)=>postedTs(b.job)-postedTs(a.job));
  else if (S.testing.sort === "radar") rows.sort((a,b)=>(b.job.score||0)-(a.job.score||0) || b.match.score-a.match.score);
  else rows.sort((a,b)=>b.match.score-a.match.score || (b.job.score||0)-(a.job.score||0) || postedTs(b.job)-postedTs(a.job));
  return rows;
}

function studioPath(path) { return RESUME_STUDIO_LOCAL_ORIGIN + path; }
async function studioRequest(path, options={}) {
  const method = String(options.method||"GET").toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const requestBody = {...body};
  if (requestBody.job_id && !requestBody.job_snapshot) {
    const selected = jobById(requestBody.job_id);
    if (selected) requestBody.job_snapshot = resumeStudioSnapshot(selected);
  }
  if (location.protocol === "https:" || !["localhost","127.0.0.1"].includes(location.hostname)) {
    if (path === "/api/health") return bridgeRequest("health");
    if (path.startsWith("/api/library")) return bridgeRequest("library", {limit:Number(new URLSearchParams(path.split("?")[1]||"").get("limit")||100)});
    if (path === "/api/match") return bridgeRequest("match", requestBody);
    if (path === "/api/context" && method === "GET") return bridgeRequest("context");
    if (path === "/api/context/job" && method === "POST") return bridgeRequest("context_job", requestBody);
    if (path === "/api/context/answer" && method === "POST") return bridgeRequest("context_answer", requestBody);
    if (path === "/api/context/hint" && method === "POST") return bridgeRequest("context_hint", requestBody);
    if (path === "/api/context/hint/dismiss" && method === "POST") return bridgeRequest("context_hint_dismiss", requestBody);
    if (path === "/api/run/approve" && method === "POST") return bridgeRequest("approve", requestBody);
    if (path === "/api/run" && method === "POST") return bridgeRequest("queue", requestBody);
    if (path === "/api/run" && method === "GET") return bridgeRequest("status", {id:new URLSearchParams(path.split("?")[1]||"").get("id")||""});
  }
  const init = {...options, mode:"cors", cache:"no-store", headers:{"content-type":"application/json", ...(options.headers||{})}};
  if (options.body) init.body = JSON.stringify(requestBody);

async function queueResumeBatch() {

  const notionScope = batch.scope === "notion_to_tailor";
  const engineOnline = S.testing.engine === "online";
  const cloudReady = cloudQueueOnline();
  const limit = resumeBatchLimit(batch.scope);
  const byId = new Map(resumeBatchCandidatesFor(batch.scope).map(job => [job.id, job]));
  const jobs = [...new Set(batch.selected || [])].map(id => byId.get(id)).filter(Boolean).slice(0, limit);
  if (!jobs.length) { toast(`Select at least one role to ${notionScope?"apply to":"tailor"}`); return; }

    batch.state="queueing"; batch.error="";
    batch.runs=jobs.map(job=>({job_id:job.id,company:job.company,title:job.title,status:"queueing",message:"handing the choice to Autopilot"})); rTesting();
    try {
      const result=await queueAutopilotJobs(jobs),byJob=new Map((result.items||[]).map(row=>[row.job_id,row]));
      for(const row of batch.runs){const queued=byJob.get(row.job_id);Object.assign(row,{queue_id:queued?.item?.queue_id||"",status:queued?.item?.state||"queued",message:queued?.duplicate?"already active · reused existing workflow":"Autopilot owns resume preparation and form progress"});}
      batch.state="complete"; await loadApplicationAgent(false);
      toast(`${result.queued||0} new Autopilot workflow${result.queued===1?"":"s"}${result.duplicates?` · ${result.duplicates} reused`:""}`);

      batch.state="partial"; batch.error=error.message;

    }
    rTesting(); return;
  }
  if (!engineOnline && !cloudReady) { toast("Connect Google or start the private Resume Studio engine before queueing a batch"); return; }
  batch.state = "queueing"; batch.error = "";
  batch.runs = jobs.map(job => ({job_id:job.id,company:job.company,title:job.title,status:"queueing",message:"sending to the private engine"}));
  rTesting();
  let nextJob = 0;
  const worker = async () => {
    while (nextJob < jobs.length) {
      const job = jobs[nextJob++], row = batch.runs.find(run => run.job_id === job.id);

        } else {
          const status = await studioRequest("/api/run", {method:"POST",body:JSON.stringify({job_id:job.id,mode:batch.mode,control_profile:queueControlReference(job)})});
          Object.assign(row, {run_id:status.run_id,status:status.status||"queued",message:status.message||"waiting for a private worker"});
        }
        try {
          await markResumeBatchTailored(job);
          row.stage = "to_tailor";
        } catch (stageError) {
          row.stage_error = stageError.message;
          row.message = `${row.message}; pipeline stage sync failed`;
        }
        if (row.run_id) pollResumeBatchRun(row.run_id);
      } catch (error) {
        Object.assign(row, {status:"failed",message:error.message});
      }
      rTesting();
    }
  };

function pollResumeBatchRun(id) {
  const tick = async () => {
    const batch = resumeBatchState(), row = (batch.runs || []).find(run => run.run_id === id);
    if (!row) return;
    try {
      const status = await studioRequest(`/api/run?id=${encodeURIComponent(id)}`);
      Object.assign(row, {status:status.status||row.status,message:status.message||status.status||row.message,report:status.report});
      finishResumeBatchIfDone();
      if (S.testing.batchView) rTesting();
      if (["complete","awaiting_review","failed"].includes(status.status)) { await refreshResumeLibrary(false); return; }
      setTimeout(tick, 1800);
    } catch (error) {
      Object.assign(row, {status:"failed",message:error.message});
      finishResumeBatchIfDone();
      if (S.testing.batchView) rTesting();
    }
  };
  tick();
}

function keywordAuditFromReport(report) {

  if (!coverage || typeof coverage !== "object" || !Array.isArray(coverage.terms) || !coverage.terms.length) return null;
  const terms = coverage.terms.map(item=>({
    term:item?.term, importance:item?.importance, required:Boolean(item?.required), preferred:Boolean(item?.preferred),
    supported:Boolean(item?.supported), rendered:Boolean(item?.rendered), status:item?.status,
    support_kind:item?.support_kind, source_ids:Array.isArray(item?.source_ids)?item.source_ids:[],
  })).filter(item=>item.term);
  const overlay = value.review_overlay && typeof value.review_overlay === "object" ? value.review_overlay : {};
  return {
    posting_available:Boolean(coverage.posting_available),
    detected_count:Number(coverage.detected_count||terms.length),
    supported_count:Number(coverage.supported_count||terms.filter(item=>item.supported).length),
    covered_count:Number(coverage.covered_count||terms.filter(item=>item.supported&&item.rendered).length),
    supported_coverage_percent:Number.isFinite(Number(coverage.supported_coverage_percent??coverage.supported_exact_coverage_percent))?Number(coverage.supported_coverage_percent??coverage.supported_exact_coverage_percent):null,
    overall_coverage_percent:Number.isFinite(Number(coverage.overall_coverage_percent??coverage.exact_coverage_percent))?Number(coverage.overall_coverage_percent??coverage.exact_coverage_percent):null,
    terms,
    overlay:{available:overlay.available===true, boxes:Array.isArray(overlay.boxes)?overlay.boxes:[]},
  };

let cloudQueueDrainInFlight = false;
function updateResumeBatchQueueRow(queueId, patch={}) {
  const batch = resumeBatchState();
  const row = (batch.runs||[]).find(item=>item.queue_id===queueId);
  if (!row) return;
  Object.assign(row, patch);
  finishResumeBatchIfDone();
  if (S.tab === "testing" && S.testing.batchView) rTesting();
}
function cloudQueueRunStatus(item, status, message="") {
  const job = item?.job || {};
  return {status:status.status||"running", message:message||status.message||status.status||"processing on the private Mac worker", job, queue_id:item.queue_id, run_id:status.run_id||item.run_id||""};
}
async function pollCloudResumeRun(item, runId) {
  const tick = async () => {
    try {
      const status = await studioRequest(`/api/run?id=${encodeURIComponent(runId)}`);
      if (S.testing.selectedId === item.job?.id) {
        S.testing.activeRunId = runId;
        S.testing.runStatus = cloudQueueRunStatus(item, status);
        renderStudioWorkspace();
      }
      if (["complete","awaiting_review","failed"].includes(status.status)) {
        updateResumeBatchQueueRow(item.queue_id, {status:status.status,run_id:runId,message:status.message||status.status});
        await updateCloudResumeItem(item.queue_id, status.status, {
          run_id:runId, message:status.message||status.status,
          error:status.status === "failed" ? (status.error||status.message||"private run failed") : "",
        });
        await refreshResumeLibrary(false);
        await loadCloudResumeQueue(false);
        await drainCloudResumeQueue();
        if (S.tab === "testing") { renderStudioWorkspace(); if (S.testing.batchView) rTesting(); }
        return;
      }
      setTimeout(tick, 1800);
    } catch (error) {
      try {
        await updateCloudResumeItem(item.queue_id, "queued", {
          run_id:"", message:"The Mac worker disconnected; this item is queued for a safe retry.", error:error.message,
        });
        await loadCloudResumeQueue(false);
      } catch (_) {}
      if (S.tab === "testing") { renderStudioWorkspace(); if (S.testing.batchView) rTesting(); }
    }
  };
  tick();
}
async function drainCloudResumeQueue() {
  if (cloudQueueDrainInFlight || S.testing.engine !== "online" || !cloudQueueOnline()) return;
  cloudQueueDrainInFlight = true;
  let refillAfterDispatch = false;
  try {
    const pending = (S.testing.cloudQueue.items||[]).filter(item=>item.state === "queued").slice(0,2);
    await Promise.all(pending.map(async item => {
      try {
        await updateCloudResumeItem(item.queue_id, "dispatching", {message:"Dispatching to the private Mac worker…"});
        const status = await studioRequest("/api/run", {method:"POST",body:JSON.stringify({
          job_id:item.job.id, mode:item.mode, queue_id:item.queue_id, control_profile:item.control_profile||null, job_snapshot:cloudQueueJob(item.job),
        })});
        const running = {...item, state:"running", run_id:status.run_id, message:status.message||"running on the private Mac worker"};
        updateResumeBatchQueueRow(item.queue_id, {status:"running",run_id:status.run_id,message:running.message});
        await updateCloudResumeItem(item.queue_id, "running", {run_id:status.run_id, message:running.message});
        if (S.testing.selectedId === item.job?.id) {
          S.testing.activeRunId = status.run_id;
          S.testing.runStatus = cloudQueueRunStatus(item, status);
          renderStudioWorkspace();
        }
        if (["complete","awaiting_review","failed"].includes(status.status)) {
          refillAfterDispatch = true;
          updateResumeBatchQueueRow(item.queue_id, {status:status.status,run_id:status.run_id,message:status.message||status.status});
          await updateCloudResumeItem(item.queue_id, status.status, {
            run_id:status.run_id, message:status.message||status.status,
            error:status.status === "failed" ? (status.error||status.message||"private run failed") : "",
          });
          await refreshResumeLibrary(false);
        } else pollCloudResumeRun(running, status.run_id);
      } catch (error) {
        updateResumeBatchQueueRow(item.queue_id, {status:"queued",message:"waiting for the Mac worker to reconnect"});
        try { await updateCloudResumeItem(item.queue_id, "queued", {message:"The Mac worker was unavailable; waiting for the next connection.", error:error.message}); }
        catch (_) {}
      }
    }));
  } finally {
    cloudQueueDrainInFlight = false;
    if (S.tab === "testing") { renderStudioWorkspace(); if (S.testing.batchView) rTesting(); }
    if (refillAfterDispatch && S.testing.engine === "online" && cloudQueueOnline() && (S.testing.cloudQueue.items||[]).some(item=>item.state === "queued")) setTimeout(()=>drainCloudResumeQueue(),0);
  }
}
async function loadResumeEngine() {
  try {
    const health = await studioRequest("/api/health");
    S.testing.engine = health.ok ? "online" : "offline";
    S.testing.engineError = health.ok ? "" : "Private engine did not confirm health.";
    await refreshResumeLibrary(false);
    const selected = jobById(S.testing.selectedId);
    if (selected) {
      try { S.testing.match = await studioRequest("/api/match", {method:"POST",body:JSON.stringify({job_id:selected.id})}); }
      catch (error) { S.testing.match = null; S.testing.engineError = `Engine is online, but this posting is not in its local snapshot: ${error.message}`; }
    }
    await loadCloudResumeQueue(false);
    await drainCloudResumeQueue();
  } catch (error) {
    S.testing.engine = "offline";
    S.testing.engineError = "Start the private Resume Studio service on the Mac to enable evidence-grounded matching and PDF generation.";
    await loadCloudResumeQueue(false);
  }
  renderStudioWorkspace();
  const notice = $("#studioEngineNotice");
  if (notice) notice.innerHTML = S.testing.engine === "online"
    ? `<strong>Private engine connected.</strong> Full source-level matching, generation, workshop edits, and PDFs are available through this page.`
    : `<strong>Cloud mode is still usable.</strong> ${esc(S.testing.engineError)} ${cloudQueueOnline()?"Drafts can be saved privately and will dispatch when the Mac worker reconnects.":"Connect Google to enable the private queue."} <button class="act" onclick="retryResumeEngine()">retry connection</button>`;
}
function retryResumeEngine() { S.testing.engine="checking"; S.testing.engineError=""; rTesting(); }
async function refreshResumeLibrary(render=true) {
  if (S.testing.engine !== "online" && render) return;

    const data = await studioRequest("/api/library?limit=500");

    S.testing.engineError = error.message;

async function queueResumeMode(mode) {
  const selected = jobById(S.testing.selectedId);
  if (!selected) return;
  try {
    if (S.testing.engine === "online") {
      const status = await studioRequest("/api/run", {method:"POST",body:JSON.stringify({job_id:selected.id,mode,control_profile:queueControlReference(selected)})});
      S.testing.activeRunId = status.run_id; S.testing.runStatus = status; renderStudioWorkspace(); pollResumeRun(status.run_id);
    } else if (cloudQueueOnline()) {
      const queued = await queueCloudResumeItem(selected, mode);
      try { await markResumeBatchTailored(selected); }
      catch (stageError) { toast(`Saved draft, but pipeline stage sync failed: ${stageError.message}`); }
      S.testing.activeRunId = "";
      S.testing.runStatus = {status:queued.state||"queued",message:queued.message||"saved in the private cloud queue",job:selected,queue_id:queued.queue_id};
      renderStudioWorkspace();
      toast("Saved privately; the Mac worker will pick it up when it reconnects");
    } else return;
  } catch (error) { S.testing.runStatus = {status:"failed",message:error.message,job:selected}; renderStudioWorkspace(); }
}
function pollResumeRun(id) {
  const tick = async () => {
    try {
      const status = await studioRequest(`/api/run?id=${encodeURIComponent(id)}`);
      if (S.testing.activeRunId === id) { S.testing.runStatus = status; renderStudioWorkspace(); }
      if (["complete","awaiting_review","failed"].includes(status.status)) { await refreshResumeLibrary(); return; }
      setTimeout(tick, 1800);
    } catch (error) {
      if (S.testing.activeRunId === id) { S.testing.runStatus = {status:"failed",message:error.message}; renderStudioWorkspace(); }
    }
  };
  tick();
}
async function loadResumeRun(id) {
  try { S.testing.activeRunId=id; S.testing.runStatus=await studioRequest(`/api/run?id=${encodeURIComponent(id)}`); const job=S.testing.runStatus.job; if(job?.id)S.testing.selectedId=job.id; renderStudioWorkspace(); }
