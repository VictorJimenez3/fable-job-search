<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🎯%3C/text%3E%3C/svg%3E">
<title>Job Radar — Platform</title>
<style>
  :root {
    --paper:#FAFBF9; --ink:#1C2430; --muted:#5A6B7A; --accent:#2E7D5B;
    --accent-ink:#24634A; --amber:#9A6A1F; --line:#DDE4E0; --card:#F1F5F2;
    --code:#E9EFEA; --danger:#A33A2E;
  }
  :root[data-theme="dark"] {
    --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
    --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
    --code:#1F2A33; --danger:#E07862;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#131A21; --ink:#D9E2E8; --muted:#8FA1AE; --accent:#4CAF8A;
      --accent-ink:#5FBF9A; --amber:#D2A24C; --line:#2A343D; --card:#1A232C;
      --code:#1F2A33; --danger:#E07862;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;
         font-size:16px; line-height:1.5; }
  .mono, button, input, select, textarea, .chip, th, .tag {
    font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:0.9rem; padding:0.7rem 1rem;
           border-bottom:2px solid var(--ink); flex-wrap:wrap; position:sticky; top:0;
           background:var(--paper); z-index:30; }
  header h1 { font-size:1.05rem; margin:0; white-space:nowrap; }
  #laneSwitch { display:flex; gap:0.2rem; padding:0.16rem; border:1px solid var(--line); border-radius:7px; background:var(--card); }
  #laneSwitch button { border:0; background:transparent; color:var(--muted); border-radius:5px; padding:0.25rem 0.55rem; cursor:pointer; font-size:0.72rem; }
  #laneSwitch button.on { background:var(--accent); color:#fff; }
  nav { display:flex; gap:0.25rem; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--muted);
               padding:0.3rem 0.65rem; border-radius:5px; cursor:pointer; font-size:0.8rem; }
  nav button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  nav button:hover { color:var(--ink); }
  #stats { margin-left:auto; font-size:0.72rem; color:var(--muted); display:flex; gap:0.9rem; }
  #stats b { color:var(--ink); font-size:0.95rem; display:block; text-align:right; }
  main { max-width:72rem; margin:0 auto; padding:1rem; }
  .bar { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.9rem; align-items:center; }
  input, select, textarea { background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:5px; padding:0.4rem 0.55rem; font-size:0.8rem; }
  input[type=search] { flex:1; min-width:12rem; }
  button.act { background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:5px; padding:0.3rem 0.6rem; cursor:pointer; font-size:0.75rem; }
  button.act:hover { border-color:var(--accent); color:var(--accent-ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; opacity:0.9; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .job { display:flex; gap:0.7rem; padding:0.55rem 0.4rem; border-bottom:1px solid var(--line);
         align-items:baseline; flex-wrap:wrap; }
  .job:hover { background:var(--card); }
  .job.selected { background:rgba(46,125,91,.08); border-left:3px solid var(--accent); padding-left:.25rem; }
  .job.excluded { background:rgba(163,58,46,.08); border-left:3px solid var(--danger); padding-left:.25rem; }
  .job.excluded .score { color:var(--danger); border-color:var(--danger); background:none; }
  .job.excluded .co, .job.excluded .jobtitle { color:var(--danger); }
  .job[tabindex] { cursor:pointer; }
  .score { min-width:2.2rem; text-align:center; font-weight:700; font-size:0.85rem;
           border-radius:5px; padding:0.1rem 0.2rem; background:var(--code); }
  .score.hot { color:var(--accent-ink); border:1px solid var(--accent-ink); background:none; }
  .job .body { flex:1; min-width:14rem; }
  .job .co { font-weight:700; }
  .job a { color:var(--accent-ink); text-decoration-thickness:1px; }
  .jobtitle { border:0; background:none; color:var(--accent-ink); padding:0; cursor:pointer;
              font:inherit; text-decoration:underline; text-decoration-thickness:1px;
              text-underline-offset:2px; text-align:left; }
  .jobtitle:hover { color:var(--ink); }
  .facts { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.25rem; }
  .sub { font-size:0.78rem; color:var(--muted); }
  .chip { font-size:0.65rem; border:1px solid var(--line); color:var(--muted);
          border-radius:999px; padding:0.05rem 0.45rem; white-space:nowrap; }
  .chip.marquee { color:var(--amber); border-color:var(--amber); }
  .chip.saved { color:var(--amber); border-color:var(--amber); }
  .chip.applied { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.excluded { color:var(--danger); border-color:var(--danger); }
  .chip.maybe { color:var(--muted); }
  .chip.good { color:var(--accent-ink); border-color:var(--accent-ink); }
  .chip.bad { color:var(--danger); border-color:var(--danger); }
  .chip.unknown { color:var(--muted); border-style:dashed; }
  .togglebar { display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center; }
  .togglebar .label { font-size:0.7rem; color:var(--muted); margin-right:0.2rem; }
  button.toggle { background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:0.15rem 0.5rem; cursor:pointer; font-size:0.68rem; }
  button.toggle.on { color:var(--accent-ink); border-color:var(--accent-ink); background:var(--paper); }
  button.toggle.excluded { color:var(--danger); border-color:var(--danger); background:rgba(163,58,46,.08); }
  .acts { display:flex; gap:0.3rem; }
  .filters { padding:0.65rem; margin-bottom:0.75rem; background:var(--card);
             border:1px solid var(--line); border-radius:8px; }
  .filters .bar { margin-bottom:0.45rem; }
  .filters .bar:last-child { margin-bottom:0; }
  .lanes { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.9rem; }
  .manual-add { background:var(--card); border:1px solid var(--line); border-radius:8px;
                padding:0.8rem; margin-bottom:0.9rem; }
  .manual-add h2 { margin:0; font-size:0.95rem; }
  .manual-add .bar { margin:0.55rem 0 0; }
  .manual-add input { flex:1 1 12rem; min-width:0; }
  .lane { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem; }
  .lane h3 { margin:0 0 0.6rem; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
             font-family:ui-monospace,Menlo,monospace; color:var(--muted); }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:6px;
          padding:0.5rem 0.6rem; margin-bottom:0.5rem; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card .co { font-weight:700; font-size:0.9rem; }
  .card .t { font-size:0.8rem; }
  /* workspace drawer */
  #ws { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:50; display:none; }
  #ws.open { display:block; }
  #wsp { position:absolute; right:0; top:0; bottom:0; width:min(560px,100%);
         background:var(--paper); border-left:2px solid var(--ink); overflow-y:auto; padding:1.1rem; }
  /* tutorial/account workspace */
  #tutorial { position:fixed; inset:0; background:rgba(0,0,0,.52); z-index:70;
              display:none; padding:clamp(.7rem,4vw,2.5rem); place-items:center; }
  #tutorial.open { display:grid; }
  #tutorialp { width:min(920px,100%); max-height:min(760px,100%); overflow:hidden;
               display:grid; grid-template-columns:180px minmax(0,1fr); background:var(--paper);
               border:1px solid var(--ink); border-radius:12px; box-shadow:0 20px 70px rgba(0,0,0,.35); }
  .tut-nav { background:var(--card); border-right:1px solid var(--line); padding:.8rem; overflow-y:auto; }
  .tut-nav h3 { margin:.2rem .4rem .7rem; font-size:.72rem; letter-spacing:.11em;
                text-transform:uppercase; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }
  .tut-nav button { width:100%; text-align:left; background:none; border:1px solid transparent;
                    border-radius:7px; color:var(--muted); padding:.55rem .6rem; cursor:pointer;
                    font-size:.76rem; margin-bottom:.18rem; }
  .tut-nav button.on { color:var(--accent-ink); border-color:var(--accent-ink); background:var(--paper); }
  .tut-main { min-width:0; overflow-y:auto; padding:1.2rem 1.35rem 1.5rem; }
  .tut-head { display:flex; justify-content:space-between; gap:1rem; align-items:start; }
  .tut-head h2 { margin:0; font-size:1.25rem; }
  .tut-close { border:0; background:none; color:var(--muted); cursor:pointer; font-size:1.2rem; }
  .tut-kicker { color:var(--accent-ink); font:600 .68rem ui-monospace,Menlo,monospace;
                letter-spacing:.1em; text-transform:uppercase; margin:.25rem 0 .35rem; }
  .tut-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.65rem; margin-top:.85rem; }
  .tut-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.75rem; }
  .tut-card h4 { margin:0 0 .25rem; font-size:.85rem; }
  .tut-card p { margin:.25rem 0; font-size:.78rem; color:var(--muted); }
  .tut-steps { counter-reset:step; display:grid; gap:.55rem; margin:.75rem 0; }
  .tut-step { display:grid; grid-template-columns:1.6rem 1fr; gap:.55rem; align-items:start; font-size:.82rem; }
  .tut-step::before { counter-increment:step; content:counter(step); display:grid; place-items:center;
                      width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent); color:#fff;
                      font:700 .68rem ui-monospace,Menlo,monospace; }
  .provider-row { display:flex; flex-wrap:wrap; gap:.45rem; margin:.7rem 0; }
  .provider { display:inline-flex; align-items:center; gap:.35rem; text-decoration:none; }
  .provider .mark { width:1.35rem; height:1.35rem; display:grid; place-items:center; border-radius:50%;
                    background:var(--ink); color:var(--paper); font:700 .7rem ui-monospace,Menlo,monospace; }
  .provider.google .mark { background:#4285f4; }
  .identity-list { display:grid; gap:.35rem; margin:.7rem 0; }
  .identity-row { display:flex; justify-content:space-between; gap:.7rem; align-items:center;
                 border-bottom:1px solid var(--line); padding:.45rem 0; font-size:.8rem; }
  .identity-row .state { color:var(--accent-ink); font:600 .68rem ui-monospace,Menlo,monospace; }
  .tut-note { background:var(--code); border-left:3px solid var(--accent); padding:.6rem .75rem;
              border-radius:0 6px 6px 0; color:var(--muted); font-size:.78rem; margin:.7rem 0; }
  .tracker-banner { display:flex; justify-content:space-between; align-items:center; gap:.8rem;
                    flex-wrap:wrap; background:var(--code); border:1px solid var(--line);
                    border-left:3px solid var(--amber); border-radius:0 8px 8px 0;
                    padding:.65rem .8rem; margin-bottom:.9rem; }
  .tracker-banner.connected { border-left-color:var(--accent); }
  .tracker-copy { display:grid; gap:.08rem; min-width:0; }
  .tracker-copy b { font-size:.82rem; }
  .tracker-copy .sub { font-size:.74rem; }
  .tracker-quick { display:inline-flex; align-items:center; gap:.28rem; white-space:nowrap; }
  .tracker-banner .acts { flex-wrap:wrap; }
  .tracker-options { width:100%; border-top:1px solid var(--line); margin-top:.35rem; padding-top:.45rem; }
  .tracker-options summary { cursor:pointer; color:var(--accent-ink); font:600 .7rem ui-monospace,Menlo,monospace;
                             letter-spacing:.03em; }
  .tracker-choice { display:flex; flex-wrap:wrap; gap:.55rem; margin:.45rem 0; }
  .tracker-choice label { display:inline-flex; align-items:center; gap:.3rem; font-size:.76rem; cursor:pointer; }
  .tracker-choice input { accent-color:var(--accent); }
  .tracker-choice small { color:var(--muted); font-size:.68rem; }
  .stage-control { display:inline-flex; align-items:center; gap:.3rem; color:var(--muted);
                   font:600 .64rem ui-monospace,Menlo,monospace; text-transform:uppercase; }
  .stage-control select { min-width:7.2rem; padding:.2rem .35rem; font-size:.68rem; text-transform:none; }
  @media (max-width:640px) {
    #tutorialp { grid-template-columns:1fr; max-height:100%; }
    .tut-nav { border-right:0; border-bottom:1px solid var(--line); display:flex; gap:.25rem;
               overflow-x:auto; padding:.5rem; }
    .tut-nav h3 { display:none; }
    .tut-nav button { width:auto; white-space:nowrap; margin:0; }
    .tut-main { padding:1rem; }
  }
  #wsp h2 { margin:0 0 0.2rem; font-size:1.15rem; }
  .sect { margin-top:1.1rem; }
  .wstabs { display:flex; gap:0.25rem; margin-top:0.9rem; border-bottom:1px solid var(--line);
            padding-bottom:0.45rem; }
  .wstabs button { background:none; border:1px solid transparent; color:var(--muted);
                   padding:0.25rem 0.6rem; border-radius:5px; cursor:pointer; font-size:0.75rem; }
  .wstabs button.on { color:var(--accent-ink); border-color:var(--accent-ink); }
  .wstabs button:hover { color:var(--ink); }
  .sect h4 { margin:0 0 0.4rem; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
             color:var(--accent-ink); font-family:ui-monospace,Menlo,monospace; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:0.15rem 0.8rem; font-size:0.82rem; }
  .kv .k { color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:0.7rem; }
  .score-explanation { margin-top:0.65rem; border-top:1px solid var(--line); padding-top:0.55rem; }
  .score-explanation summary { cursor:pointer; color:var(--accent); font-weight:600; }
  .score-summary { margin:0.5rem 0 0; color:var(--ink); font-size:.82rem; line-height:1.4; }
  .score-dimensions { display:grid; gap:.42rem; margin-top:.55rem; }
  .score-dimension { padding:.42rem .5rem; border-left:2px solid var(--line); background:rgba(255,255,255,.02); }
  .score-dimension-head { display:flex; align-items:baseline; justify-content:space-between; gap:.7rem; font-weight:600; }
  .score-dimension-points { color:var(--accent-ink); font:600 .72rem ui-monospace,Menlo,monospace; white-space:nowrap; }
  .score-dimension-what, .score-dimension-why { display:block; font-size:.74rem; line-height:1.35; }
  .score-dimension-what { color:var(--muted); margin-top:.1rem; }
  .score-dimension-why { margin-top:.12rem; }
  .score-dimension.disabled { opacity:.58; border-left-style:dashed; }
  .score-dimension-why b, .score-final-note b { color:var(--accent-ink); }
  .score-controls { border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; }
  .score-controls summary { cursor:pointer; color:var(--accent-ink); font-weight:600; }
  .score-control-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:.35rem .8rem; margin:.55rem 0; }
  .score-control-row { display:flex; gap:.45rem; align-items:flex-start; padding:.35rem; border:1px solid var(--line); border-radius:6px; }
  .score-control-row input { margin-top:.12rem; accent-color:var(--accent-ink); }
  .score-control-row span { display:grid; gap:.12rem; font-size:.78rem; }
  .score-control-row small { color:var(--muted); line-height:1.3; }
  .score-final-note { margin:.5rem 0 0; font-size:.76rem; line-height:1.35; }
  .rating-reasons { display:grid; gap:0.35rem; margin-top:0.55rem; }
  .rating-reason { display:grid; grid-template-columns:8rem 1fr; gap:0.55rem; padding:0.35rem 0.45rem; border-left:2px solid var(--line); background:rgba(255,255,255,.02); }
  .rating-reason .k { color:var(--muted); font-size:.72rem; text-transform:capitalize; }
  .decision { background:var(--card); border:1px solid var(--line); border-radius:8px;
              padding:0.75rem; margin-top:0.9rem; }
  .decision .facts { display:flex; gap:0.35rem; flex-wrap:wrap; margin-top:0.45rem; }
  .drawer-actions { position:sticky; bottom:-1.1rem; background:var(--paper);
                    border-top:1px solid var(--line); padding:0.75rem 0 1.1rem; z-index:2; }
  textarea { width:100%; min-height:5.5rem; font-size:0.82rem; }
  .tpl { background:var(--code); border-radius:6px; padding:0.6rem; font-size:0.78rem;
         white-space:pre-wrap; margin-bottom:0.4rem; }
  ul.plain { list-style:none; padding:0; margin:0.3rem 0; }
  ul.plain li { display:flex; gap:0.4rem; align-items:center; padding:0.15rem 0; font-size:0.82rem; }
  table { border-collapse:collapse; width:100%; font-size:0.82rem; }
  th { text-align:left; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase;
       color:var(--muted); border-bottom:1.5px solid var(--ink); padding:0.3rem 0.6rem 0.3rem 0; }
  td { border-bottom:1px solid var(--line); padding:0.4rem 0.6rem 0.4rem 0; }
  .wrap { overflow-x:auto; }
  .table-scroll { overflow-x:auto; margin-top:0.6rem; }
  .note { background:var(--card); border-left:3px solid var(--amber); padding:0.6rem 0.8rem;
          border-radius:0 5px 5px 0; font-size:0.85rem; margin-bottom:0.9rem; }
  #bootNotice { max-width:72rem; margin:0 auto; padding:0 1rem; }
  .boot-notice { background:rgba(163,58,46,.08); border:1px solid var(--danger);
                 border-left:4px solid var(--danger); border-radius:0 6px 6px 0;
                 padding:.65rem .8rem; margin:1rem 0 0; font-size:.82rem; }
  .boot-notice strong { color:var(--danger); }
  .boot-notice details { margin-top:.35rem; }
  .boot-notice summary { cursor:pointer; color:var(--danger); font-family:ui-monospace,"SF Mono",Menlo,monospace;
                          font-size:.72rem; }
  .boot-notice ul { margin:.35rem 0 0 1.1rem; padding:0; }
  .testing-hero { border:1px solid var(--accent-ink); border-radius:10px; padding:0.9rem;
                  margin-bottom:0.9rem; background:var(--card); }
  .testing-hero h2 { margin:0 0 0.25rem; font-size:1.1rem; }
  .testing-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,0.8fr);
                  gap:0.9rem; align-items:start; }
  .testing-stack { display:grid; gap:0.7rem; }
  .testing-role { display:grid; grid-template-columns:3rem minmax(0,1fr); gap:0.65rem;
                  border-bottom:1px solid var(--line); padding:0.65rem 0.15rem; }
  .testing-role:last-child { border-bottom:0; }
  .testing-role .match-score { width:3rem; height:3rem; border:1px solid var(--accent-ink);
                  color:var(--accent-ink); border-radius:50%; display:grid; place-items:center;
                  font:700 0.86rem ui-monospace,"SF Mono",Menlo,monospace; }
  .testing-role h3 { margin:0; font-size:0.9rem; }
  .testing-role details { margin-top:0.35rem; }
  .testing-role summary { cursor:pointer; color:var(--accent-ink); font-size:0.75rem;
                          font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .testing-role .kv { margin-top:0.35rem; }
  .taste-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:.9rem; }
  .taste-grid h4 { margin:.65rem 0 .25rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
                  color:var(--accent-ink); font-family:ui-monospace,Menlo,monospace; }
  .taste-list { display:grid; gap:.45rem; }
  .taste-role { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.25rem .5rem;
                align-items:center; padding:.5rem 0; border-bottom:1px solid var(--line); font-size:.8rem; }
  .taste-role:last-child { border-bottom:0; }
  .taste-role p { grid-column:1/-1; margin:0; }
  .taste-role button { justify-self:start; }
  .gate-row { display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.45rem; }
  .toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--paper); padding:0.5rem 1rem; border-radius:6px;
           font-size:0.8rem; z-index:99; }
  a { color:var(--accent-ink); }
  .rlinks a { display:inline-block; margin:0 0.6rem 0.3rem 0; font-size:0.8rem; }
  .dork-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:0.45rem; margin-top:0.55rem; }
  .dork-link { display:block; border:1px solid var(--line); border-radius:7px; padding:0.55rem 0.65rem;
               background:var(--code); text-decoration:none; }
  .dork-link b { display:block; color:var(--text); margin-bottom:0.18rem; }
  .dork-link span { color:var(--muted); font-size:0.72rem; line-height:1.35; }
  @media (prefers-reduced-motion: no-preference) { .card, button.act { transition: border-color .12s; } }
  @media (max-width:700px) {
    header { position:static; }
    #stats { width:100%; margin-left:0; justify-content:space-between; }
    #stats b { text-align:left; }
    .job { align-items:flex-start; padding:0.75rem 0.25rem; }

<script>
"use strict";

const ME = { name: "Victor", school: "NJIT", grad: "CS '26" };

let BRANCH = "claude/newgrad-job-search-system-9gbj9k";

const API = "https://api.github.com";

const LANE_CONFIG = {
  new_grad:{label:"New-grad", jobs:"state/jobs.json", applied:"state/applied.json", feedback:"state/feedback.json",
    companies:"state/companies.json", runs:"state/runs.json", web:"state/web_state.json"},
  internship:{label:"Internships", jobs:"state/intern_jobs.json", applied:"state/intern_applied.json", feedback:"state/intern_feedback.json",

const DEFAULT_FILTER = {q:"", min:45, sector:"", role:"", sectors:[], roles:[], sponsorship:"", sponsorHistory:"",

function storedFilter(lane="new_grad") {

}
const S = {           // app state
  jobs:{}, applied:[], feedback:{}, reports:{}, culture:{}, research:{}, aiUsage:{}, companies:{}, scorePreferences:{},
  registryByCompany:{}, runs:[], scout:{}, web:null,
  lane:"new_grad", lanes:{

  auth:null, backend:false, authHost:"", userTracker:false, trackerConfigured:false, trackerMeta:null,

  wsTab:"fit",

  boot:{phase:"starting", jobsReady:false, inFlight:false, errors:[]},
  marquee:new Set(["meta","apple","amazon","netflix","google","microsoft","nvidia",
    "anthropic","openai","deepmind","genentech","moderna","regeneron",
    "vertex pharmaceuticals","eli lilly","merck","medtronic","intuitive surgical","stryker",
    "whoop","oura","dexcom","abbott","nike","espn","fanatics",
    "playstation","sony interactive entertainment","nintendo","electronic arts",
    "epic games","duolingo","coursera","khan academy","ixl learning"]),  // mirror of profile.yaml marquee_companies
};
function laneName() { return S.lane; }
function laneLabel() { return LANE_CONFIG[S.lane]?.label || "New-grad"; }
function laneState(mode=S.lane) { return S.lanes[mode] || S.lanes.new_grad; }
function setLaneValue(mode, key, value) {
  laneState(mode)[key] = value;
  if (mode === S.lane) S[key] = value;
}
function normalizeLaneWeb(mode, web) {
  const fallback = (() => { try { return JSON.parse(localStorage.getItem(`jr_web_${mode}`) || '{"maybe":[],"jobs":{},"excluded":[]}'); } catch { return {maybe:[],jobs:{},excluded:[]}; } })();
  const target = laneState(mode);

function activateLane(mode, rerender=true) {

  normalizeLaneWeb(mode, d.web);

  S.shown = 250;
  try { localStorage.setItem("jr_active_lane", mode); } catch {}

}
try { S.lane = LANE_CONFIG[localStorage.getItem("jr_active_lane")] ? localStorage.getItem("jr_active_lane") : "new_grad"; } catch {}
activateLane(S.lane, false);
const norm = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const token = () => localStorage.getItem("jr_pat") || "";
function trackerBackend() {
  // Victor's repository workflow is Notion-first. Google Sheets is an
  // explicit, optional personal mirror; it must never become the default just
  // because a Google grant happens to be present in the session.
  if (S.auth?.owner) {
    try { return localStorage.getItem("jr_tracker_backend") === "google" && S.userTracker ? "google" : "notion"; }
    catch { return "notion"; }
  }
  return S.userTracker ? "google" : "notion";
}
function trackerLabel() { return trackerBackend() === "google" ? "Google Sheets" : "Notion"; }
function setTrackerBackend(choice) {
  if (!S.auth?.owner) return;
  const next = choice === "google" && S.userTracker ? "google" : "notion";
  try { localStorage.setItem("jr_tracker_backend", next); } catch {}

const $ = sel => document.querySelector(sel);
const esc = s => (s??"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); };

// OAuth callbacks stay on the canonical Vercel host because GitHub/Google
// each accept one callback URL. The two app aliases use an opaque, short-lived
// handoff to mint their own host-scoped cookie; provider tokens never enter
// this page, localStorage, or the URL.
async function syncCanonicalSession() {
  if (!S.backend || !S.authHost || location.hostname.toLowerCase() === S.authHost.toLowerCase()) return false;
  try {
    const handoff = await fetch(`https://${S.authHost}/api/session-handoff`, {credentials:"include", cache:"no-store"});
    if (handoff.status === 401 || handoff.status === 403 || !handoff.ok) return false;
    const payload = await handoff.json();
    const applied = await fetch("/api/session-handoff", {method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({ticket:payload.ticket})});
    return applied.ok;
  } catch (error) {
    console.warn("[radar auth] canonical session handoff unavailable", error);
    return false;
  }
}
function authReturnState() {
  try {
    const value = new URLSearchParams(location.search).get("auth");
    return ["connected", "already-signed-in", "signed-out"].includes(value) ? value : "";
  } catch { return ""; }
}
function finishAuthReturn() {
  const state = authReturnState();
  if (!state) return;
  try { history.replaceState({}, document.title, location.pathname + location.hash); } catch {}
  if (state === "signed-out") { toast("Signed out on both Job Radar URLs"); return; }
  if (!S.auth) return;
  openTutorial("accounts");
  toast(state === "already-signed-in"
    ? "You were already signed in; your account is now available on this URL."
    : "Signed in — your account center is ready.");
}

/* ---------- theme ---------- */
$("#themeBtn").onclick = () => {

/* ---------- data ---------- */
function ownerDevMode() {
  return Boolean(S.auth?.owner && norm(S.auth.login) === "victorjimenez3");
}
function recordBootError(path, error, critical=false) {
  const message = error instanceof Error ? error.message : String(error || "unknown error");
  S.boot.errors = [...S.boot.errors.filter(item => item.path !== path), {path, message, critical}];
  console.error(`[radar boot] ${critical ? "critical" : "optional"} ${path}: ${message}`);
  renderBootNotice();
}
function clearBootError(path) {
  S.boot.errors = S.boot.errors.filter(item => item.path !== path);
  renderBootNotice();
}
function renderBootNotice() {
  const box = $("#bootNotice");
  if (!box) return;
  if (!ownerDevMode() || !S.boot.errors.length) {
    box.hidden = true; box.innerHTML = ""; return;
  }
  const critical = S.boot.errors.some(item => item.critical);
  const first = critical
    ? "The Jobs state did not load; the radar shell is still available."
    : "Some optional radar panels did not load; the available parts remain usable.";
  const rows = S.boot.errors.slice(0, 8).map(item =>
    `<li><span class="mono">${esc(item.path)}</span> — ${esc(item.message.slice(0,120))}</li>`).join("");
  box.hidden = false;
  box.innerHTML = `<div class="boot-notice" role="status" aria-live="polite">
    <strong>Radar developer notice · @${esc(S.auth.login)}</strong>
    <div>${first} No email or external issue was sent.</div>
    <details><summary>${S.boot.errors.length} load problem${S.boot.errors.length===1?"":"s"} · details</summary><ul>${rows}</ul></details>
    <div class="bar" style="margin:.55rem 0 0"><button class="act" onclick="retryBoot()">retry failed loads</button></div>
  </div>`;
}
async function loadState(path, fallback, {critical=false, allowMissing=false}={}) {
  try {
    const r = await fetch(RAW + path, {cache:"no-cache"});
    // The community-report log is created lazily by the first report-sync
    // workflow run. A missing log therefore means "no reports yet", not a
    // broken panel; malformed or unavailable existing files still surface to
    // the owner diagnostic below.
    if (allowMissing && r.status === 404) {
      clearBootError(path);
      return {value:fallback, ok:true};
    }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText || "request failed"}`);
    const value = await r.json();
    clearBootError(path);
    return {value, ok:true};
  } catch (error) {
    recordBootError(path, error, critical);
    return {value:fallback, ok:false};
  }
}
function localWebState() {
  try { return JSON.parse(localStorage.getItem(`jr_web_${S.lane}`) || '{"maybe":[],"jobs":{},"excluded":[]}'); }
  catch { return {maybe:[], jobs:{}, excluded:[]}; }
}
function normalizeWebState(web) {
  normalizeLaneWeb(S.lane, web || localWebState());
}
function rebuildCompanyRegistry() {
  for (const entry of Object.values(S.companies || {})) {
    const key = norm(entry.name);
    if (!S.registryByCompany[key] || entry.status === "active") S.registryByCompany[key] = entry;
  }
}
async function loadTrackerState(mode=S.lane) {
  if (!S.auth) return;
  try {
    const trackerResponse = mode === "new_grad"
      ? await fetch("/api/tracker")
      : await fetch(`/api/tracker?profile=${encodeURIComponent(mode)}`);
    if (!trackerResponse.ok) {
      if (trackerResponse.status >= 500) throw new Error(`${trackerResponse.status} tracker request failed`);
      return;
    }
    const tracker = await trackerResponse.json();
    S.trackerMeta = {...(S.trackerMeta || {}), ...tracker, profile:mode};
    S.userTracker = Boolean(tracker.configured);
    laneState(mode).expectedGraduation = tracker.expected_graduation || laneState(mode).expectedGraduation || "";
    if (!S.auth.owner) {
      setLaneValue(mode, "applied", tracker.entries || []);
      const web = laneState(mode).web || {jobs:{}, excluded:[]};
      normalizeLaneWeb(mode, {...web, maybe:tracker.maybe || []});
      if (mode === S.lane) render();

  } catch (error) {
    S.userTracker = false;
    recordBootError("/api/tracker", error, false);

}
async function retryBoot() {
  if (S.boot.inFlight) return;
  await boot();
}
async function boot() {
  if (S.boot.inFlight) return;

  S.boot.phase = "starting";
  S.boot.jobsReady = false;
  S.boot.errors = [];
  normalizeWebState();
  renderBootNotice();

    // Backend detection: on Vercel /api/me exists (401 = present, not signed
    // in). On GitHub Pages it 404s and the app falls back to tokenless mode.

    if (r.ok) S.auth = await r.json();

  } catch (error) { S.backend = false; recordBootError("/api/me", error); }
  // fork-portable repo resolution (see docs/FORKING.md)
  try {
    const ghHost = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (ghHost && seg) REPO = `${ghHost[1]}/${seg}`;
    if (S.backend) {
      const configResponse = await fetch("/api/config");
      if (!configResponse.ok) throw new Error(`${configResponse.status} config request failed`);
      const c = await configResponse.json();
      if (c.repo) REPO = c.repo;
      if (c.branch) BRANCH = c.branch;
      if (c.auth_host) S.authHost = c.auth_host;
      if (c.auth_providers) S.authProviders = c.auth_providers;
      S.trackerConfigured = Boolean(c.tracker_configured);
      // A session created on the canonical OAuth host is intentionally
      // copied to this alias only after the backend proves both hosts belong
      // to the same configured app.

        if (refreshed.ok) S.auth = await refreshed.json();
      }

      const d = await (await fetch(`${API}/repos/${REPO}`)).json();
      if (d.default_branch) BRANCH = d.default_branch;
    }

  normalizeWebState();
  S.boot.phase = "jobs";
  render();
  const jobsResult = await loadState("state/jobs.json", {}, {critical:true});
  setLaneValue("new_grad", "jobs", jobsResult.value);
  laneState("new_grad").ready = jobsResult.ok;
  S.boot.jobsReady = jobsResult.ok;
  const internshipJobs = await loadState("state/intern_jobs.json", {}, {allowMissing:true});
  setLaneValue("internship", "jobs", internshipJobs.value);
  laneState("internship").ready = internshipJobs.ok;

  // Jobs are the critical board. Every other repository state hydrates in its
  // own request, so one stale or malformed panel cannot blank the radar.

  const optional = [
    ["new_grad", "applied", "state/applied.json", [] , ownerView],
    ["new_grad", "feedback", "state/feedback.json", {}, ownerView],
    ["new_grad", "reports", "state/reports.json", {}, ownerView],
    ["new_grad", "culture", "state/culture.json", {}, true],
    ["new_grad", "research", "state/company_research.json", {}, true],
    ["new_grad", "scorePreferences", "state/score_preferences.json", {}, true],
    ["new_grad", "aiUsage", "state/ai_usage.json", {}, true],
    ["new_grad", "companies", "state/companies.json", {}, true],
    ["new_grad", "runs", "state/runs.json", [], true],
    ["new_grad", "scout", "state/scout.json", {}, true],
    ["new_grad", "web", "state/web_state.json", null, ownerView],
    ["internship", "applied", "state/intern_applied.json", [], ownerView],
    ["internship", "feedback", "state/intern_feedback.json", {}, ownerView],
    ["internship", "companies", "state/intern_companies.json", {}, ownerView],
    ["internship", "runs", "state/intern_runs.json", [], ownerView],
    ["internship", "web", "state/intern_web_state.json", null, ownerView],
    ["shared", "notifications", "state/notification_preferences.json", {new_grad_email:true, internship_email:false}, true],
  ].filter(([, , , , enabled]) => enabled);
  const optionalLoads = optional.map(async ([mode, key, path, fallback]) => {
    const result = await loadState(path, fallback, {allowMissing: path === "state/reports.json" || path.includes("intern_") || path.includes("notification_preferences")});
    if (mode === "shared") S.notifications = result.value;
    else if (key === "web") normalizeLaneWeb(mode, result.value);
    else setLaneValue(mode, key, result.value);

}

/* ---------- write paths ---------- */
async function gh(path, opts={}) {
  const r = await fetch(API + path, {...opts, headers: {
    "Authorization": `Bearer ${token()}`, "Accept": "application/vnd.github+json",
    ...(opts.headers||{}) }});
  if (!r.ok && r.status !== 409) throw new Error(`${r.status} ${await r.text()}`);
  return r;
}
async function dispatch(action, job, extra={}) {
  await gh(`/repos/${REPO}/dispatches`, {method:"POST",
    body: JSON.stringify({event_type:"radar-web",
      client_payload:{action, id: job.id, url: job.url, company: job.company,
        title: job.title, location: (job.locations||[])[0] || "",
        profile:S.lane, ...extra}})});
  return true;
}
// Tokenless write path: open a prefilled GitHub issue — your GitHub login is
// the auth. The radar only obeys the repo owner and auto-closes the issue.
function issueCmd(cmd, job) {
  const ref = cmd === "applied" ? (job.url || job.id) : job.id;
  const u = `https://github.com/${REPO}/issues/new?title=${
    encodeURIComponent(`radar: ${cmd} ${job.company}`)}&body=${
    encodeURIComponent(`radar-profile: ${S.lane}\n${cmd} ${ref}`)}`;
  window.open(u, "_blank");
  toast("Hit 'Create' on GitHub — it processes & auto-closes in ~1 min");
  return false;
}
function issueFeedback(job, vote, reason) {
  const body = `radar-profile: ${S.lane}\nfeedback ${job.id} ${vote} ${reason}`;
  const u = `https://github.com/${REPO}/issues/new?title=${
    encodeURIComponent(`radar: feedback ${job.company}`)}&body=${encodeURIComponent(body)}`;
  window.open(u, "_blank");
  toast("Hit 'Create' on GitHub — owner feedback processes in ~1 min");
  return false;
}
let saveTimer=null;
function saveWeb() {                       // debounce web_state commits
  localStorage.setItem(`jr_web_${S.lane}`, JSON.stringify(S.web));   // instant local mirror
  if (S.auth && S.auth.owner) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { const r = await fetch("/api/webstate", {method:"PUT",
              headers:{"Content-Type":"application/json"}, body: JSON.stringify({profile:S.lane,state:S.web})});
            if (!r.ok) throw new Error(r.status); }
      catch(e) { toast("Cloud save failed (kept locally): " + e.message); }
    }, 1500);
    return;
  }
  if (!token()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      let sha;
      const webPath = S.lane === "internship" ? "state/intern_web_state.json" : "state/web_state.json";
      const cur = await fetch(`${API}/repos/${REPO}/contents/${webPath}?ref=${BRANCH}`,
        {headers:{Authorization:`Bearer ${token()}`}});
      if (cur.ok) sha = (await cur.json()).sha;
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(S.web, null, 1))));
      await gh(`/repos/${REPO}/contents/${webPath}`, {method:"PUT",
        body: JSON.stringify({message:"platform: workspace update", content, sha, branch:BRANCH})});
    } catch(e) { toast("Cloud save failed (kept locally): " + e.message.slice(0,80)); }
  }, 1500);
}

/* ---------- derived ---------- */
const appliedById = () => Object.fromEntries(S.applied.map(a=>[a.id,a]));
function isExcluded(id) { return (S.web.excluded||[]).includes(id); }
function laneOf(id, byId) {
  const a = byId[id];
  if (a) return a.stage || "applied";

}
const ROLE_LABELS = {
  ai_ml:"AI / machine learning", swe:"Software engineering",
  data_science:"Data science", data_eng:"Data engineering",
  analytics:"Analytics / BI", pm:"Product / project management",
  other:"Adjacent / unclassified",
};
const PM_TITLE = /\b(?:apm|associate\s+product\s+manager|technical\s+product\s+manager|product\s+(?:manager|owner|management)|project\s+manager|business(?:\s+systems)?\s+analyst|(?:ux\s*\/\s*ui|ux|ui|user\s+experience|user\s+interface)\s+(?:researcher|research)|solutions?\s+architect(?:ure)?)\b/i;
const OFF_FIELD_TITLE = /\b(safeguards?|trust\s*(and|&)\s*safety|policy|counsel|legal|paralegal|compliance|recruit(er|ing)|talent\s+(acquisition|management|operations|partner)|people\s+(ops|operations)|human\s+resources|sales|account\s+(executive|manager)|business\s+(development|operations|analyst)|go[- ]to[- ]market|gtm|partnerships?|marketing|brand|communications?|public\s+relations|finance|financial\s+analyst|accounting|payroll|procurement|revenue|solutions?\s+(engineer|architect|consultant)|(?:technology|technical)\s+consultant|field\s+engineer|customer\s+(success|support|experience)|technical\s+support|support\s+(engineer|specialist)|help\s?desk|success\s+engineer|ai\s+governance|governance\s+and\s+advisory|(ux|ui|visual|graphic|product)\s+design(er)?|(product|program|project)\s+manager|product\s+(owner|marketing)|chief\s+of\s+staff|executive\s+assistant|administrative|workplace|facilities)\b/i;
const TECH_PROGRAM_TITLE = /\b(tldp|dsldp|eldp)\b|\b(leadership\s+(development\s+)?program|rotational\s+program|graduate\s+program(?:me)?|emerging\s+talent|future\s+talent)\b.*\b(technology|digital|data|ai|ml|software|engineering|it|analytics|cloud|devops|cyber)\b|\b(technology|digital|data|ai|ml|software|engineering|it|analytics|cloud|devops|cyber)\b.*\b(leadership|rotational|graduate|emerging\s+talent|future\s+talent)\b/i;
function roleFamily(j) {

const TASTE_STOPWORDS = new Set([

  "new","grad","early","career","level","full","time","remote","onsite",
  "hybrid","associate","analyst","manager","product","project","owner",

function tasteSample() {

    if (!j || seen.has(j.id)) continue;
    seen.add(j.id);

      stage:entry.stage||"saved", company:norm(j.company), role:roleFamily(j),
      sector:norm(j.sector), titleTokens:tasteTokens(j.title)});

}
function tasteCounts(sample) {
  const companies = {}, roles = {}, tokens = {};

    if (company) companies[company] = (companies[company]||0) + weight;
    roles[role] = (roles[role]||0) + weight;
    for (const t of titleTokens) tokens[t] = (tokens[t]||0) + weight;
  }
  const rank = obj => Object.entries(obj).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));

}
function similarityFor(job, sample) {
  const jt = tasteTokens(job.title), jr = roleFamily(job), js = norm(job.sector), jc = norm(job.company);
  let best = {score:0, why:""};
  for (const source of sample) {
    const overlap = [...jt].filter(t=>source.titleTokens.has(t));
    let score = Math.min(8, overlap.length * 2);
    const why = [];
    if (jc && jc === source.company) { score += 7; why.push("same company"); }
    if (jr === source.role) { score += 3; why.push(ROLE_LABELS[jr] || "same field"); }
    if (js && js === source.sector) { score += 1; why.push("same sector"); }
    if (overlap.length) why.push("shared " + overlap.slice(0,3).join(", "));
    if (score > best.score) best = {score, why:why.join(" · ")};

function tasteSimilarityCandidates(sample, savedIds) {
  const companies = new Set(sample.map(source=>source.company).filter(Boolean));
  const roles = new Set(sample.map(source=>source.role));
  const sectors = new Set(sample.map(source=>source.sector).filter(Boolean));
  const titleTokens = new Set(sample.flatMap(source=>[...source.titleTokens]));
  return Object.values(S.jobs)
    .filter(job => isOpenRelevant(job) && roleFamily(job)!=="other" && !savedIds.has(job.id))
    .map(job => {
      const company = norm(job.company), role = roleFamily(job), sector = norm(job.sector);
      const tokens = tasteTokens(job.title);
      const overlap = [...tokens].filter(token=>titleTokens.has(token)).length;
      const hint = (companies.has(company)?7:0) + (roles.has(role)?3:0) +
        (sectors.has(sector)?1:0) + Math.min(8, overlap * 2);
      return {job, hint};
    })
    .filter(row=>row.hint>0)
    .sort((a,b)=>b.hint-a.hint || (b.job.score||0)-(a.job.score||0) || postedTs(b.job)-postedTs(a.job))

  if (existing) {
    if (!quiet) toast(existing.stage === "applied" ? "Already marked applied" : "Already in To apply");
    return true;
  }
  try { if (await doWrite("track", j)) {
    S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"saved", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    if (!quiet) toast(trackerBackend() === "google"
      ? "Saved to To apply + your Google Sheets mirror"
      : "Saved to To apply → Notion syncs in ~1 min"); render(); return true; } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
  return false;
}
async function actApplied(j) {
  if (!j) return false;
  const existing = appliedById()[j.id];
  if (existing && (existing.stage||"applied") === "applied") {
    toast("Already marked applied"); return true;
  }
  try { if (await doWrite("applied", j)) {
    const a = appliedById()[j.id];
    if (a) a.stage = "applied";
    else S.applied.push({id:j.id, company:j.company, title:j.title, url:j.url, stage:"applied", via:"platform"});
    S.web.maybe = S.web.maybe.filter(x=>x!==j.id); saveWeb();
    toast(trackerBackend() === "google"
      ? "Marked applied + mirrored to Google Sheets"
      : "Marked applied → Notion status updates in ~1 min"); render(); return true; } }
  catch(e){ toast("Failed: "+e.message.slice(0,90)); }
  return false;
}
function startApply(j) {
  if (!j || !j.url) return;
  window.open(j.url, "_blank", "noopener");
  const lane = laneOf(j.id, appliedById());
  if (!lane && canWrite()) {
    actTrack(j, true).then(ok=>toast(ok
      ? "Application opened · saved to To apply"
      : "Application opened · saving failed, so use Save when you return"));
  } else {
    toast(lane === "applied" ? "Application opened · already marked applied"
      : lane === "saved" ? "Application opened · already in To apply"
      : "Application opened · save it when you want it in your pipeline");
  }
}

function stageControl(id, current) {
  if (!S.auth || (!S.userTracker && !S.auth.owner)) return "";
  const safeId = JSON.stringify(id);
  return `<label class="stage-control" onclick="event.stopPropagation()"><span>stage</span><select aria-label="Change application stage" onchange="setPipelineStage(${safeId},this.value)">

}
async function setPipelineStage(id, stage) {
  const job = jobById(id);
  if (!job || !PIPELINE_STAGES.some(([value]) => value === stage)) return;
  try {
    if (S.auth && S.userTracker) await trackerAction("stage", job, {stage});
    else if (S.auth?.owner) await apiAction("stage", job, {stage});
    else { toast("Connect Google before changing application stages"); return; }
    if (stage === "maybe") {
      S.applied = S.applied.filter(entry => entry.id !== id);
      if (!S.web.maybe.includes(id)) S.web.maybe.push(id);
    } else {
      S.web.maybe = S.web.maybe.filter(value => value !== id);
      const entry = S.applied.find(value => value.id === id);
      if (entry) entry.stage = stage;
      else S.applied.push({id, company:job.company, title:job.title, url:job.url, stage, via:"platform"});
    }
    saveWeb();
    toast(`Stage changed to ${stage === "oa" ? "online assessment" : stage}`);
    render();
  } catch (error) { toast("Stage update failed: " + error.message.slice(0, 90)); }
}

function scoreReasonLabel(reason) {
  const text = String(reason||"");
  const labels = [["base utility","baseline"],["role:","role fit"],["sector:","sector fit"],["new-grad/early-career priority","verified early-career"],["early-career possible","plausible first-role"],["new-grad evidence absent","early-career evidence"],["mid-level title penalty","mid-level demotion"],["company tier","company quality"],["explicit goal company","goal-company preference"],["duplicate role variant","duplicate posting"],["similar role sibling","similar-role adjustment"],["company concentration","company diversity"],["learned from","learned preferences"],["learned role preference","learned role preference"],["learned sector preference","learned sector preference"],["learned company preference","learned company preference"],["learned title signals","learned title language"],["explicit company feedback","explicit feedback"],["explicit title feedback","explicit feedback"],["compensation","compensation"],["posted","freshness"],["remote","remote access"],["culture fit","culture evidence"],["SHPE","community signal"],["sponsor history:","DOL sponsor context"],["raw utility","calibration"]];
  const found = labels.find(([prefix]) => text.startsWith(prefix));
  return found ? found[1] : "other signal";
}
const CONFIGURABLE_SCORE_DIMENSIONS = ["role_fit","mission","company_quality","compensation","personal_signal","timing_access"];
function scorePreferenceEnabled(name) {
  if (["base","eligibility"].includes(name)) return true;
  return S.scorePreferences?.enabled_dimensions?.[name] !== false;

}

const SCORE_DIMENSION_META = {
  base: {label:"Baseline", what:"Starting points for a posting that passed the keep checks.", locked:true},
  role_fit: {label:"Role fit", what:"How closely the title and posting wording match target work.", configurable:true},
  eligibility: {label:"Early-career evidence", what:"Proof that this is a realistic new-grad or first-role path.", locked:true},
  mission: {label:"Sector / mission", what:"Priority sectors and program mission signals.", configurable:true},
  company_quality: {label:"Company quality", what:"Company strength, goals, momentum, and culture evidence.", configurable:true},
  compensation: {label:"Compensation", what:"Published pay signals; this bonus is intentionally capped.", configurable:true},
  personal_signal: {label:"Your signals", what:"Saved, applied, skipped, feedback, or community history.", configurable:true},
  timing_access: {label:"Timing / access", what:"Posting freshness and remote access.", configurable:true},
};
function scoreReasonTexts(j) {
  return Array.isArray(j.score_reasons) ? j.score_reasons.map(reason => String(reason||"")) : [];
}
function scorePoints(value) {
  const points = Number(value);
  if (!Number.isFinite(points)) return String(value??"?");
  return `${points>=0?"+":""}${points} pts`;
}
function scoreReasonWithoutPoints(reason) {
  return String(reason||"").replace(/\s+[+-]?\d+(?:\.\d+)?(?:\s|$).*$/, "").trim();
}
function scorePrettyName(value) {
  return String(value||"").replaceAll("_", " ").replace(/\b\w/g, letter => letter.toUpperCase());
}
function scoreDimensionWhy(j, name, value) {
  const reasons = scoreReasonTexts(j);
  const points = Number(value);
  const positive = Number.isFinite(points) && points > 0;
  const roleReason = reasons.find(reason => /^role:/i.test(reason));
  const roleBucket = roleReason ? roleReason.replace(/^role:/i, "").replace(/\s+[+-]?\d+.*$/, "").trim() : "";
  if (name === "base") return positive ? "Every kept role starts here." : "No baseline points recorded.";
  if (name === "role_fit") {
    if (/^pm$/i.test(roleBucket)) return positive ? "PM-family lane: base role weight is 0; shown points come from extra wording signals." : "PM-family research lane; its configured role weight stays at 0.";
    const wording = reasons.filter(reason => /wording$|technical leadership program/.test(reason))
      .map(scoreReasonWithoutPoints).slice(0, 2);
    if (roleBucket && wording.length) return `Matched ${scorePrettyName(roleBucket)} work; ${wording.join(" and ")}.`;
    if (roleBucket && positive) return `Matched ${scorePrettyName(roleBucket)} target work.`;
    if (roleBucket) return `Matched ${scorePrettyName(roleBucket)}, but no extra role points applied.`;
    return positive ? "Posting wording matched a target role." : "No role-fit bonus recorded.";
  }
  if (name === "eligibility") {
    const midlevel = reasons.find(reason => reason.startsWith("mid-level title penalty"));
    if (midlevel) return "Level-II/L4-style title: kept for research, but it is not treated as a realistic new-grad target.";
    const verified = reasons.find(reason => /(?:trusted new-grad board|new-grad\/early-career) priority/.test(reason));
    if (verified) return /trusted new-grad board/.test(verified) ? "A trusted new-grad board supplied the evidence." : "The posting showed new-grad or early-career evidence.";
    if (reasons.some(reason => reason.startsWith("early-career possible"))) return "No experience floor, but new-grad proof is missing.";
    return "No verified new-grad or early-career evidence; this is the main limiter.";
  }
  if (name === "mission") {
    const sector = reasons.find(reason => /^sector:/.test(reason));
    const program = reasons.some(reason => reason.startsWith("target healthcare program company"));
    const sectorName = sector ? scorePrettyName(sector.replace(/^sector:/, "").replace(/\s+\+?\d+.*$/, "")) : "";
    if (sectorName && program) return `${sectorName} priority plus a target program signal.`;
    if (sectorName) return `${sectorName} is a priority sector; points taper across roles.`;
    if (program) return "Target healthcare program company matched.";
    return "No priority-sector or program-mission signal.";
  }
  if (name === "company_quality") {
    const signals = [];
    if (reasons.some(reason => reason.startsWith("company tier:"))) signals.push("marquee tier");
    if (reasons.some(reason => reason.startsWith("explicit goal company"))) signals.push("goal-company preference");
    if (reasons.some(reason => reason.startsWith("cited "))) signals.push("cited company evidence");
    if (reasons.some(reason => reason.startsWith("culture fit"))) signals.push("culture signal");
    if (!signals.length) return positive ? "Company evidence added a small boost." : "No cited company or preference bonus.";
    return `${points < 0 ? "Lowered by" : positive ? "Boosted by" : "No net boost from"} ${signals.join(", ")}.`;
  }
  if (name === "compensation") {
    const pay = reasons.find(reason => reason.startsWith("compensation ceiling"));
    return pay ? "Published high-end pay cleared the bonus threshold." : "No pay bonus: salary is missing or below the threshold.";
  }
  if (name === "personal_signal") {
    const signals = [];
    if (reasons.some(reason => reason.startsWith("learned "))) signals.push("your saved/applied sample");
    if (reasons.some(reason => reason.startsWith("explicit "))) signals.push("explicit feedback");
    if (reasons.some(reason => reason.startsWith("you've engaged with"))) signals.push("your company history");
    if (reasons.some(reason => reason.startsWith("previously skipped"))) signals.push("a previous skip");
    if (reasons.some(reason => reason.startsWith("title matches your history"))) signals.push("title history");
    if (reasons.some(reason => reason.startsWith("SHPE"))) signals.push("community signal");
    return signals.length ? `${positive ? "Boosted by" : "Lowered by"} ${signals.join(", ")}.` : "No saved, applied, or feedback signal yet.";
  }
  if (name === "timing_access") {
    const fresh = reasons.some(reason => reason.startsWith("posted "));
    const remote = reasons.some(reason => reason.startsWith("remote "));
    if (fresh && remote) return "Fresh posting plus remote access made it easier to act on.";
    if (fresh) return "Fresh posting added actionability.";
    if (remote) return "Remote access added actionability.";
    return "No freshness or remote-access bonus.";
  }
  return positive ? "Available signals added points." : "No points from the available signals.";
}
function scoreSummary(j, dimensions) {
  const reasons = scoreReasonTexts(j);
  if (reasons.some(reason => /^role:pm\b/i.test(reason))) return "PM-family research lane: role weight is 0; other signals are shown for comparison.";
  if (reasons.some(reason => reason.startsWith("mid-level title penalty"))) return "Research-only: this level-II/L4-style role is kept visible but scored below true new-grad targets.";
  const eligibility = Number(dimensions.eligibility);
  if (!Number.isFinite(eligibility) || eligibility <= 0) return "Main limiter: no verified new-grad evidence. The rows below show what still helped.";
  const score = Number(j.score);
  if (score >= 90) return "Strong: early-career evidence stacks with fit, company, or timing signals.";
  if (score >= 66) return "Alert range: early-career evidence plus enough fit signals.";
  return "Below the alert range: some key evidence or bonuses are missing.";
}
function scoreFinalWhy(j) {
  const reasons = scoreReasonTexts(j);
  const override = reasons.find(reason => reason.startsWith("configured score override:"));
  if (override) {
    const target = override.match(/->\s*(\d+)/)?.[1];
    return target ? `Configured preference override set this role to ${target}.` : "Configured preference override set the final score for this company and role type.";
  }
  if (reasons.some(reason => reason.startsWith("technical program display floor"))) return "Technical-program floor lifted the calibrated score to the alert threshold.";
  if (reasons.some(reason => reason.startsWith("duplicate role variant:"))) return "Duplicate posting: same company and title, so location/requisition variants stay tied.";
  if (reasons.some(reason => reason.startsWith("similar role sibling:"))) return "Similar-role adjustment separated this posting from a stronger sibling with a related title.";
  if (reasons.some(reason => reason.startsWith("company concentration:"))) return "Company-diversity adjustment nudged this role down after comparing several roles from the same employer.";
  return "";
}

function renderCosList() {
  const el = $("#cosList"); if (!el) return;
  const counts = {};

  for (const j of Object.values(S.jobs)) {
    const tracked = byId[j.id] || S.web.maybe.includes(j.id) || S.web.jobs[j.id];
    if (!isOpenRelevant(j) || roleFamily(j)==="other"
        || (!tracked && postedTs(j) && Date.now()/1000-postedTs(j) > 365*86400)
        || (!tracked && (j.score||0) < DEFAULT_FILTER.min)) continue;
    const k = norm(j.company);
    counts[k] = counts[k]||{name:j.company, open:0, best:0, bestId:j.id};
    counts[k].open++;
    if ((j.score||0) >= counts[k].best) { counts[k].best=j.score||0; counts[k].bestId=j.id; }
  }
  const q = norm(S.filter.q);
  let rows = Object.entries(counts).map(([k,v])=>({k, ...v, c:S.culture[k], d:S.research[k]}));

// ---------- owner testing lab --------------------------------------------
// This is deliberately a public-data preview. The real evidence graph, source
// documents, prompts, and generated resumes remain under ignored CV/ on the
// owner's Mac. Hiding the tab is product access control, not a claim that
// static JavaScript in a public repository can hold secrets.
const TEST_MATCH_VERSION = "title-preview-v1 · full Resume Match stays local";
const TEST_CAPABILITIES = {
  ai_ml:{strength:.95, terms:["ai","ml","machine learning","deep learning","model","inference","pytorch"]},
  llm_rag:{strength:.92, terms:["llm","rag","generative ai","agentic","retrieval","embedding"]},
  data_science:{strength:.95, terms:["data scientist","data science","analytics","statistic","quantitative"]},
  software:{strength:.90, terms:["software","developer","engineering","backend","frontend","full stack","api"]},
  backend_cloud:{strength:.85, terms:["cloud","backend","kubernetes","docker","platform"]},
  systems:{strength:.72, terms:["systems","infrastructure","distributed","performance","compiler","hpc"]},
  databases:{strength:.85, terms:["database","sql","data engineer","data platform"]},
  research:{strength:.90, terms:["research","scientist","experimental"]},
  computer_vision:{strength:.82, terms:["computer vision","vision","image","video","perception"]},
  hardware:{strength:.65, terms:["hardware","embedded","firmware","gpu","chip","silicon"]},
  security:{strength:.75, terms:["security","privacy","cyber"]},
  health:{strength:.90, terms:["health","clinical","medical","biomedical","patient","drug"]},
  quantum:{strength:.76, terms:["quantum","qubit"]},
  leadership:{strength:.90, terms:["leadership","rotational","program"]},
};
const TEST_DOMAIN_CLUSTER = {healthtech:"health", ai_lab:"ai_ml", big_tech:"systems",
  sports:"data_science", video_games:"software", edtech:"llm_rag", fintech:"data_science"};
function testClusters(j) {
  const text = norm(`${j.title||""} ${j.sector||""}`);
  const hits = Object.entries(TEST_CAPABILITIES)
    .filter(([,cap])=>cap.terms.some(term=>text.includes(norm(term))))
    .map(([name])=>name);
  return hits.length ? hits : ["software"];
}
function testingMatch(j) {
  const clusters = testClusters(j);
  const strengths = clusters.map(name=>TEST_CAPABILITIES[name]?.strength||.5);
  const evidence = strengths.reduce((a,b)=>a+b,0) / strengths.length;
  const title = norm(j.title||"");
  const specific = Object.entries(TEST_CAPABILITIES).flatMap(([name,cap])=>
    cap.terms.filter(term=>title.includes(norm(term))).map(()=>cap.strength));
  const direct = specific.length ? specific.reduce((a,b)=>a+b,0)/specific.length : 0;
  const domain = TEST_DOMAIN_CLUSTER[j.sector];
  const dimensions = {
    required_coverage:Math.round(25 + 10*direct),
    preferred_coverage:10,
    evidence_strength:Math.round(20*evidence),
    domain_relevance:domain && clusters.includes(domain) ? 10 : 6,
    eligibility:j.alert_ok ? 10 : j.early_career_possible ? 6 : 3,
    distinctiveness:clusters.some(c=>["research","health","quantum","security","computer_vision"].includes(c)) ? 5 : 3,
  };
  const score = Math.min(100,Object.values(dimensions).reduce((a,b)=>a+b,0));
  return {version:TEST_MATCH_VERSION, score, confidence:"low", dimensions, clusters,
    reasons:[`title capabilities: ${clusters.join(", ")}`,
      j.alert_ok?"verified alert-eligible role":j.early_career_possible?"early-career possible; eligibility unverified":"eligibility not established",
      "full posting and private source-level evidence are evaluated on the Mac"]};
}
function testingRows() {
  const q = norm(S.testing.q);
  let rows = Object.values(S.jobs).filter(isOpenRelevant)
    .filter(j=>!postedTs(j) || Date.now()/1000-postedTs(j)<=365*86400)
    .filter(j=>roleFamily(j)!=="other")
    .filter(j=>!q || norm(`${j.company} ${j.title}`).includes(q))
    .map(j=>({job:j, match:testingMatch(j)}));
  if (S.testing.sort === "new") rows.sort((a,b)=>postedTs(b.job)-postedTs(a.job));
  else if (S.testing.sort === "radar") rows.sort((a,b)=>(b.job.score||0)-(a.job.score||0) || b.match.score-a.match.score);
  else rows.sort((a,b)=>b.match.score-a.match.score || (b.job.score||0)-(a.job.score||0) || postedTs(b.job)-postedTs(a.job));
  return rows;
}

    </div><p class="sub">${rows.length} open technical roles · Match uses the fixed 35/20/20/10/10/5 rubric. This phone preview is intentionally title-only; selecting Tailor on the Mac adds the full posting and source-addressed private evidence graph.</p></div>
    <div class="lane">${rows.slice(0,S.testing.shown).map(testingRoleHTML).join('')||'<p class="sub">No matching roles.</p>'}
      ${rows.length>S.testing.shown?`<button class="act" onclick="S.testing.shown+=40;rTesting()">show 40 more</button>`:''}</div>
  </section><aside class="testing-stack">
    <div class="lane"><h3>What is live</h3><div class="kv">
      <span class="k">Resume Match</span><span>best-fit, newest, and Radar ranking</span>

    </div></div>
    <div class="lane"><h3>Scoring calibration v9</h3>
      <p><b>${calibrated.length.toLocaleString()}</b> jobs currently carry the new raw-utility and calibrated-score ledger in production state.</p>
      <p class="sub">Explicit new-grad evidence is strongest; plausible no-floor roles receive a smaller lift. Dimensions can compensate, eligibility remains a hard gate, and only weaker roles from a crowded company receive the transparent -1/-2 diversity nudge.</p></div>
    <div class="lane"><h3>Non-negotiable QA</h3><div class="gate-row">
      <span class="chip good">company first</span><span class="chip good">one page</span>
      <span class="chip good">0% format growth</span><span class="chip good">+1 bullet capacity reported</span>
      <span class="chip good">12pt right-edge safety</span><span class="chip good">claims cited</span>
      </div><p class="sub">A draft is never marked ready unless the PDF compiles and every independent gate passes. The reviewer cannot alter its weights or lower the bar.</p></div>
    <div class="note"><b>Why PDFs are not here:</b> CV/ is personal and gitignored by contract. Production shows the control plane and ranking; actual resume documents remain private on the Mac.</div>
  </aside></div>`;
}
